<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>骑自行车的鹈鹕</title>
<style>
  :root {
    --bg1: #171c2b;
    --bg2: #2a3350;
    --ink: #f4f1e8;
    --muted: #b6bdd1;
    --accent: #f6c445;
    --btn: #36415f;
    --btn-hover: #46537a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at 50% -10%, var(--bg2), var(--bg1) 70%);
    color: var(--ink);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 16px;
  }
  h1 { margin: 0; font-size: clamp(18px, 3.2vw, 26px); font-weight: 650; letter-spacing: .3px; }
  .stage {
    width: min(100%, 960px);
    border-radius: 18px;
    overflow: hidden;
    background: #8fd0f2;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .45), 0 0 0 1px rgba(255, 255, 255, .06);
  }
  .stage svg { display: block; width: 100%; height: auto; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px 22px; align-items: center; justify-content: center; }
  button {
    font: inherit; color: var(--ink); background: var(--btn);
    border: 1px solid rgba(255, 255, 255, .14); border-radius: 999px;
    padding: 8px 20px; min-width: 100px; cursor: pointer;
  }
  button:hover { background: var(--btn-hover); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  label { display: flex; align-items: center; gap: 10px; color: var(--muted); }
  input[type="range"] { width: 180px; accent-color: var(--accent); }
  output { min-width: 3.4em; color: var(--ink); font-variant-numeric: tabular-nums; }
  .hint { margin: 0; color: var(--muted); font-size: 13px; }
</style>
</head>

</div>
<p class="hint">按空格键暂停或继续</p>

<script>
(() => {
  'use strict';
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const f = n => Math.round(n * 100) / 100;
  function mk(tag, attrs, parent) {
    const node = document.createElementNS(NS, tag);
    for (const k in attrs) node.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(node);
    return node;
  }

  // Tiny seeded random generator, so the scenery looks the same on every load.
  let seed = 20261118;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  // ---- Geometry (SVG units, viewBox 800 x 480) ----
  const R = 60;                        // outer tyre radius: a wheel rolls R px per radian
  const BB = { x: 370, y: 348 };       // bottom bracket (crank axle)
  const CRANK = 26;                    // crank arm length
  const THIGH = 78, SHIN = 78;         // leg bones
  const ANKLE = { x: -5, y: -9 };      // ankle position relative to the pedal axle
  const HIP_NEAR = { x: 340, y: 216 }, HIP_FAR = { x: 334, y: 218 };
  const SHOULDER_NEAR = { x: 372, y: 180 }, SHOULDER_FAR = { x: 366, y: 175 };
  const GRIP_NEAR = { x: 440, y: 219 }, GRIP_FAR = { x: 446, y: 214 };
  const WING_LEN = 78;                 // the wing paths are drawn for this shoulder-to-grip length
  const BASE_SPEED = 240;              // px per second at 1x
  const CADENCE = 1.1;                 // crank turns per wheel turn (a very easy gear!)

  // ---- Wheels: tread, spokes, valve, hub (plus the rear sprocket) ----
  function buildWheel(g, withCog) {
    const p = (2 * Math.PI * 57.5) / 44;
    mk('circle', { r: 57.5, fill: 'none', stroke: '#3f4259', 'stroke-width': 3,
      'stroke-dasharray': `${(p * 0.4).toFixed(4)} ${(p * 0.6).toFixed(4)}` }, g);
    for (let i = 0; i < 16; i++) {
      const a = (i / 16) * Math.PI * 2, b = a + (i % 2 ? 0.38 : -0.38);
      mk('line', { x1: f(6 * Math.cos(a)), y1: f(6 * Math.sin(a)), x2: f(47.5 * Math.cos(b)), y2: f(47.5 * Math.sin(b)),
        stroke: '#aeb5c2', 'stroke-width': 1.2 }, g);
    }
    mk('rect', { x: -2, y: -49, width: 4, height: 7, rx: 1, fill: '#6f7586' }, g);
    mk('circle', { r: 7, fill: '#c9ced8', stroke: '#596071', 'stroke-width': 1.5 }, g);
    if (withCog) mk('circle', { r: 8, fill: 'none', stroke: '#3a3d4c', 'stroke-width': 2.4, 'stroke-dasharray': '1.7 1.4416' }, g);
    mk('circle', { r: 2.2, fill: '#596071' }, g);
  }
  const rearSpin = $('rearSpin'), frontSpin = $('frontSpin');
  buildWheel(rearSpin, true);
  buildWheel(frontSpin, false);

  // ---- Scenery that is easier to scatter with code ----
  const dashes = $('dashes');
  for (let x = 0; x <= 880; x += 80) mk('rect', { x, y: 420, width: 44, height: 4, rx: 2 }, dashes);

  const speckTile = $('speckTile');
  for (let i = 0; i < 80; i++) {
    mk('circle', { cx: f(rnd() * 800), cy: f(389 + rnd() * 66), r: f(0.5 + rnd() * 1.2),
      fill: rnd() < 0.55 ? '#6b7080' : '#3d414e' }, speckTile);
  }

  const vergeTile = $('vergeTile');
  for (let i = 0; i < 26; i++) {
    mk('use', { href: '#tuft', transform: `translate(${f(12 + rnd() * 776)} 386) scale(${f(0.7 + rnd() * 0.6)})` }, vergeTile);
  }
  const petals = ['#fff6d6', '#ffd166', '#f28fad', '#c3a6f0'];
  for (let i = 0; i < 16; i++) {
    const x = f(12 + rnd() * 776), y = f(372 + rnd() * 9);
    mk('line', { x1: x, y1: y, x2: x, y2: 386, stroke: '#5c9f68', 'stroke-width': 1.2 }, vergeTile);
    mk('circle', { cx: x, cy: y, r: f(1.8 + rnd() * 1.2), fill: petals[Math.floor(rnd() * petals.length)] }, vergeTile);
  }

  const frontTile = $('frontTile');
  for (let i = 0; i < 22; i++) {
    mk('use', { href: '#tuft', transform: `translate(${f(12 + rnd() * 776)} ${f(474 + rnd() * 5)}) scale(${f(1.1 + rnd() * 0.7)})` }, frontTile);
  }

  const speedLines = $('speedLines');
  const streaks = [[128, 60, 0], [166, 44, 110], [212, 70, 40], [252, 38, 170], [292, 52, 80]].map(([y, len, ph]) =>
    ({ len, ph, line: mk('line', { x1: 0, y1: y, x2: 0, y2: y, 'stroke-width': 2.4 }, speedLines) }));

  // Dust puffs: a small pool of circles that get reused.
  const dustLayer = $('dustLayer');
  const puffs = Array.from({ length: 18 }, () => ({
    node: mk('circle', { r: 0, fill: '#efe6cf', opacity: 0 }, dustLayer), life: 0, max: 1, x: 0, y: 0, vx: 0, vy: 0, grow: 0 }));
  function spawnPuff(speed) {
    const p = puffs.find(q => q.life <= 0);
    if (!p) return;
    p.max = p.life = 0.5 + rnd() * 0.45;
    p.x = 250 - rnd() * 8;
    p.y = 396 + rnd() * 3;
    p.vx = -speed * (0.8 + rnd() * 0.2);
    p.vy = -(8 + rnd() * 16);
    p.grow = 5 + rnd() * 4;
  }
  function updatePuffs(dt) {
    for (const p of puffs) {
      if (p.life <= 0) continue;
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy *= Math.exp(-2 * dt);
      const k = 1 - Math.max(0, p.life) / p.max;
      p.node.setAttribute('cx', f(p.x));
      p.node.setAttribute('cy', f(p.y));
      p.node.setAttribute('r', f(2 + k * p.grow));
      p.node.setAttribute('opacity', p.life > 0 ? f(0.5 * (1 - k)) : 0);
    }
  }

  // Chain links: make the dash pattern divide the loop evenly so there is no seam.
  const chain = $('chain');
  const chainLen = chain.getTotalLength();
  const linkLen = chainLen / Math.round(chainLen / 5.2);
  chain.setAttribute('stroke-dasharray', `${(linkLen * 0.55).toFixed(4)} ${(linkLen * 0.45).toFixed(4)}`);

  const el = {};
  ['rig', 'rider', 'headBack', 'headFront', 'neck', 'neckO', 'pouch', 'lid', 'crest', 'tail', 'scarf1', 'scarf2',
    'nearWing', 'farWing', 'nearPedal', 'farPedal', 'nearCrank', 'nearCrankO', 'farCrank', 'ring',
    'nearThigh', 'nearShin', 'nearShinO', 'nearFoot', 'farThigh', 'farShin', 'farShinO', 'farFoot',
    'cloudLayer', 'mountLayer', 'farLayer', 'nearLayer', 'vergeLayer', 'specks', 'frontLayer'].forEach(id => { el[id] = $(id); });

  // ---- Helpers ----
  // Two-bone IK: where the knee goes for a leg from hip h to ankle p (knee bends forward, toward +x).
  function ik(h, p, a, b) {
    const dx = p.x - h.x, dy = p.y - h.y;
    const d = Math.min(a + b - 0.01, Math.max(Math.abs(a - b) + 0.01, Math.hypot(dx, dy)));
    const ang = Math.atan2(dy, dx) - Math.acos((a * a + d * d - b * b) / (2 * a * d));
    return { x: h.x + a * Math.cos(ang), y: h.y + a * Math.sin(ang) };
  }

  // Feathered thigh: a tapered drumstick from hip H to knee K with a ragged feather fringe at the knee.
  function thighPath(H, K) {
    const dx = K.x - H.x, dy = K.y - H.y, L = Math.hypot(dx, dy) || 1;
    const ux = dx / L, uy = dy / L, nx = -uy, ny = ux;
    const P = (o, side, along) => `${f(o.x + nx * side + ux * along)},${f(o.y + ny * side + uy * along)}`;
    return `M${P(H, 11, 0)} L${P(K, 7.5, -2)} L${P(K, 6, 5)} L${P(K, 3, 2.5)} L${P(K, 0.5, 7)} L${P(K, -2.5, 2.5)}` +
      ` L${P(K, -5.5, 6)} L${P(K, -7.5, -2)} L${P(H, -11, 0)} A11,11 0 0 0 ${P(H, 11, 0)} Z`;
  }

  function setLeg(side, hip, pedal, footDeg) {
    // The foot pivots around the pedal axle, so the ankle swings a little as the foot tilts.
    const r = footDeg / 180 * Math.PI, cr = Math.cos(r), sr = Math.sin(r);
    const A = { x: pedal.x + ANKLE.x * cr - ANKLE.y * sr, y: pedal.y + ANKLE.x * sr + ANKLE.y * cr };
    const K = ik(hip, A, THIGH, SHIN);
    const shin = `M${f(K.x)},${f(K.y)} L${f(A.x)},${f(A.y)}`;
    el[side + 'ShinO'].setAttribute('d', shin);
    el[side + 'Shin'].setAttribute('d', shin);
    el[side + 'Thigh'].setAttribute('d', thighPath(hip, K));
    el[side + 'Foot'].setAttribute('transform', `translate(${f(A.x)} ${f(A.y)}) rotate(${f(footDeg)})`);
  }

  // Wings are drawn pointing along +x, WING_LEN long; stretch and turn them from shoulder to grip.
  function setWing(w, S, G) {
    const dx = G.x - S.x, dy = G.y - S.y;
    const ang = Math.atan2(dy, dx) * 180 / Math.PI;
    w.setAttribute('transform', `translate(${f(S.x)} ${f(S.y)}) rotate(${f(ang)}) scale(${(Math.hypot(dx, dy) / WING_LEN).toFixed(4)} 1)`);
  }

  function setLine(l, a, b) {
    l.setAttribute('x1', f(a.x)); l.setAttribute('y1', f(a.y));
    l.setAttribute('x2', f(b.x)); l.setAttribute('y2', f(b.y));
  }

  const shift = (g, x) => g.setAttribute('transform', `translate(${f(-x)} 0)`);

  // A scarf tail: a ribbon streaming back (-x) from (rx, ry), with a travelling wave and a forked end.
  function ribbon(rx, ry, len, lift, amp, ph, w0, w1) {
    const N = 16, top = [], bot = [];
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      const x = rx - len * t;
      const y = ry - lift * t + Math.sin(t * 5.5 - ph) * amp * t;
      const w = w0 + (w1 - w0) * t;
      top.push(`${f(x)},${f(y - w)}`);
      bot.push(`${f(x)},${f(y + w)}`);
    }
    const tipY = ry - lift + Math.sin(5.5 - ph) * amp;
    return `M${top.join(' L')} L${f(rx - len + 7)},${f(tipY)} L${bot.reverse().join(' L')} Z`;
  }

  // ---- State ----
  const playBtn = $('playBtn'), speedInput = $('speed'), speedOut = $('speedOut');
  const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const DEG = 180 / Math.PI;
  let playing = !reduceMotion, dirty = true;
  let speedMul = 1, dist = 0, time = 0, last = 0, scarfPh = 0;
  let puffClock = 0, nextBlink = 1.5 + rnd() * 2, blinkT = -1;

  function render(dt) {
    // Scenery: every layer slides at its own speed (parallax).
    shift(el.cloudLayer, (dist * 0.06 + time * 6) % 800);
    shift(el.mountLayer, (dist * 0.12) % 800);
    shift(el.farLayer, (dist * 0.22) % 800);
    shift(el.nearLayer, (dist * 0.45) % 800);
    shift(el.vergeLayer, (dist * 0.9) % 800);
    shift(el.specks, dist % 800);
    shift(dashes, dist % 80);
    shift(el.frontLayer, (dist * 1.15) % 800);

    // Drive train: the wheels roll without slipping and the cranks follow.
    const wheel = dist / R;
    const crank = wheel * CADENCE;
    const wheelDeg = f((wheel * DEG) % 360);
    rearSpin.setAttribute('transform', `rotate(${wheelDeg})`);
    frontSpin.setAttribute('transform', `rotate(${wheelDeg})`);
    el.ring.setAttribute('transform', `translate(${BB.x} ${BB.y}) rotate(${f((crank * DEG) % 360)})`);
    chain.setAttribute('stroke-dashoffset', ((crank * 17) % linkLen).toFixed(3));

    const c = Math.cos(crank), s = Math.sin(crank);
    const pn = { x: BB.x + CRANK * c, y: BB.y + CRANK * s };
    const pf = { x: BB.x - CRANK * c, y: BB.y - CRANK * s };
    setLine(el.nearCrankO, BB, pn);
    setLine(el.nearCrank, BB, pn);
    setLine(el.farCrank, BB, pf);
    el.nearPedal.setAttribute('transform', `translate(${f(pn.x)} ${f(pn.y)})`);
    el.farPedal.setAttribute('transform', `translate(${f(pf.x)} ${f(pf.y)})`);

    // Body: a bounce on every pedal stroke, the head following a beat later, plus a little road buzz.
    const bob = 1.8 * Math.sin(2 * crank);
    const headLag = 1.3 * Math.sin(2 * crank - 0.8);
    const nod = 1.6 * Math.sin(2 * crank - 1.1);
    const buzz = 0.4 * Math.sin(dist * 0.045) + 0.25 * Math.sin(dist * 0.13 + 1.3);
    el.rig.setAttribute('transform', `translate(0 ${f(buzz)})`);
    el.rider.setAttribute('transform', `translate(0 ${f(bob)})`);
    const headTx = `translate(0 ${f(headLag)}) rotate(${f(nod)} 416 100)`;
    el.headBack.setAttribute('transform', headTx);
    el.headFront.setAttribute('transform', headTx);
    const neckD = `M384,178 C412,148 386,${f(121 + headLag * 0.6)} 414,${f(97 + headLag)}`;
    el.neckO.setAttribute('d', neckD);
    el.neck.setAttribute('d', neckD);

    // Legs and wings: hips and shoulders ride with the body, feet stay on the pedals, wing tips on the bars.
    setLeg('near', { x: HIP_NEAR.x, y: HIP_NEAR.y + bob }, pn, 8 * s);
    setLeg('far', { x: HIP_FAR.x, y: HIP_FAR.y + bob }, pf, -8 * s);
    setWing(el.farWing, { x: SHOULDER_FAR.x, y: SHOULDER_FAR.y + bob }, GRIP_FAR);
    setWing(el.nearWing, { x: SHOULDER_NEAR.x, y: SHOULDER_NEAR.y + bob }, GRIP_NEAR);

    // The pouch wobbles like a water balloon.
    const sag = 2.6 * Math.sin(2 * crank - 1.4) + 1.1 * Math.sin(time * 7.5);
    el.pouch.setAttribute('d', `M434,99 L538,107 C522,${f(133 + sag)} 478,${f(150 + 1.2 * sag)} 446,${f(133 + 0.5 * sag)} C434,${f(126 + 0.3 * sag)} 428,113 434,99 Z`);

    // Wind: the crest, tail and scarf flutter harder the faster we go.
    const wind = 0.5 + 0.6 * speedMul;
    el.crest.setAttribute('transform', `rotate(${f(-2 + 4 * wind * Math.sin(time * 13))} 404 84)`);
    el.tail.setAttribute('transform', `rotate(${f(2.2 * wind * Math.sin(time * 9 + 0.6))} 302 198)`);
    scarfPh += dt * (8 + 5 * speedMul);
    el.scarf1.setAttribute('d', ribbon(383, 151, 96, 12, 5 + 3 * speedMul, scarfPh, 5.5, 3.6));
    el.scarf2.setAttribute('d', ribbon(384, 157, 74, 0, 4 + 2.5 * speedMul, scarfPh + 1.4, 4.6, 3.2));

    if (dt > 0) {
      // Blink every few seconds.
      if (blinkT >= 0) {
        blinkT += dt;
        if (blinkT > 0.18) blinkT = -1;
      } else if ((nextBlink -= dt) <= 0) {
        blinkT = 0;
        nextBlink = 2.5 + rnd() * 3;
      }
      // Dust kicked up behind the back wheel.
      puffClock += dt;
      const every = 0.13 / speedMul;
      while (puffClock >= every) {
        puffClock -= every;
        spawnPuff(BASE_SPEED * speedMul);
      }
      updatePuffs(dt);
    }
    const lidS = blinkT >= 0 ? Math.sin(Math.PI * blinkT / 0.18) : 0;
    if (lidS > 0.02) {
      el.lid.removeAttribute('display');
      el.lid.setAttribute('transform', `translate(0 79) scale(1 ${f(lidS)}) translate(0 -79)`);
    } else {
      el.lid.setAttribute('display', 'none');
    }

    // Speed streaks fade in above 1.2x; each one fades in and out along its run.
    const streakOp = Math.min(1, Math.max(0, speedMul - 1.2)) * 0.65;
    speedLines.setAttribute('opacity', f(streakOp));
    if (streakOp > 0) {
      for (const st of streaks) {
        const u = ((dist * 1.6 + st.ph) % 320) / 320;
        const x = 330 - u * 330;
        st.line.setAttribute('x1', f(x));
        st.line.setAttribute('x2', f(x + st.len));
        st.line.setAttribute('opacity', f(Math.sin(Math.PI * u)));
      }
    }
  }

  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    if (playing) {
      time += dt;
      dist += BASE_SPEED * speedMul * dt;
    }
    if (playing || dirty) {
      render(playing ? dt : 0);
      dirty = false;
    }
    requestAnimationFrame(frame);
  }

  // ---- Controls ----
  function setPlaying(p) {
    playing = p;
    playBtn.textContent = p ? '暂停' : '播放';
  }
  function setSpeed(v) {
    speedMul = Math.min(2.5, Math.max(0.25, v || 1));
    speedOut.textContent = speedMul.toFixed(2) + '×';
    dirty = true;
  }
  playBtn.addEventListener('click', () => setPlaying(!playing));
  speedInput.addEventListener('input', () => setSpeed(parseFloat(speedInput.value)));
  document.addEventListener('keydown', e => {
    if (!(e.code === 'Space' || e.key === ' ') || e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target instanceof HTMLButtonElement) return; // a focused button already turns Space into a click
    e.preventDefault();
    setPlaying(!playing);
  });

  setSpeed(parseFloat(speedInput.value));
  setPlaying(playing);
  render(0);
  requestAnimationFrame(t => { last = t; frame(t); });
})();
</script>
</body>
</html>
