<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>柒柿AI · Demo 主响应</title>
<style>
:root{--paper:#f6f5ef;--ink:#141414;--muted:#6f6b63;--line:#ddd8cd;--yellow:#ffd84a;--deep:#e0a800;--white:#fff}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,sans-serif;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 26px;border-bottom:1px solid var(--line);background:rgba(246,245,239,.94);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:12px}
.name{font-size:20px;font-weight:700}.name span{font-size:12px;color:var(--muted);font-weight:500;margin-left:6px}
.tag{font-size:12px;color:var(--muted);margin-top:2px}
main{width:min(900px,calc(100% - 28px));margin:0 auto;flex:1;padding:20px 0 8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stats div{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column}
.stats b{font-size:20px}.stats span{font-size:11px;color:var(--muted);margin-top:3px}
.chat{background:var(--white);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 18px 50px rgba(20,20,20,.06);display:flex;flex-direction:column;height:min(64vh,620px)}
.messages{padding:18px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;flex:1}
.msg{display:flex;gap:10px;align-items:flex-start}.msg.user{flex-direction:row-reverse}
.avatar{width:30px;height:30px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--yellow)}
.msg.user .avatar{background:var(--ink);color:var(--yellow)}
.bubble{background:#fbfaf6;border:1px solid var(--line);border-radius:14px;padding:11px 14px;max-width:min(720px,88%);line-height:1.75;font-size:14px}
.msg.user .bubble{background:#fff6d6;border-color:#f0dfa0}
.bubble p{margin:0 0 8px;white-space:pre-wrap}.bubble p:last-child{margin-bottom:0}
.meta{margin-top:8px;font-size:11.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:7px}
.meta b{color:var(--deep)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chips button{border:1px solid var(--line);background:var(--white);border-radius:999px;padding:6px 11px;font-size:12px;cursor:pointer;font-family:inherit}
.chips button:hover{border-color:var(--deep);background:#fffaf0}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:#fbfaf6}
.composer input{flex:1;border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:14px;font-family:inherit;outline:none}
.composer input:focus{border-color:var(--deep);box-shadow:0 0 0 3px rgba(224,168,0,.14)}
.composer button{border:0;background:var(--ink);color:var(--yellow);border-radius:12px;padding:0 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
details{margin-top:10px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px 10px}
summary{cursor:pointer;color:var(--deep);font-size:12.5px}
pre{max-height:260px;overflow:auto;font-size:11px;line-height:1.5;background:#0f0f0f;color:#e8e4d8;padding:10px;border-radius:8px;white-space:pre-wrap}
.note{color:var(--muted);font-size:12px;margin:12px 2px 4px;line-height:1.6}
footer{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;padding:12px 26px;border-top:1px solid var(--line)}
@media(max-width:620px){.stats{grid-template-columns:repeat(3,1fr)}.chat{height:68vh}}
</style>
</head>

e:10px; color:#5d8199; letter-spacing:.06em}\n  /* toasts */\n  #toasts{position:fixed; left:16px; bottom:16px; z-index:50; display:flex; flex-direction:column; gap:8px; pointer-events:none}\n  .toast{display:flex; align-items:center; gap:9px; font-size:13px; font-family:var(--mono);\n    background:rgba(8,26,38,.94); border:1px solid var(--cyan); border-left-width:4px; color:var(--foam);\n    padding:10px 15px; border-radius:10px; box-shadow:0 8px 26px rgba(0,0,0,.45);\n    animation:toastIn .3s cubic-bezier(.2,1.2,.4,1) both}\n  .toast.out{animation:toastOut .3s ease both}\n  .toast .dot{width:8px; height:8px; border-radius:50%; flex:none}\n  @keyframes toastIn{from{opacity:0; transform:translateX(-24px)}to{opacity:1; transform:none}}\n  @keyframes toastOut{to{opacity:0; transform:translateY(10px)}}\n  noscript{display:block; padding:30px; font-size:15px; color:var(--amber)}\n  @media (max-width:900px){\n    main{grid-template-columns:1fr; grid-template-rows:minmax(0,1fr) auto}\n    #panel{max-height:46dvh; border-left:none; border-top:2px solid var(--line)}\n    .tagline{display:none}\n    .hud .chip{font-size:10.5px; padding:4px 8px}\n    .btn-grid{grid-template-columns:1fr 1fr 1fr}\n  }\n  @media (max-width:560px){ .btn-grid{grid-template-columns:1fr 1fr} .wordmark{font-size:17px} }\n  @media (prefers-reduced-motion: reduce){\n    *{animation:none !important; transition:none !important}\n  }\n<\/style>\n<\/head>\n<body>\n\n<header>\n  <div class=\"brand\">\n    <svg width=\"30\" height=\"30\" viewBox=\"0 0 32 32\" aria-hidden=\"true\">\n      <circle cx=\"13\" cy=\"13\" r=\"9\" fill=\"#fbf3e4\"/>\n      <path d=\"M18 10 L31 13 Q32.5 13.6 31.4 15 L18 15 Z\" fill=\"#ffb02e\"/>\n      <path d=\"M18 15 Q24 21 30.6 15.2 L18 16.5 Z\" fill=\"#ff8a3d\"/>\n      <circle cx=\"15.5\" cy=\"10.5\" r=\"1.8\" fill=\"#1b2430\"/>\n      <path d=\"M6 8 Q8 3 14 4\" stroke=\"#ff5d4d\" stroke-width=\"3\" fill=\"none\" stroke-linecap=\"round\"/>\n    <\/svg>\n    <span class=\"wordmark\">鹈鹕<em>单车<\/em><\/span>\n  <\/div>\n  <span class=\"tagline\">独立运行的海滨骑行 · 纯 SVG<\/span>\n  <div class=\"head-spacer\"><\/div>\n  <button id=\"sndBtn\" class=\"on\" aria-pressed=\"true\" aria-label=\"声音开关\">\n    <svg viewBox=\"0 0 24 24\" id=\"sndIcon\"><\/svg>\n    <span id=\"sndLabel\">声音开<\/span>\n    <span class=\"eq\" aria-hidden=\"true\"><i><\/i><i><\/i><i><\/i><\/span>\n  <\/button>\n<\/header>\n\n<main>\n  <section id=\"stage\" aria-label=\"动画场景：一只鹈鹕沿着海滨栈道骑自行车\">\n    <svg id=\"scene\" viewBox=\"0 0 1200 675\" preserveAspectRatio=\"xMidYMid slice\" role=\"img\"\n         aria-label=\"一只围红围巾的鹈鹕，骑着蓝色自行车，行驶在阳光下的海滨栈道上\">\n      <title>骑自行车的鹈鹕<\/title>\n    <\/svg>\n    <div class=\"vignette\"><\/div>\n    <div class=\"grain\"><\/div>\n    <div class=\"hud\">\n      <span class=\"chip\">速度 <b id=\"hudSpeed\">0.0<\/b> 公里/时<\/span>\n      <span class=\"chip\">踏频 <b id=\"hudCad\">0<\/b> 转/分<\/span>\n      <span class=\"chip\">里程 <b id=\"hudTrip\">0 米<\/b><\/span>\n      <span class=\"chip loc\">墨西哥湾海滨栈道<\/span>\n    <\/div>\n    <div id=\"pausedBadge\">定车暂停 · 按空格继续骑行<\/div>\n    <div id=\"bellHint\">🔔 点击车铃 —— 或按 B 键<\/div>\n    <noscript>这段骑行需要 JavaScript 才能踩动踏板，请开启它。<\/noscript>\n  <\/section>\n\n  <aside id=\"panel\" aria-label=\"骑行控制\">\n    <div class=\"sect ride\">\n      <h2>骑行<\/h2>\n      <div class=\"ctl\"><div class=\"ctl-top\"><label for=\"rpm\">踏频<\/label><output id=\"rpmVal\"><\/output><\/div>\n        <input type=\"range\" id=\"rpm\" min=\"0\" max=\"120\" step=\"1\" value=\"72\"><\/div>\n      <div class=\"ctl\"><div class=\"ctl-top\"><label for=\"wheel\">车轮尺寸<\/label><output id=\"wheelVal\"><\/output><\/div>\n        <input type=\"range\" id=\"wheel\" min=\"46\" max=\"86\" step=\"1\" value=\"62\"><\/div>\n      <div class=\"ctl\"><div class=\"ctl-top\"><label for=\"bounce\">车座起伏<\/label><output id=\"bounceVal\"><\/output><\/div>\n        <input type=\"range\" id=\"bounce\" min=\"0\" max=\"14\" step=\"0.5\" value=\"5\"><\/div>\n    <\/div>\n\n   D.HT={x:D.F.x-26,y:gy-Rr-86}; D.HB={x:D.F.x-14,y:gy-Rr-34};\n  D.G={x:D.HT.x-12,y:D.HT.y-20};\n  D.bell={x:D.HT.x+6,y:D.HT.y-14};\n  D.lamp={x:D.HB.x+10,y:D.HB.y-6};\n  /* wheels */\n  [R.wheelRear,R.wheelFront].forEach((w,i)=>{\n    const c=i?D.F:D.A;\n    w.g.setAttribute('transform','translate('+c.x+','+c.y+')');\n    w.tire.setAttribute('r',Rr-6); w.rim.setAttribute('r',Rr-13); w.acc.setAttribute('r',Rr-16);\n    w.spokes.forEach((s,k)=>{const a=k/10*TAU;\n      s.setAttribute('x2',f2(Math.cos(a)*(Rr-15)));s.setAttribute('y2',f2(Math.sin(a)*(Rr-15)));});\n    w.valve.setAttribute('cx',0); w.valve.setAttribute('cy',-(Rr-19));\n  });\n  /* frame */\n  R.frame.setAttribute('d','M'+D.A.x+' '+D.A.y+' L'+D.BB.x+' '+D.BB.y+\n    ' M'+D.BB.x+' '+D.BB.y+' L'+D.C.x+' '+D.C.y+\n    ' M'+D.A.x+' '+D.A.y+' L'+D.C.x+' '+D.C.y+\n    ' M'+D.C.x+' '+D.C.y+' L'+D.HT.x+' '+D.HT.y+\n    ' M'+D.HT.x+' '+D.HT.y+' L'+D.HB.x+' '+D.HB.y+\n    ' M'+D.HB.x+' '+D.HB.y+' L'+D.BB.x+' '+D.BB.y);\n  R.fork.setAttribute('d','M'+D.HB.x+' '+D.HB.y+' Q'+(D.HB.x+8)+' '+(D.HB.y+22)+' '+D.F.x+' '+D.F.y);\n  R.fenderR.setAttribute('d',arcPath(D.A.x,D.A.y,Rr+8,185,-5,1,0));\n  R.fenderF.setAttribute('d',arcPath(D.F.x,D.F.y,Rr+8,-160,-20,0,0));\n  R.rackG.setAttribute('transform','translate('+(D.A.x-4)+','+(D.A.y-Rr-14)+')');\n  /* chain (belt around cog + ring) */\n  const dx=D.BB.x-D.A.x, dy=D.BB.y-D.A.y, dd=Math.hypot(dx,dy);\n  const phi=Math.atan2(dy,dx), al=Math.acos(clamp((D.ringR-D.cogR)/dd,-1,1));\n  const nT={x:Math.cos(phi-al),y:Math.sin(phi-al)}, nB={x:Math.cos(phi+al),y:Math.sin(phi+al)};\n  const cT={x:D.A.x+D.cogR*nT.x,y:D.A.y+D.cogR*nT.y}, rT={x:D.BB.x+D.ringR*nT.x,y:D.BB.y+D.ringR*nT.y};\n  const cB={x:D.A.x+D.cogR*nB.x,y:D.A.y+D.cogR*nB.y}, rB={x:D.BB.x+D.ringR*nB.x,y:D.BB.y+D.ringR*nB.y};\n  R.chain.setAttribute('d','M'+f2(cT.x)+' '+f2(cT.y)+' L'+f2(rT.x)+' '+f2(rT.y)+\n    ' A'+f2(D.ringR)+' '+f2(D.ringR)+' 0 1 1 '+f2(rB.x)+' '+f2(rB.y)+\n    ' L'+f2(cB.x)+' '+f2(cB.y)+' A'+D.cogR+ D.H.x-118);R.gLen.setAttribute('y',D.H.y-4);\n}\n\n/* ============================== paint & time ============================== */\nfunction applyPaint(){\n  const fd=mixHex(S.frame,'#06141d',.3), kd=mixHex(S.kit,'#06141d',.25);\n  paintFrame.forEach(e=>e.setAttribute('stroke',S.frame));\n  paintFrameDark.forEach(e=>e.setAttribute('stroke',fd));\n  paintKit.forEach(e=>{e.setAttribute('stroke',S.kit);e.setAttribute('fill',S.kit);});\n  paintKitDark.forEach(e=>{e.setAttribute('stroke',kd);e.setAttribute('fill',kd);});\n}\n/* hour keyframes: h, skyTop, skyMid, horizon, seaFar, seaNear, cloud, sand, tint, tintAmt, stars */\nconst KEYS=[\n[0,  '#050a1c','#0a1531','#17264a','#0b2036','#071426','#232f4e','#565273','#0a1030',.50,1],\n[4.5,'#070f26','#101c3e','#2c2f5e','#0d2440','#08182e','#2a3355','#5d5678','#0a1030',.46,.95],\n[6,  '#27407e','#7a5a8e','#ff9e6a','#1c4a66','#123048','#e8a58e','#caa27e','#3a2a5e',.22,.25],\n[8,  '#2f7cc4','#7cc0e8','#ffe0ae','#1197b4','#0c6f92','#fff0da','#efd6a0','#ffb02e',.05,0],\n[12, '#1f8fe0','#6fd0f5','#c9f0ff','#0fa8c9','#0b7fa6','#ffffff','#f4dfae','#ffffff',0,0],\n[16.5,'#2b80d0','#7cc4ee','#ffe6b0','#0e9cb8','#0a7396','#fff3da','#f6dfa6','#ffb02e',.06,0],\n[18.6,'#4a3f96','#ff8a5e','#ffc46b','#5e5fae','#39418a','#ffc2a0','#e6b48c','#ff5d4d',.16,.05],\n[20, '#1d2254','#4a3a7e','#b06a8e','#25355e','#152242','#54507e','#8a7590','#1c1f4e',.36,.55],\n[22, '#081026','#0e1a3a','#1f2c52','#0d2240','#081628','#2a3458','#5a5578','#0a1030',.48,.95],\n[24, '#050a1c','#0a1531','#17264a','#0b2036','#071426','#232f4e','#565273','#0a1030',.50,1]];\nfunction hourName(h){return h<5?'深夜':h<6.5?'黎明':h<11?'上午':h<14?'正午':\n  h<17?'下午':h<18.7?'黄金时刻':h<20?'日落':h<21.5?'黄昏':'夜晚';}\nfunction applyTime(){\n  const h=S.hour; let a=KEYS[0],b=KEYS[KEYS.length-1];\n  for(let i=0;i<KEYS.length-1;i++)if(h>=KEYS[i][0]&&h<=KEYS[i+1][0]){a=KEYS[i];b=KEYS[i+1];break;}\n  const t=(h-a[0])/Math.max(.001,b[0]-a[0]);\n  const C=i=>mixHex(a[i],b[i],t), N=i=>lerp(a[i],b[i],t ('spray').addEventListener('change',e=>{S.spray=e.target.checked;});\n$('pauseBtn').addEventListener('click',()=>setPaused(!S.paused));\n$('bellBtn').addEventListener('click',ringBell);\n$('randBtn').addEventListener('click',randomize);\n$('resetBtn').addEventListener('click',resetAll);\n$('expSvgBtn').addEventListener('click',exportSVG);\n$('expPngBtn').addEventListener('click',exportPNG);\n$('sndBtn').addEventListener('click',()=>setSound(!S.sound));\nR.bellG.addEventListener('pointerdown',e=>{e.stopPropagation();ringBell();});\nR.bodyG.addEventListener('pointerdown',e=>{e.stopPropagation();honk();});\nR.nearWing.addEventListener('pointerdown',e=>{e.stopPropagation();honk();});\nwindow.addEventListener('pointerdown',resumeAudio,{passive:true});\nwindow.addEventListener('keydown',e=>{\n  resumeAudio();\n  if(e.target.closest('input,button,select,textarea'))return;\n  if(e.code==='Space'){e.preventDefault();setPaused(!S.paused);}\n  else if(e.key==='b'||e.key==='B')ringBell();\n  else if(e.key==='r'||e.key==='R')randomize();\n  else if(e.key==='g'||e.key==='G'){S.guides=!S.guides;$('guides').checked=S.guides;\n    R.guidesG.setAttribute('display',S.guides?'inline':'none');}\n  else if(e.key==='ArrowUp'||e.key==='ArrowDown'){\n    e.preventDefault();S.rpm=clamp(S.rpm+(e.key==='ArrowUp'?5:-5),0,120);\n    $('rpm').value=S.rpm;$('rpmVal').textContent=S.rpm+' rpm';fillPct($('rpm'));}\n});\ndocument.addEventListener('visibilitychange',()=>{\n  if(!AC)return;\n  if(document.hidden)AC.suspend().catch(()=>{});\n  else if(S.sound)AC.resume().catch(()=>{});\n});\n\n/* ============================== main loop ============================== */\nlet lastChainStep=0;\nfunction frame(now){\n  requestAnimationFrame(frame);\n  if(!last)last=now;\n  const dt=Math.min(.05,(now-last)/1000); last=now;\n  tAmb+=dt*ambScale;\n  /* eased cadence */\n  rpmCur+=(S.rpm-rpmCur)*Math.min(1,dt*3);\n  const effRpm=S.paused?0:rpmCur;\n  const wc=effRpm/60*TAU;                    // crank rad/s\n  const gear=D.ringR/D.cogR, ww=wc*gear;     // wheel rad/s\n  const vpx=ww*D.R, vms=vpx*PXM, kmh=vms*3.6;\n  if(!S.paused){\n    theta+=wc*dt; dist+=vms*dt;\n    wheelDeg+=ww*dt*DEG; chainOff-=wc*D.ringR*dt;\n    const step=Math.floor(theta/Math.PI);\n    if(step!==lastChainStep){lastChainStep=step;if(effRpm>4)tickChain(.02+effRpm*.0005);}\n  }\n  const scroll=dist/PXM;\n  /* camera */\n  const z=S.zoom/100;\n  world.setAttribute('transform','translate(600,430) scale('+z+') translate(-600,-430)');\n  /* parallax layers */\n  const wrap=(g,f)=>g.setAttribute('transform','translate('+f2(-(scroll*f%1200))+',0)');\n  wrap(duneG,.3); wrap(palmG,.62); wrap(railG,1); wrap(plankG,1); wrap(fgG,1.25);\n  waveOff+=(14+S.wind*.35)*dt*ambScale;\n  R.waves.forEach((w,i)=>w.el.setAttribute('transform','translate('+f2(-(waveOff*w.rate%120))+','+\n    f2(Math.sin(tAmb*.7+i)*1.5)+')'));\n  clouds.forEach(c=>{\n    const x=((c.x0-tAmb*(4+S.wind*.14)-scroll*.05)%1600+1600)%1600-200;\n    c.g.setAttribute('transform','translate('+f2(x)+','+f2(c.y+Math.sin(tAmb*.3+c.ph)*4)+') scale('+c.s+')');});\n  gulls.forEach(g=>{\n    const x=((g.base-tAmb*g.sp-scroll*.02)%1500+1500)%1500-150;\n    const fl=4+Math.sin(tAmb*7+g.ph)*6;\n    g.path.setAttribute('d','M-14 0 Q-7 '+f2(-fl)+' 0 0 Q7 '+f2(-fl)+' 14 0');\n    g.g.setAttribute('transform','translate('+f2(x)+','+f2(g.y+Math.sin(tAmb*.9+g.ph)*7)+') scale('+g.sc+')');});\n  boatX-= (8+S.wind*.06)*dt*ambScale; if(boatX<-160)boatX=1360;\n  R.boatG.setAttribute('transform','translate('+f2(boatX)+','+f2(492+Math.sin(tAmb*.8)*3)+\n    ') rotate('+f2(Math.sin(tAmb*.8+.5)*2.5)+')');\n  R.boatLamp.setAttribute('opacity',f2(night*.9));\n  palms.forEach(p=>p.fr.setAttribute('transform','translate('+p.x+','+p.y+') rotate('+\n    f2(Math.sin(tAmb*.9+p.ph)*(2+S.wind*.05))+')'));\n  glitter.forEach((g,i)=>g.el.setAttribute('opacity',\n    f2(R.glitBase*(0.4+0.6*Math.abs(Math.sin(tAmb*2.4+g.ph))))));\n  /* stars & shooting star */\n  if(night>0.02){stars.forEac ag=Math.sin(theta*2+2)*3*(S.bounce/5+.3)+open*30;\n  R.pouch.setAttribute('d','M129 -148 Q196 '+f2(-104+sag)+' 256 -142 Q261 -142 260 -146 L129 -153 Z');\n  R.pouchG.setAttribute('transform','rotate('+f2(open*14)+' 129 -148)');\n  R.upperBeakG.setAttribute('transform','rotate('+f2(-open*10)+' 126 -152)');\n  R.fishPoke.setAttribute('opacity',fishT<1?0:1);\n  /* scarf ribbon */\n  const root=bodyToWorld(84,-116);\n  const Nseg=Math.round(S.scarf), segLen=13;\n  const amp=3+S.wind*.10+effRpm*.04, freq=3+effRpm*.05+S.wind*.06;\n  const droop=Math.max(6,26*(1-S.wind*.008)), lift=S.wind*.35;\n  function ribbon(n,phase,width){\n    let d='M'+f2(root.x)+' '+f2(root.y),lx=root.x,ly=root.y;\n    for(let i=1;i<=n;i++){const t=i/n;\n      lx=root.x-i*segLen*(1-.15*t);\n      ly=root.y+Math.sin(tAmb*freq-i*.7+phase)*amp*t+droop*Math.pow(t,1.6)-lift*i/Nseg;\n      d+=' L'+f2(lx)+' '+f2(ly);}\n    return {d,lx,ly};}\n  const rm=ribbon(Nseg,0), rs=ribbon(Math.max(3,Math.round(Nseg*.65)),1.7);\n  R.scarfMain.setAttribute('d',rm.d); R.scarfSub.setAttribute('d',rs.d);\n  R.scarfKnot.setAttribute('cx',f2(root.x));R.scarfKnot.setAttribute('cy',f2(root.y));\n  R.fringe.forEach((l,i)=>{setLine(l,{x:rm.lx,y:rm.ly},\n    {x:rm.lx-9,y:rm.ly+(i-1)*6+Math.sin(tAmb*freq+i)*2});});\n  /* bell ring animation */\n  if(ringT<1){ringT+=dt/.9;const p=clamp(ringT,0,1);\n    R.bellArcs.setAttribute('opacity',f2(1-p));\n    R.bellArcs.setAttribute('transform','scale('+f2(1+p*1.7)+')');\n    R.bellDome.setAttribute('transform','scale('+f2(1+.15*Math.sin(p*Math.PI*4)*(1-p))+')');\n    const pop=p<.2?(p/.2)*(1.15-.15*(p/.2)):1;\n    R.comicBell.setAttribute('x',f2(D.bell.x-6));\n    R.comicBell.setAttribute('y',f2(D.bell.y-44-30*p));\n    R.comicBell.setAttribute('opacity',f2(p<.7?1:1-(p-.7)/.3));\n    R.comicBell.setAttribute('transform','rotate(-8 '+f2(D.bell.x-6)+' '+f2(D.bell.y-60)+\n      ') translate('+f2(D.bell.x-6)+' '+f2(D.bell.y-60)+') scale('+f2(pop)+') translate('+f2(-(D.bell.x-6))+' '+f2(-(D.bell.y-60))+')');\n  } else {R.bellArcs.setAttribute('opacity',0);R.bellDome.setAttribute('transform','');\n    R.comicBell.setAttribute('opacity',0);}\n  /* honk comic */\n  if(honkT<1){const p=clamp(honkT,0,1),pop=p<.2?(p/.2)*1.1:1.1-.1*Math.min(1,(p-.2)/.3);\n    R.comicHonk.setAttribute('opacity',f2(p<.65?1:1-(p-.65)/.35));\n    const hx=+R.comicHonk.getAttribute('x'),hy=+R.comicHonk.getAttribute('y');\n    R.comicHonk.setAttribute('transform','rotate(6 '+hx+' '+hy+') translate('+hx+' '+f2(hy-20*p)+\n      ') scale('+f2(pop)+') translate('+(-hx)+' '+(-hy)+')');}\n  else R.comicHonk.setAttribute('opacity',0);\n  /* fish jump */\n  if(fishT<1){fishT+=dt/1.0;const p=clamp(fishT,0,1);\n    const fx=fishStart.x+Math.sin(p*Math.PI)*60, fy=fishStart.y-160*Math.sin(p*Math.PI);\n    R.fishJumpG.setAttribute('opacity',f2(p<.9?1:1-(p-.9)/.1));\n    R.fishJumpG.setAttribute('transform','translate('+f2(fx)+','+f2(fy)+') rotate('+f2(p*300-20)+')');\n    R.sparkles.forEach((s,i)=>{const sp=clamp((p-.3-i*.08)*3,0,1);\n      s.setAttribute('cx',f2(fishStart.x+30+i*16));s.setAttribute('cy',f2(fishStart.y-140+i*10));\n      s.setAttribute('opacity',f2(Math.sin(sp*Math.PI)*.9));});}\n  else {R.fishJumpG.setAttribute('opacity',0);R.sparkles.forEach(s=>s.setAttribute('opacity',0));}\n  /* speed lines & dust */\n  const slOp=S.spray?clamp((kmh-20)/40,0,1)*.35:0;\n  speedRects.forEach(s=>{\n    s.el.setAttribute('x',f2(1250-((scroll*2.2+s.off)%1500)));\n    s.el.setAttribute('width',f2(40+kmh*3));\n    s.el.setAttribute('opacity',f2(slOp));});\n  if(S.spray&&!S.paused&&effRpm>15){\n    spawnAcc+=dt*(effRpm/12);\n    while(spawnAcc>1){spawnAcc-=1;\n      const d=dust.find(q=>!q.on); if(!d)break;\n      d.on=true;d.age=0;d.life=.5+Math.random()*.4;\n      d.x=D.A.x-6;d.y=GY-2;d.r=2+Math.random()*3;\n      d.vx=-(60+vpx*.3)+(Math.random()-.5)*30;d.vy=-20-Math.random()*45;\n      d.el.setAttribute('display','inline');d.el.setAttribute('r',f2(d.r));}\n  }\n  dust.forEach(d=>{if(!d.on)return;d.age+=dt;\n    if(d.age>=d.life){d.on=false;d.el.setAttribute('display','none');return;}\n    d.x+=d.vx*dt;d.y+=d.vy*dt;d.vy+=140*dt;\n    d.el.setAttribute('cx',f2(d.x));d.el.setAttribute('cy',f2(d.y));\n    d.el.setAttribute('opacity',f2(.7*(1-d.age/d.life)));});\n  /* guides */\n  if(S.guides){\n    setLine(R.gBones[0],hn,kn);setLine(R.gBones[1],kn,pn);\n    setLine(R.gBones[2],hf,kf);setLine(R.gBones[3],kf,pf);\n    [hn,kn,pn,hf,kf,pf].forEach((j,i)=>{R.gJoints[i].setAttribute('cx',f2(j.x));\n      R.gJoints[i].setAttribute('cy',f2(j.y));});\n    R.gTheta.textContent='θ '+Math.round((theta*DEG)%360)+'°';\n    R.gCad.textContent='踏频 '+Math.round(effRpm)+' 转/分';\n  }\n  /* HUD */\n  hudT+=dt;\n  if(hudT>.2){hudT=0;\n    $('hudSpeed').textContent=kmh.toFixed(1);\n    $('hudCad').textContent=Math.round(effRpm);\n    $('hudTrip').textContent=dist<1000?Math.round(dist)+' 米':(dist/1000).toFixed(2)+' 公里';}\n}\n\n/* ============================== boot ============================== */\nrebuild(); applyPaint(); applyTime(); refreshControls();\nsetSound(true); setPaused(false);\nif(reduced){setPaused(true);toast('检测到系统开启了“减少动效”，准备好后按空格键开始','var(--amber)');}\nsetTimeout(()=>$('bellHint').classList.add('hide'),20000);\nrequestAnimationFrame(frame);\n})();\n<\/script>\n<\/body>\n<\/html>\n```\n\n用法：把代码块里的内容复制到一个文本文件，保存成 `pelican.html`（UTF-8 编码），双击用浏览器打开。页面是纯离线的，不需要联网，也不加载任何外部文件。","v":["画个骑车的鹈鹕","给我画一只骑自行车的鹈鹕","pelican riding a bicycle"],"h":0,"tool":"pelican"},{"q":"校历去哪儿查才靠谱？","a":"建议只以学校官方渠道发布的版本为准。可以看本科生院官网的通知公告与查询服务栏目，登录教务系统在首页或信息查询栏目查看，也可以在中国农业大学企业微信号的本科教育教学板块直接查询。学院官网和班级群转发的截图往往滞后，只适合参考。","v":["校历去哪儿查？","校历在哪查？","企业微信号能查校历吗","官方校历从哪找","校历在哪个系统能看"],"h":0},{"q":"Python 3 的 bool([]) 返回什么？为什么？","a":"`bool([])` 返回 **False**。Python 把空容器视为假值，因此 `if []:` 不会进入真分支。列表只要有元素就为真，即使元素本身是 `0`：`bool([0])` 返回 `True`。","v":["Python 3 的 bool([]) 返回什么？为什么？","Python 的 if 条件遇到空列表时会判断为真还是假？","为什么 if not items 可以检查列表是否为空？","在 Python 3 中，bool([]) 的结果和原因是什么？","空列表在 Python 里能作为 True 吗？"],"h":10},{"q":"公寓一食堂营业时段与支付方式","a":"公寓一食堂按早、午、晚三餐分时段供应，早餐一般从早上六点半前后开始，上午十点半左右收尾；午餐集中在十点半到下午一点；晚餐从下午四点半前后供应到晚上七点左右。部分窗口在晚间设有延时或夜宵供应，具体以当学期公告为准，考试周和开学初往往会延长或调整。结算以校园卡为主，食堂窗口普遍配备刷卡机，校园卡余额不足时可在食堂内的圈存机或线上渠道充值。由于公一以基本伙为主，菜价按学校核定的标准执行，主食和素菜价格较低，两荤一素的组合花费通常不高。高峰期只开部分窗口，收银通道也会排长队，建议提前充值避免临时找地方充值耽误时间。公一与二层的公二上下相邻，只在其中一处排队时也可以看看另一层当天的窗口情况，两层之间走动只要一两分钟，比一直等同一队更灵活。公一以基本伙为主，菜价按学校核定的标准执行，适合把日常三餐固定在这里。","v":["食堂什么时候开","食堂营业时间","食堂几点开门？","一食堂几点开","公一几点关门","公一能用校园卡刷卡吗","公一营业时间","公一食堂几点开门","夜宵"],"h":10},{"q":"校园卡的使用与卡务办理","a":"校园卡是校内就餐、洗浴、开水、门禁、图书借阅和各类自助服务的通用凭证，一人一卡，不得转借他人使用，也不得涂改、伪造。校园卡需要圈存或者在线充值后才能消费，余额不足时食堂刷卡机会提示失败。卡片丢失应当立即通过自助终端、企业微信号或者网络中心办理挂失，挂失后原卡即停止使用，避免被他人冒用消费；确认无法找回后再申请补办新卡。校园卡中心服务电话总机为 62738000，东区拨 0，西区拨 819；校园卡管理中心卡务科电话东区 62736133、西区 62734719。转借、盗用、涂改、伪造校园卡的，按违纪处分规定给予相应处分。浴室、开水房等场所的设备故障和消费异常，可以向后勤基建处相关中心报修。","v":["卡务中心","校园卡丢了怎么挂失","校园卡余额不足怎么充值","补办新校园卡要去哪办"],"h":9},{"q":"Mac 怎么只截一个窗口？","a":"按 **Shift + Command + 4**，再按一下空格键，光标会变成相机图标；将鼠标移到目标窗口上并点一下，就能只截这个窗口。按住 Control 可将截图复制到剪贴板。","v":["Mac 上只截一个窗口怎么操作","Mac 上怎么截取单个窗口的截图？","Mac 怎么只截一个窗口？","Mac 怎么只截图一个窗口","Mac 怎么只截屏一个窗口","Mac 截图只截窗口怎么按"],"h":7},{"q":"Excel 怎么把两列文字合并成一列？","a":"可以用连接符：`=A2 & B2`；需要空格分隔时用 `=A2 & \" \" & B2`。新版 Excel 也可以用 `=TEXTJOIN(\"-\", TRUE, A2:B2)`。如果之后要删除源列，先复制结果并选择性粘贴为数值。","v":["Excel 两列内容怎么拼到一列里？","Excel 怎么把两列文字合并成一列？","单元格文字合并用什么公式？","怎么把 A 列和 B 列的文字连起来？"],"h":7},{"q":"什么是黑洞？","a":"黑洞是宇宙中引力极强的区域，连光都无法逃逸。它通常由大质量恒星坍缩形成，边界叫事件视界。黑洞本身不发光，但可通过周围物质的吸积盘辐射被观测。","v":["解释一下黑洞","解释一下黑洞是怎么形成的","黑洞是什么","黑洞是怎么形成的"],"h":5},{"q":"公寓二食堂甜点、饮品与特色档口","a":"公寓二食堂设有烘焙与饮品档口，公开报道提到甜品柜陈列榴莲酥、蛋挞、樱花奶豆腐等点心，酸奶种类可达十多种，适合当作加餐或带走的早点。饮品档口供应奶茶、咖啡、鲜榨果汁和热饮，价格普遍低于校外同类品牌。特色正餐档口方面，据媒体实地探访，公二一带出现过单份北京烤鸭套餐、佛跳墙等菜品，其中烤鸭套餐售价约二十余元，佛跳墙一盅约二十八元，另有大份火锅类聚餐菜品，价格按锅计。这类菜品属于特色档口商品，不是每学期常驻，供应时间和分量会调整。购买前建议看窗口标价牌，甜品与饮品多为现结，注意核对金额，扫码支付后保留支付记录。公二一带的火锅类菜品价格按锅计，人均消费取决于人数，人多时比单点划算；单人份套餐则适合一个人吃、出餐也快。甜品和饮品多为即买即走，不适合长时间放在桌上占位。需要打包带走时可以在点单时直接说明，装盒后再带走比端回宿舍更方便。","v":["公二有奶茶和咖啡吗","公二甜品","公二甜品柜有什么点心","公二饮品","榴莲酥","甜品柜"],"h":2},{"q":"什么是复利？","a":"复利是利息计入本金后继续生息，即'利滚利'。长期看复利效应显著，早开始投资并持续投入比短期高收益更重要。反过来，信用卡欠款和高利贷的复利也会迅速膨胀。","v":["利滚利怎么算","复利为什么厉害","复利是什么"],"h":1},{"q":"隔夜菜能吃吗？","a":"彻底加热后可以吃，但需看保存条件：及时冷藏、不过夜太久、彻底热透。绿叶菜隔夜后亚硝酸盐增加较多、口感差，建议当餐吃完。凉拌菜不宜隔夜。","v":["哪些菜不能隔夜","隔夜菜有害吗"],"h":1},{"q":"工学院有哪些专业？","a":"工学院开设 7 个专业：农业工程、农业智能装备工程、农业机械化及其自动化、工业设计、机械电子工程、机械设计制造及其自动化、车辆工程。","v":["工学院专业有哪些","工学院开设什么专业","工学院有什么专业","工学院的专业"],"h":1},{"q":"中国农业大学有哪些学院？","a":"中国农业大学现有 16 个学院（不含全校通识公共课程）：人文与发展学院、信息与电气工程学院、农学院、动物医学院、动物科学技术学院、园艺学院、土地科学与技术学院、工学院、植物保护学院、水利与土木工程学院、理学院、生物学院、经济管理学院、草业科学与技术学院、资源与环境学院、食品科学与营养工程学院。","v":["中国农业大学学院名单","中国农大有哪些学院","农大有哪些学院","农学院校有哪些院系","学校有哪些学院"],"h":1},{"q":"HumanEval第163题generate_integers怎么解？","a":"返回a和b之间（含）所有一位偶数数字，升序；若无返回[]。先把上下界夹到2到8（因为只考虑一位偶数2/4/6/8），lower=max(2,min(a,b))、upper=min(8,max(a,b))，再取range内偶数。注意区间可能逆序。核心是区间裁剪到一位偶数范围。","v":["generate_integers解法","HumanEval第163题练习","第163题生成偶数字"],"h":1},{"q":"广义相对论的核心思想是什么？","a":"引力不是一种力，而是质量使时空弯曲的表现，物体沿弯曲时空的测地线运动。等效原理是它的基础：局部范围内引力与加速度不可区分。它成功解释了水星近日点进动、光线偏折等现象。","v":["广义相对论核心思想","引力是什么","时空弯曲怎么理解"],"h":1},{"q":"东校区食堂都有哪些？平时去哪儿吃？","a":"东校区食堂主要围绕宿舍区和操场周边分布，最常去的是公主楼下的公寓一食堂和公寓二食堂，简称公一、公二。校内还有清真餐厅、教工餐厅、面包房与咖啡厅，家属区和商业街一带也有小型餐饮点。","v":["东区吃饭的地方有哪些","东区有哪些食堂","东区有哪些饭堂食堂","公一公二之外还有啥食堂","农大东区有几个食堂"],"h":1},{"q":"useMemo 和 useEffect 怎么区分？","a":"`useMemo` 在渲染期间缓存一个计算结果，适合避免昂贵的重复计算；`useEffect` 在渲染提交后运行，用来和外部系统同步，例如请求、订阅或操作 DOM。简单记：`useMemo` 算值，`useEffect` 做副作用。","v":["React 里 useMemo 是做什么的？","useEffect 和 useMemo 有什么不同？","useMemo 和 useEffect 怎么区分？"],"h":1},{"q":"创建目录时忘记添加章节标题，该如何补救？","a":"不必重写大纲：先给遗漏的章节文字套用相应的标题样式（如“标题1”“标题2”），再在目录上右键选择“更新域/更新目录”，并选择“更新整个目录”，缺失的章节就会出现在目录中。","v":["建目录时忘了加章节标题咋办","目录漏了章节标题怎么补上","章节标题没进目录要怎么弄回来"],"h":0},{"q":"为什么银行账户密码和支付密码不能一样设置呢？","a":"主要是出于安全考虑：查询/登录密码与支付密码分开设置，可避免一个密码泄露后资金被直接盗用，降低风险。","v":["为什么账户密码不能跟支付密码相同","银行密码和支付密码为啥不能设成一样","银行账户密码和支付密码为何要分开"],"h":0},{"q":"购买火车票需要准备哪些材料？","a":"购票时需使用乘车人的有效身份证件（如居民身份证）原件或准确填写证件信息，线上购票无需复印件；进站乘车须人、证、票一致。","v":["买火车票得准备些什么东西","买火车票要准备哪些证件材料","购火车票需要带什么材料"],"h":0},{"q":"重氮盐有什么特点？","a":"芳香伯胺与亚硝酸在低温强酸中反应生成重氮盐，重氮基可放出氮气被羟基卤素氰基等取代，是引入多种基团的重要中间体。重氮盐不稳定，需在低温保存，干燥时易爆炸。与酚或芳胺偶合可生成偶氮染料。","v":["重氮化条件","重氮盐为什么低温","重氮盐是什么"],"h":0},{"q":"为什么书签和收藏夹的区别这么大？","a":"书签和收藏夹本质上是同一类功能的不同叫法（不同浏览器习惯用词不同），都是保存网页链接以便快速再次访问，并不存在“一个存网址、一个存网页内容”的区别。若要保存网页正文内容，需另存为本地文件或使用剪藏/笔记类工具。","v":["为什么书签和收藏夹差这么多","书签和收藏夹为啥差别这么大","书签跟收藏夹区别怎么这么大"],"h":0},{"q":"三方协议签订后实习单位可以随意调岗吗？","a":"一般不能随意调岗。三方协议中约定的岗位属于协议内容，变更需经毕业生与用人单位协商一致，单位单方面调岗可能构成违约。具体以协议约定为准，可先与单位沟通，必要时请学校就业指导部门介入协调。","v":["三方协议签完公司想调岗可以拒绝吗","实习单位签完三方后能随便换我岗位吗","签了三方协议单位还能随便给我调岗吗"],"h":0},{"q":"Google Scholar有什么特点？","a":"Google Scholar是免费学术搜索工具，覆盖跨学科的期刊论文学位论文图书摘要和报告，能显示被引用次数并提供相关版本链接，使用便捷覆盖面广。但它的收录自动抓取、质量参差不齐，结果可能包含非同行评审资料，正式研究仍需到权威数据库核实。","v":["免费查文献工具","学术搜索靠谱吗","谷歌学术是什么"],"h":0},{"q":"为什么洗洁精能洗油？","a":"洗洁精含表面活性剂，分子一端亲水一端亲油，能降低水的表面张力并把油污乳化成小液滴分散到水中，从而被冲走。","v":["为什么水油不相溶","洗洁精去油原理","表面活性剂作用"],"h":0},{"q":"如何通过线上渠道预约图书馆自习室座位？","a":"多数高校通过图书馆的座位预约系统办理，常见入口是图书馆官网或其微信公众号/小程序中的“座位预约”，用学号登录后选择自习室、日期和时段提交即可。具体入口和规则以本校图书馆公布的通知为准。","v":["图书馆自习室座位怎么线上预约","图书馆自习室座位线上怎么约","线上预约自习室座位有啥办法"],"h":0},{"q":"就业材料要盖学校公章去自助印信机怎么弄？","a":"学校就业盖章统一通过自助印信机办理。纸质版三方协议与就业推荐表在发放时已经加盖学校公章；网签成功后下载的协议本身已具有相应效力，无需申请盖章。选调生与公务员相关材料、落户函等其他就业证明材料盖章，需先加盖学院公章后再申请学校自助盖章。","v":["三方协议还要盖章吗","自助印信机盖什么章","选调生材料盖章走哪"],"h":0},{"q":"胺的制备有哪些常用方法？","a":"常用方法有卤代烃与氨或胺的烷基化，但易多烷基化；腈或酰胺还原得伯胺；硝基化合物还原得芳香伯胺；盖布瑞尔合成用邻苯二甲酰亚胺可得纯净伯胺；醛酮还原胺化也可制备胺。选择方法要看目标胺的级别和纯度要求。","v":["怎么得到纯伯胺","硝基还原制苯胺","胺怎么制备"],"h":0},{"q":"地板如何保养？","a":"木地板避免大量 water、用专用清洁剂、定期打蜡、家具脚加垫防刮、避免阳光长时间直射。复合地板保养相对简单。","v":["地板划痕","地板怎么拖干净"],"h":0},{"q":"如何自助打印机取回已打印文件？","a":"在自助打印机上刷卡或扫码/输入账号登录，在任务列表中选择自己的打印任务并确认，打印完成后从出纸口取走文件。","v":["打印完的文件在自助机上怎么拿","自助打印机上怎么取回打印好的文件","自助打印的文件怎么取回来"],"h":0},{"q":"辅修课程如何选课，有时间限制吗？","a":"辅修一般需按教务处通知，在学校教务系统或官网在线报名、选课；报名和选课通常设有起止时间，逾期不再受理，具体以本校通知为准。","v":["辅修课程选课有没有截止时间","辅修选课怎么选有没有时间限制","辅修选课的具体流程和时间要求是什么"],"h":0},{"q":"如何避免 CSS 中选择器过于复杂导致页面加载变慢？","a":"尽量使用类选择器，避免过深的后代层级、通配符和复杂的属性/伪类组合；减少 !important 和重复覆盖，删除无用样式，控制样式表体积。这样可降低样式匹配与重算成本。","v":["CSS选择器写太复杂会不会拖慢页面加载","怎么让CSS选择器简单点别影响页面速度","页面加载慢跟CSS选择器太复杂有关系吗"],"h":0},{"q":"康熙为什么能稳固清朝统治？","a" 问题怎么解决？","网页在不同浏览器显示不一样咋办？"],"h":0},{"q":"期末考试成绩在哪里查？","a":"登录学校教务系统，在成绩查询模块查看已公布课程成绩，对成绩有疑问可按通知申请复核，以学校最新通知为准。","v":["在哪看考试成绩","教务系统怎么查分","期末成绩怎么查"],"h":0},{"q":"移动校园卡的有效期是多少天，续费提醒何时出现？","a":"校园卡的有效期和到期提醒方式因套餐、地区而异，没有统一的天数或提醒时间，建议通过中国移动App、10086或当地营业厅查询自己套餐的具体有效期和续费提醒规则。","v":["校园卡套餐有效期和续费提醒怎么查","移动校园卡有效期多少天","移动校园卡续费提醒啥时候来"],"h":0},{"q":"细胞膜主要由什么成分构成？","a":"细胞膜主要由脂质和蛋白质组成，此外还有少量糖类。脂质中磷脂最丰富，构成膜的基本支架；蛋白质有的镶在磷脂双分子层表面，有的部分或全部嵌入，有的贯穿整个磷脂双分子层，承担运输催化识别等功能。膜外侧的糖类与蛋白质或脂质结合形成糖蛋白或糖脂。","v":["糖蛋白在哪一侧","细胞膜由什么组成","膜的基本支架是什么"],"h":0},{"q":"天平为什么能精确称量？","a":"等臂天平利用杠杆平衡原理，当两臂等长时，两边质量相等指针才指零。精密天平配有阻尼和防震设计，砝码经标准校准，测量时避免气流和温度影响，因此能达到很高的精度。","v":["天平为什么精确","天平称量原理","精密天平使用注意"],"h":0},{"q":"科目一考试多久后可以预约下一次？","a":"科目一不合格需重新预约，一般需间隔十日左右；科目一合格后预约科目二也有规定的间隔要求（如小型汽车需科目一合格满十日），具体以当地车管所规定为准。","v":["科目一挂了以后要等几天才能重新约","科目一没过的话隔多久才能再预约","科目一考完多久能约下一次"],"h":0},{"q":"辅修课程如何办理学分认定手续？","a":"一般需提交辅修课程的成绩单（校外修读还需课程大纲等证明材料），经所在学院初审后报教务处审核认定，具体材料和流程以本校规定为准。","v":["校外辅修的成绩怎么申请学分认定","辅修学分认定要提交什么材料","辅修课的学分认定怎么弄手续"],"h":0},{"q":"门锁打不开怎么办？","a":"先确认钥匙是否正确、是否反锁，可轻晃门把手同时转动钥匙。锁芯卡涩可喷少量润滑剂（铅笔芯粉末也可）。仍打不开应联系正规开锁师傅并出示证件，勿自行暴力破坏。","v":["忘带钥匙怎么开门","钥匙打不开门怎么办","门锁卡住怎么处理"],"h":0},{"q":"苏东坡与美食有什么渊源？","a":"苏轼不仅是文学家，也是美食家，创制或推广了东坡肉、东坡肘子等名菜，写下《食猪肉诗》《老饕赋》等。他仕途辗转各地，品尝并记录了黄州、惠州、儋州等地的风味，把豁达的人生态度融入饮食，形成'人间有味是清欢'的生活美学。","v":["文人为什么爱写吃","苏东坡和东坡肉","苏轼美食故事"],"h":0},{"q":"如何在群里分享一个文件给所有人？","a":"在群聊窗口中点击输入框旁的文件/附件按钮，选择要发送的文件并发送，群内所有成员即可看到并下载该文件。","v":["怎么在群聊里分享文件给大家下载","群聊中怎么把文件发给全部成员","群里怎么发文件让所有人都能看到"],"h":0},{"q":"校医院的开药流程是怎样的？","a":"一般流程是：携带医保卡或校园卡等有效证件挂号，医生问诊后开具处方，缴费后到药房取药；具体流程以本校校医院规定为准。","v":["在校医院开药要走什么流程","校医院开药流程是啥样的","校医院拿药的流程是怎样的"],"h":0},{"q":"氧化还原配平总出错怎么练？","a":"按固定步骤练：先准确标出所有变化元素的氧化数，再按升降总数相等确定系数，最后用观察法配平其余原子。建议每次配平后单独核对两件事，一是电子得失守恒，二是离子方程式的电荷守恒。选含多种变价元素的复杂反应专门练，比大量做简单题更有效。","v":["复杂氧化还原配平技巧","配平怎么检查","配平总出错怎么办"],"h":0},{"q":"缓考申请什么时候开始接受？","a":"缓考申请的受理时间由各学校教务处规定，一般在考试前的一定期限内提交，具体起止时间请查看本校教务通知。","v":["什么时候可以开始申请缓考","缓考申请从什么时候起能提交","缓考申请啥时候开始受理"],"h":0},{"q":"如何使用云文档服务同步我的文件到云端？","a":"登录 WPS 账号后，在 WPS Office 客户端进入“云文档”，把本地文件上传或另存到云文档，客户端会自动同步；也可在云文档网页版中上传文件，其他设备登录同一账号即可看到。","v":["云文档怎么把文件同步到云端","怎么用云文档把文件传到云端","用云文档服务怎么同步文件到云"],"h":0},{"q":"打破砂锅问到底是什么歇后语？","a":"答案是“问到底”。砂锅裂纹会一路延到底部，“纹”与“问”同音，转成追根究底、非要弄明白不可。这句歇后语多含褒义，夸人有钻研精神；有时也形容爱刨根问底让人招架不住。","v":["打破砂锅问到底下一句","纹问谐音","问到底歇后语"],"h":0},{"q":"志愿时长通常要填写多少小时才合理？","a":"志愿时长应按实际参与服务的时间如实填写，没有统一的最低小时数要求；如有具体填报要求，以受理单位的规定为准。","v":["志愿时长一般写几个小时合理","志愿时长填多少小时比较合适","志愿时长要填多少才说得过去"],"h":0},{"q":"怎样处理改革发展和稳定的关系？","a":"在社会建设中要统筹改革发展稳定，把改革的力度、发展的速度和社会可承受的程度统一起来。以改善民生为重点推进社会建设，既解决群众急难愁盼，又避免脱离发展阶段吊高胃口，实现可持续。","v":["为什么要考虑承受度","力度速度怎么统一","社会建设怎么统筹"],"h":0},{"q":"社团想换负责人，需要走什么手续？","a":"按社团章程和指导单位要求提交负责人变更申请，经指导老师、挂靠单位同意后报校团委备案，以学校最新通知为准。","v":["社团换届要办什么手续？","社团换社长怎么报备？","社团负责人变更找谁办？"],"h":0},{"q":"教资笔试成绩过期了还能接着考面试吗？","a":"不能，笔试单科成绩有效期是两年，过期后需重新报考该科目笔试并通过才能再报面试；具体有效期以官方最新说明为准。","v":["教资笔试过了两年还能用吗","笔试成绩失效了怎么办","笔试成绩过期还能报面试吗"],"h":0},{"q":"打印成绩单需要提前多久提交申请表格和照片？","a":"各校规定不同，通常在校内自助打印终端可即时打印，无需提交照片；如需人工办理或加盖公章，所需材料和办理时限请咨询本校教务处。","v":["想打印成绩单，申请表照片要提前多长时间交","成绩单打印得提前多久交申请表和照片啊","打印成绩单的话申请表格和照片得提早多久提交"],"h":0},{"q":"地理信息技术主要有哪些？","a":"地理信息技术主要包括遥感、全球卫星导航系统和地理信息系统。遥感用于获取地表信息、监测资源环境变化；全球卫星导航系统用于定位和导航；地理信息系统用于采集存储管理分析和显示地理数据，可进行空间分析和决策支持。三者相互结合，广泛应用于资源调查环境监测防灾减灾和智慧城市。","v":["3S技术是什么","地理信息系统功能","遥感有什么用"],"h":0},{"q":"孟子的主要主张是什么？","a":"孟子是儒家代表人物，主张性善论、仁政、民贵君轻、浩然正气。他发展了孔子的仁，强调统治者应行仁政得民心，提出富贵不能淫、贫贱不能移、威武不能屈的大丈夫人格。","v":["孟子主张什么","性善论是谁","民贵君轻谁提出"],"h":0},{"q":"选课冲突了系统不让提交怎么办？","a":"先调整时间冲突的课程，把其中一门换到其他教学班；若确属培养方案要求且无法调整，向学院教务咨询特殊处理，以学校最新通知为准。","v":["两门课时间重叠能选吗","课表时间撞了怎么选","选课提示时间冲突咋办"],"h":0},{"q":"吃药后症状好转可以马上停药吗？","a":"要看药物类型。退烧药、止痛药按需短期使用，症状好转可停；但抗生素、降压药、降糖药、抗癫痫药、激素等需足疗程或长期维持，擅自停药可能复发、反弹或产生耐药。停药应遵医嘱。","v":["抗生素能吃几天停","症状好了还要吃药吗","降压药能自己停吗"],"h":0},{"q":"心理咨询预约需要准备什么材料？","a":"一般不需要照片等特殊材料，通常提供姓名、联系方式并填写预约登记表即可；校内咨询可能需出示学生证或校园卡，首次咨询常需签署知情同意书。具体以所在机构的要求为准。","v":["做心理咨询预约要交哪些材料","去心理咨询预约得带啥东西","心理咨询预约需要准备啥东西"],"h":0},{"q":"安装完最新版 macOS 后桌面会自动更新吗？","a":"升级 macOS 后一般会沿用你原有的桌面壁纸，不会自动换成新系统自带的壁纸。想更换可打开“系统设置”（旧版本为“系统偏好设置”）中的“墙纸／桌面与屏幕保护程序”，自行选择壁纸。","v":["macOS 升到最新版后原来的桌面还会留着不","升级最新版 macOS 桌面会不会自动被换掉","更新到最新版 macOS 之后桌面壁纸会自己变吗"],"h":0},{"q":"采菊东篱下悠然见南山是谁的？","a":"出自东晋陶渊明《饮酒·其五》。写诗人悠闲采菊，不经意间望见南山，表现物我两忘、恬淡自然的隐逸心境。这两句是田园诗的经典，体现陶渊明不慕荣利的人生态度。","v":["悠然见南山出处","采菊东篱下作者","陶渊明饮酒"],"h":0},{"q":"交换项目需要提前多久申请才能有足够的时间准备语言考试和签证？","a":"一般建议提前半年到一年准备：多数学校的交换项目校内申请截止在出发前一学期，语言考试出分和签证办理还需额外时间。具体以本校国际交流部门及外方学校公布的时间表为准。","v":["交换项目得提前多久报名才来得及","交换项目提前多长时间申请够用","申请交换项目要提早多久准备语言和签证"],"h":0},{"q":"影视公司为什么重视IP？","a":"知名小说、游戏或漫画IP已有受众基础，改编能降低市场风险、便于衍生开发，形成电影剧集游戏周边联动。但过度依赖IP也可能挤压原创。","v":["IP改编利弊","IP是什么","影视为什么爱IP"],"h":0},{"q":"石沉大海是什么歇后语？","a":"答案是“杳无音信”。石头扔进大海，连个响都听不见，比喻人去了之后毫无消息，或写的信、提的建议没有任何回应。这句歇后语与“肉包子打狗”都表示有去无回，前者重在没消息，后者重在收不回。","v":["杳无音信歇后语","石沉大海下一句","石沉大海什么意思"],"h":0},{"q":"孔夫子搬家是什么歇后语？","a":"答案是“尽是输（书）”。孔子是大学问家，搬家时书特别多，借“书”与“输”同音转成总是失败。这句歇后语把文化典故和谐音双关结合起来，常用于自嘲手气差或连续失利。","v":["书输谐音梗","孔夫子搬家下一句是什么","尽是输歇后语"],"h":0},{"q":"辛亥革命的意义是什么？","a":"辛亥革命发生于1911年，推翻了清王朝统治，结束了中国两千多年的君主专制制度，建立了中华民国，使民主共和观念深入人心。但它没有完成反帝反封建任务，革命果实被袁世凯窃取。","v":["辛亥革命意义","辛亥革命成功了吗","辛亥革命推翻了什么"],"h":0},{"q":"如何使用校园网认证？","a":"连接校园有线网络或校园 Wi-Fi 后，用浏览器打开任意网页通常会跳转到认证页面（也可手动访问学校公布的认证地址或使用其认证客户端），输入学校提供的上网账号和密码登录即可上网。账号开通、初始密码及密码重置可咨询学校网络信息中心。","v":["校园网上网账号在哪儿输入认证","校园网怎么登录认证上网","连上校园网后认证页面怎么弄"],"h":0},{"q":"答辩前还需要提交什么材料给指导老师审核？","a":"答辩前一般需向指导老师提交论文定稿（而非初稿）、查重报告、答辩申请表或评阅表等，由老师审核签字；具体材料清单以所在学院的要求为准。","v":["答辩之前还得提交什么给指导老师看","答辩前要给导师交哪些材料审核","答辩前需要交什么材料让老师审核签字"],"h":0},{"q":"如何快速计算出一周内需要饮用多少瓶矿泉水？","a":"按每天约2升、每瓶500毫升计算：每天约4瓶，一周约14升即28瓶。实际需水量因体重、气温和运动量而异。","v":["一周喝多少瓶水能快速算出来吗","一周要喝多少瓶矿泉水怎么算","怎么快速算一周喝几瓶矿泉水"],"h":0},{"q":"怎么用电极电势判断氧化还原方向？","a":"比较两个电对的标准电极电势，电势较高电对中的氧化型作为氧化剂，电势较低电对中的还原型作为还原剂，反应自发由高电势电对的还原态与低电势电对的氧化态生成低电势还原态和高电势氧化态。标准状态下电池电动势等于正极电势减负极电势，为正即自发。","v":["电动势怎么算","电势判断氧化还原方向","谁是氧化剂怎么判断"],"h":0},{"q":"在数据表中筛选出当前有效期内且单价低于10元的所有商品信息？","a":"用高级筛选：在条件区域用公式条件同时限定有效期和单价，例如 =AND(起始日<=TODAY(), 结束日>=TODAY(), 单价<10)，再执行筛选即可得到结果；也可用自动筛选配合辅助列或 FILTER 函数实现。排序不是筛选条件。","v":["怎么筛出有效期内且单价低于10元的商品","数据表里同时按有效期和单价低于10元筛选怎么做","要找出当前有效且单价小于10元的商品信息怎么操作"],"h":0},{"q":"电源输出为什么会不稳？","a":"可能原因有电网电压波动、电源负载超出额定、滤波电容老化、反馈环路异常或接地线接触不良。负载突变时瞬态响应差的电源会出现电压跌落。排查可先断开负载看空载是否稳定，再逐步加载定位问题点，必要时用示波器观察纹波和噪声。","v":["怎么测电源纹波","电源输出不稳原因","超载会怎样"],"h":0},{"q":"发达国家和发展中国家怎么划分？","a":"根据经济发展水平差异，世界国家分发达国家和发展中国家。发达国家主要分布在欧洲西部北美和大洋洲，如美英法德日澳，经济水平高、产业结构以第三产业为主；发展中国家多在亚洲非洲拉美，经济相对落后、第一产业比重较大。南北对话指发达国家与发展中国家谈判，南南合作指发展中国家之间合作。","v":["南北对话是什么","南南合作含义","发达国家有哪些"],"h":0},{"q":"信用卡的还款宽限期是多久，逾期会有哪些后果？","a":"多数银行提供约3天的还款宽限期（部分银行没有或天数不同，以发卡行规定为准）。超过宽限期仍未还清最低还款额，会产生违约金和利息（通常按日万分之五计收，并按月计复利），逾期记录还可能上报征信，影响个人信用。","v":["信用卡晚还几天没事吧会有什么后果","信用卡过了宽限期没还后果严重吗","信用卡还款宽限期有几天逾期会怎样"],"h":0},{"q":"三方协议和就业证明有什么区别？","a":"三方协议是毕业生、用人单位、学校三方签订的就业意向协议，用于明确就业去向及办理派遣、档案户口转递等，不等同于劳动合同，正式劳动关系以入职后签订的劳动合同为准；就业证明是用人单位出具的、证明你已在该单位就业的材料，只起证明作用，不设定三方权利义务。","v":["三方协议和就业证明分别是什么","三方协议跟就业证明差在哪","就业证明和三方协议有啥不同"],"h":0},{"q":"深空探测器怎么和地球通信？","a":"依靠大口径天线发射无线电信号，深空网络由分布在全球的大型射电天线组成，负责接收极微弱信号并发送指令。距离越远信号越弱、延迟越长，探测器需具备一定自主能力。","v":["探测器怎么传回数据","深空网络是什么","深空通信为什么难"],"h":0},{"q":"误删重要文件后应该立即采取什么措施来尝试恢复它们呢？","a":"首先立即停止向该磁盘/分区写入任何数据（不要保存新文件、不要在该盘安装软件），并检查回收站、系统备份或云端历史版本；若仍找不到，再用数据恢复软件（安装到其他磁盘）扫描，或送专业数据恢复机构处理。","v":["不小心删了重要文件立刻怎么办","误删文件后马上该做什么来恢复","重要文件误删了第一步怎么补救"],"h":0},{"q":"完全公平调度器怎么用虚拟运行时间选任务？","a":"调度器给每个任务维护虚拟运行时间，任务运行越久该值增长越快，优先级权重影响增长速度。每次调度选择红黑树中虚拟运行时间最小的任务，使各任务获得与其权重相称的处理器份额。这种方式避免了传统时间片需要精确计算的难题，能平滑地兼顾交互与批处理任务。","v":["公平调度器原理","虚拟运行时间是什么","调度器怎么选下一个任务"],"h":0},{"q":"如何将WPS文档上传到云端并同步至其他设备上呢？","a":"先登录 WPS 账号，通过“文件—另存为”把文档保存到“WPS 云文档/我的云文档”，或开启文档云同步功能；然后在其他设备上用同一账号登录 WPS，在云文档中即可打开并继续编辑，改动会自动同步。","v":["WPS文档如何上传云端并在其他设备同步","WPS文档怎么传到云端同步到别的设备","怎么把WPS文档存云端同步到其他设备"],"h":0},{"q":"社团公众号想发推文，需要先给谁审核？","a":"推文内容先交社团指导单位或校团委审核，通过后再按学校新媒体管理规定发布；具体审核要求以学校最新通知为准。","v":["社团发公众号推文要审核吗？","社团推文先找谁审？","社团新媒体发布有啥审核要求？"],"h":0},{"q":"怎样查看团队成员对我的文档的最新修订情况？","a":"要看具体使用的工具：在线协作文档一般在文档内打开“版本历史/修订记录”，即可看到谁在何时改了什么；本地 Office 文档可开启“修订/跟踪更改”后查看改动，或用“比较文档”功能与旧版本对比。","v":["团队成员改我文档的最新情况怎么查","在哪看队友对我文档的最新修订","怎么查看团队成员对文档的最新修改"],"h":0},{"q":"晚上突然发烧难受，校内有没有能应急咨询的地方？","a":"可先联系校医院急诊或学校值班电话咨询处置建议，情况严重及时拨打急救电话或前往就近医院；具体联系方式以学校最新通知为准。","v":["半夜生病了找谁？","晚上发烧去哪看？","校内夜间急诊怎么联系？"],"h":0},{"q":"手机充电特别慢，半天充不满，是哪里出问题了？","a":"先换一套充电器和数据线试试，确认是不是配件老化。如果换了还慢，可能是充电接口有灰尘或电池老化，需要清理接口或检修。","v":["手机充半天电没反应","手机充电为什么这么慢","手机充电速度突然变很慢"],"h":0},{"q":"什么是球状星团和疏散星团？","a":"星团是被引力束缚的恒星集团。球状星团含数十万颗老年恒星，呈球状密集分布于星系晕；疏散星团只有几百颗年轻恒星，结构松散，位于星系盘中。","v":["星团有哪些类型","球状星团特点","疏散星团和球状星团区别"],"h":0},{"q":"什么是打板？","a":"打板是在股票即将涨停或刚涨停时以涨停价买入，博取次日继续上涨的短线战法。它收益高但风险极大，一旦开板或次日低开可能大幅亏损，需要严格纪律和快速反应，不适合缺乏经验的新手。","v":["打板是什么意思","打板风险大吗","涨停板战法"],"h":0},{"q":"为什么会有既视感？","a":"既视感是明明第一次经历却觉得似曾相识的现象，可能与记忆系统短暂错位、场景细节相似或大脑颞叶活动有关。它是常见无害的现象。","v":["为什么觉得似曾相识","既视感是什么","既视感正常吗"],"h":0},{"q":"基尔霍夫电压定律怎么列方程？","a":"基尔霍夫电压定律指出沿任意闭合回路绕行一周，各段电压降的代数和为零，本质是能量守恒。列方程时先选定绕行方向，遇到电压参考方向与绕行一致取正否则取负。它对含电源和电阻的任意回路都成立，是网孔分析法的直接依据。","v":["回路电压怎么列方程","电压定律反映什么守恒"],"h":0},{"q":"需要准备哪些 HTML 文件来搭建一个基本的网页框架？","a":"基本网页通常只需一个 HTML 文件（一般命名为 index.html）即可；CSS 样式表和 JavaScript 脚本是可选的独立文件，不属于 HTML 文件。","v":["做个简单网页框架需要哪些HTML文件","基本网页框架得准备什么HTML文件","搭基本网页框架要准备哪些HTML文件"],"h":0},{"q":"校外访问知网等数据库的两种方式","a":"在学校外面要查知网、万方、维普、Web of Science、Springer 这些库，有两条正路。第一条是 CARSI：打开 ds.carsi.edu.cn，在学校列表里选中国农业大学，用学校统一身份认证的账号密码登录即可，不需要装 VPN，目前目录里已经收录知网、EBSCO、Emerald、IEEE、RSC、Springer Nature 等四十余种资源。第二条是学校的校外 VPN，从学校主页「校外 VPN」入口进 vpn.cau.edu.cn，装客户端用统一身份认证登录，登录后再访问图书馆主页的数据库。注意数据库访问是 IP 控制的，不能用免费代理，也不能把账号借给校外人员。CARSI 登录问题可以发邮件到 tsg006@cau.edu.cn，电子资源使用问题发到 xuwei@cau.edu.cn。","v":["CARSI","下文献","数据库","校外怎么用知网查文献？","校外查万方能直接登录吗？","校外访问"],"h":0},{"q":"看云能预测天气吗？","a":"有一定参考价值。积云快速发展成积雨云预示雷阵雨，卷层云增多加厚可能预示暖锋来临，鱼鳞云常预示天气变化。但看云只是经验判断，准确预报还要依靠仪器和数值模式。","v":["什么云要下雨","看云能知道天气吗"],"h":0},{"q":"就业去向登记和户档派遣都在中农云系统办吗？","a":"所有毕业生，无论考研、保研、出国、就业、线下签约还是网签，都需要在中农云系统进行就业去向登记。户档派遣同样在中农云系统申请，是毕业之后户口与档案转出的依据，填写前应确认接收单位的准确名称与地址。","v":["就业去向登记谁要填","户档派遣在哪里申请","档案户口转出怎么申请"],"h":0},{"q":"如何通过手机电脑版微信备份聊天记录和文件夹内容？","a":"手机和电脑连同一WiFi，在电脑版微信左下角“更多”—“备份与恢复”—“备份聊天记录至电脑”，然后在手机上确认并选择要备份的聊天；恢复时选“恢复聊天记录至手机”。也可在手机微信“我—设置—聊天—聊天记录迁移与备份”中操作。微信只能备份聊天记录，不能备份任意文件夹。","v":["手机和电脑版微信怎么备份聊天记录","用电脑版微信咋备份手机聊天记录","电脑版微信备份聊天记录和文件怎么操作"],"h":0},{"q":"A-Level、IB和AP课程是什么？","a":"这三者是国际通行的高中阶段课程，常用于申请海外本科。A-Level是英国课程，学生选三到四门深入修读；IB是国际文凭课程，强调的全面发展和论文；AP是美国大学先修课程，可折算大学学分。选择哪种取决于目标国家和学生特点。","v":["A-Level怎么选课","IB和AP区别","国际课程选哪个"],"h":0},{"q":"打印成绩单时如何设置纸张大小和方向为横向？","a":"在“页面布局”选项卡中，点击“纸张大小”选择所需规格（如A4），再点击“纸张方向”选择“横向”，无需先选中数据区域；也可在“文件—打印”的设置中直接选择纸张和横向。","v":["成绩单打印纸张大小和方向咋调横向","打印成绩单怎么把纸张设成横向","打印成绩单时横向纸张在哪里设置"],"h":0},{"q":"双面打印一次大概多少钱？","a":"打印收费各校、各打印点不同，双面打印一般按面或按张计费，具体价格请查看所在学校打印点的收费标准或现场咨询。","v":["双面打印一次收费多少","双面打印价格一般是多少","双面打印大概要花多少钱"],"h":0},{"q":"两校区往返除了班车还有哪些走法","a":"东校区和西校区之间除了校车，还有几种走法。地铁方案是从六道口站乘昌平线往蓟门桥方向，到西土城站换 10 号线，再换 4 号线到西苑一带，出站后步行或者骑车到西校区，换乘次数较多，总用时明显比校车长。公交方案可以关注 438 路，学校官方交通指引中提到这条线路，它一端到北京北站、另一端到永丰公交场站，在东校区六道口一带和西校区附近都有站点，具体上下车站以站牌为准。骑行方案全程约 12 公里，需要 40 分钟以上，适合天气好、时间充裕的时候。总体建议是赶时间坐校车，错过班次再用地铁或者公交兜底。","v":["东校区到西校区除了校车怎么走","两校区","两校区骑自行车过去方便吗","六道口坐地铁去西校区怎么换乘","地铁换乘","骑行"],"h":0},{"q":"如何避免PDF文件在打印时出现双面重复的情况？","a":"在打印对话框中把“双面打印/小册子打印”改为单面，并检查打印机驱动属性里的双面选项是否也关闭，避免应用与驱动重复设置；同时确认打印份数和页面范围没有重复。","v":["PDF打出来两面重复了怎么办","PDF打印时双面重复怎么解决","打印PDF老出现双面重复咋设置"],"h":0},{"q":"什么是AI Agent（智能体）？","a":"AI Agent是能自主规划并采取行动的智能程序。它接收目标后，会拆解任务、调用工具（搜索、读写文件、运行代码）、逐步执行直到完成，而不只是生成文字。","v":["Agent是什么","AI Agent能做什么","智能体和聊天机器人区别"],"h":0},{"q":"教资笔试报名时学历信息填错了怎么办？","a":"在报名截止前可登录报名系统自行修改；若已过截止时间，需联系当地考试机构说明情况，以官方最新说明为准。","v":["学历填错还能改吗","报名学历填错了怎么改","教资报名学历信息有误咋办"],"h":0},{"q":"学车需要什么手续和费用呢？","a":"一般需携带本人身份证及复印件到驾校报名，提交照片、完成体检并签订培训协议后缴费；具体费用因地区、车型和驾校而异，需向当地驾校咨询。","v":["学车要办哪些手续花多少钱","报名学车需要什么材料和费用","考驾照要准备啥手续费用大概多少"],"h":0},{"q":"安卓手机如何办理移动数据服务开通和关闭？","a":"开关手机上网：进入设置中的“移动网络/SIM卡与流量管理”，打开或关闭“移动数据”（也可用下拉快捷开关）。移动热点与此无关。若要开通或取消数据上网业务本身，需联系运营商客服或营业厅办理。","v":["安卓手机上移动数据业务开通取消咋办","安卓手机怎么开和关移动数据服务","安卓手机移动数据开通关闭怎么弄"],"h":0},{"q":"打印论文需要准备哪些材料？","a":"一般只需准备论文的电子版文件（U盘、网盘或邮件发送均可），并说明打印份数、单双面等要求；是否需要申请单等材料，以所在学校或打印点的具体规定为准。","v":["去打论文之前要准备什么材料","打印论文要准备啥材料","论文打印需要准备哪些东西"],"h":0},{"q":"成为积极分子后需提交什么报告或总结？","a":"主要是定期向党组织提交书面思想汇报，汇报个人思想、学习和工作情况；参加集中培训后可能需提交学习心得。提交频率由所在党组织规定，并非统一要求每月一次。","v":["当上积极分子后要交什么报告或总结","成为积极分子以后要写什么总结报告","积极分子需要提交哪些汇报材料"],"h":0},{"q":"电脑版微信如何备份聊天记录和文件夹内容到云端？","a":"电脑版微信没有“同步至云”这类云端备份功能。可在电脑版微信左下角“更多—备份与恢复”中选择“备份聊天记录至电脑”，让手机和电脑连接同一 Wi-Fi 并在手机上确认，即可把聊天记录备份到电脑本地；需要时再用“恢复聊天记录至手机”。聊天中的文件可先另存到本地文件夹，再自行上传到网盘保存。","v":["电脑版微信如何把聊天记录备份到云端","电脑版微信聊天记录和文件夹怎么备份到云端","电脑版微信聊天记录能备份到云上吗怎么弄"],"h":0},{"q":"身份证丢失后多久可以去公安局申请补领新证？","a":"身份证丢失后没有等待期，可随时到公安机关户籍窗口（或异地受理点）申报挂失并申请补领，一般需交验户口簿等身份证明材料；急需用证的可同时申领临时居民身份证。","v":["补办身份证有没有等待期，丢了多久能去办","身份证丢了要等多久才能去公安局补办","身份证丢失后什么时候能去申请补领新证"],"h":0},{"q":"辅修专业的修读要求与收费","a":"辅修一般每年 6 月申请，只允许修读一个辅修专业，而且必须与主修专业归属不同的本科专业大类，不能选同类专业凑学分。培养方案通常包含约 40 学分的课程和毕业论文（设计），并且要求涵盖主修培养方案的全部核心专业课程。费用按学分收取，标准是 100 元一学分，中途退出不退费，报名前先算好经济成本。上课原则上单独组班，时间集中安排在周末，容易和主修课程或实习撞车。辅修学分可以认定为主修的普通通识课学分，但要按学校规定办理。拿证有两种结果：取得主修毕业或结业证书且辅修课程全部合格，发辅修证书；取得主修学士学位且辅修课程和毕业论文都合格、符合学位授予细则，可授辅修学士学位，在主修学士学位证书中注明，不单独发放学位证书。辅修成绩不合格要随下一年级重修，一旦注销辅修，就不能再单独打印辅修成绩单，非应届毕业生也不能申请注销。","v":["辅修学费","辅修学费是一学分一百元吗？","辅修报名","辅修报名一般几月申请？","辅修能同时修两个专业吗？"],"h":0},{"q":"怎么只把某个文件从暂存区撤出来，但保留改动？","a":"用 git restore --staged <文件名> 把该文件移出暂存区，工作区的修改不会被丢弃。","v":["只撤销一个文件的暂存","如何把文件从暂存区拿出来","怎么取消暂存某个文件"],"h":0},{"q":"电影分级制度是怎么回事？","a":"分级制度按内容适宜程度把影片分为不同级别，提示观众尤其是家长判断适宜性，如暴力色情内容限制未成年人观看。它与审查不同，主要是信息提示而非删改。","v":["为什么要分级","分级和审查区别","电影分级是什么意思"],"h":0},{"q":"实习证明在哪里开具，大概多久能拿到？","a":"实习证明一般由实习单位（接收实习的公司或机构）出具并盖章，领取时间视该单位的办理流程而定；如需学校盖章或备案，可咨询所在院系或教务部门。","v":["实习证明去哪开，一般多久能拿到手","实习证明在哪里办，要等多久","开实习证明该找谁，多长时间能办好"],"h":0},{"q":"沉默是金是什么意思？","a":"这句话借金子的珍贵比喻慎言的价值，意思是在不宜表态或言语可能招祸时，保持沉默是明智的。它提醒人说话要分清场合、三思而后言，但也不能走向该发声时却回避责任。","v":["慎言的名言","沉默是金出处","沉默是金如何理解"],"h":0},{"q":"怎样在Excel中筛选包含特定值的数据而不影响其他行的内容？","a":"选中数据区域，点击“数据”-“筛选”，在目标列的下拉菜单中选择“文本筛选/数字筛选”并设置包含指定值的条件。不符合条件的行只是被隐藏，内容和格式都不会被改动，取消筛选即可恢复显示。条件格式只会标记颜色，不能筛选数据。","v":["Excel怎么筛选包含某值的内容又不改其他行","Excel筛选特定值怎么不影响到别的行","在Excel里只筛出含某个值的数据其他行别动"],"h":0},{"q":"什么是专利的新颖性？","a":"新颖性指该发明在申请日以前未在国内外公开发表过、未在国内公开使用过或以其他方式为公众所知，也没有他人就同样发明申请过专利并记载在先申请文件中。新颖性是授权条件之一，因此研发前查专利可判断技术是否已被公开，避免无效投入。","v":["专利新颖性是什么","为什么申请前要查新","现有技术怎么界定"],"h":0},{"q":"家里如何防火？","a":"不私拉乱接电线、不超负荷用电、远离明火和易燃物、厨房用火不离人、配备灭火器并会用它、定期燃气和电气检查、保持逃生通道畅通。","v":["家庭防火措施","火灾逃生常识"],"h":0},{"q":"什么是游戏中的'肝'？","a":"'肝'指通过大量重复劳动（刷任务、刷装备）来获取游戏资源的行为，源自'熬夜伤肝'。肝度是衡量游戏时间投入成本的俚语。","v":["游戏太肝怎么办","肝游戏是什么意思"],"h":0},{"q":"上课时手机响了或者想接电话怎么办？","a":"在课堂、实验等教学活动中使用手机等通讯设备，或者频繁出入课堂、大声喧哗影响教学秩序且不听劝阻的，给予警告以上处分。确有紧急情况需要接听电话，应先举手示意并到教室外处理。","v":["上课手机响了咋办","课堂上能接电话吗"],"h":0},{"q":"医保如何报销门诊费用？","a":"在定点医疗机构就诊时出示医保卡或医保电子凭证，符合规定的门诊费用可直接刷卡结算；未能直接结算的，可携带发票、费用明细、病历等到参保地医保经办机构申请手工报销。","v":["医保报销门诊费要怎么弄","门诊看病医保如何报销","门诊费用医保怎么报"],"h":0},{"q":"HumanEval第8题sum_product怎么解？","a":"求列表所有元素的和与积，返回二元组。空列表的和约定为0、积约定为1，所以sum初值0、prod初值1，遍历元素累加累乘。例如空列表返回(0,1)，[1,2,3,4]返回(10,24)。关键是乘积初始值必须是1而非0，否则结果恒为零。","v":["HumanEval聚题","sum_product解法","第8题和积"],"h":0},{"q":"想穿学士服拍照去哪借或者租？","a":"学士服通常由学院统一发放或组织租借，也可咨询学校相关部门，具体领取方式和归还要求以学校最新通知为准。","v":["学士服在哪租","拍毕业照服装去哪领","毕业服怎么借"],"h":0},{"q":"引文格式中作者超过三人怎么处理？","a":"不同格式规定不同：国标和APA通常在列出的前若干作者后加等或et al.表示省略，APA七版最多列二十人，超过则列前十九人加省略号和最后一人；MLA格式列第一作者加et al.。写作时应查具体格式手册，全文保持一致。","v":["et al.什么意思","三个作者怎么著录","参考文献作者太多怎么办"],"h":0},{"q":"校园卡的有效期到什么时候，到期了怎么续期？","a":"校园卡有效期通常与学籍状态关联，到期后需按学校通知办理续期或换卡，可在校园卡服务网点或线上平台查询办理入口，具体以学校最新通知为准。","v":["校园卡会过期吗","校园卡到期怎么续","校园卡有效期多久"],"h":0},{"q":"产后多久可以恢复运动？","a":"顺产无并发症通常产后6周（产褥期结束后）可逐步恢复轻度运动，剖宫产需根据伤口愈合情况一般6到8周后。从散步、盆底肌训练开始，避免剧烈运动和负重。产后盆底康复对预防尿失禁和脏器脱垂很重要。","v":["产后减肥要注意什么","产后多久能运动","产后盆底修复"],"h":0},{"q":"动画效果怎样添加才能提升自助渠道介绍页的吸引力？","a":"选中文字或图片后，在“动画”选项卡中选择“飞入”“擦除”“淡出”等效果，在动画窗格里调整顺序、开始方式和持续时间；同一页面保持效果简洁统一，避免过多动画分散注意力。","v":["PPT动画效果在哪里加比较好看","介绍页怎么加动画看起来更有吸引力","自助渠道介绍页怎么设置动画效果"],"h":0},{"q":"如何备份电脑版的聊天记录和文件夹内容到云端存储？","a":"微信没有“云服务同步”功能。电脑版微信可在“设置—备份与恢复”中把手机上的聊天记录备份到电脑；若要存到云端，可把生成的备份文件夹或需要的文件手动上传到网盘（或用网盘客户端同步该文件夹）。","v":["怎么把电脑版聊天记录和文件夹内容备份上云","电脑版聊天记录和文件夹怎么备份到云端","电脑聊天记录和文件怎样传到云存储备份"],"h":0},{"q":"“一”和“不”为什么会变调？","a":"这两个字在词里会随后字声调变调：“一”单念是一声，后面跟四声字时读二声（一样），跟一二三声时读四声（一天、一年、一起）；“不”后跟四声字时读二声（不怕）。这是普通话的连读变调规则。","v":["一为什么不读一声","一二三声变调","不的变调规则"],"h":0},{"q":"门诊和住院报销有什么区别？","a":"门诊报销通常有起付线和年度限额，报销比例较低，部分地区需选定点；住院报销起付线较高但报销比例更高、封顶线更高。具体政策各地差异大，以当地医保部门规定为准，就医前可咨询医保窗口。","v":["住院报销比例多少","医保起付线是什么","门诊能报销吗"],"h":0},{"q":"如何正确截取屏幕以备文档编辑使用？","a":"Windows 可按 Win+Shift+S 使用截图工具，或按 PrtSc 截取全屏；macOS 可按 Shift+Command+4 截取选定区域、Shift+Command+5 打开截图工具。截好后在文档中粘贴或插入保存的图片即可。","v":["截图怎么截才方便放到文档里","文档编辑用的截图该怎么截","电脑上怎么正确截屏备用"],"h":0},{"q":"用 AI 翻译整篇文档，效果和人工翻译比怎么样？","a":"日常阅读和参考够用，专业术语多或要求严谨的场合最好人工校对一遍；涉及合同、法律文件等，以专业翻译或官方说明为准。","v":["AI 翻译和人工翻译差在哪？","AI 翻译长文档靠谱吗？","整篇文档用 AI 翻译能直接交吗？"],"h":0},{"q":"转专业需要哪些材料证明我的学术背景和成绩情况呢？","a":"一般需要提交转专业申请表和在校成绩单（含绩点或专业排名），部分学校还要求相关证明材料；具体材料清单以本校教务部门的转专业通知为准。","v":["想转专业需要准备什么材料证明成绩","转专业申请要提供哪些学术背景材料","转专业要交哪些成绩和学术证明材料"],"h":0},{"q":"如何申请新宿舍的钥匙和床位信息？","a":"一般先到宿管中心（宿舍管理部门）办理入住登记，床位由宿管部门分配，钥匙在宿管中心或楼栋管理员处领取；具体流程以学校宿舍管理规定为准。","v":["换新宿舍了钥匙床位咋办手续","新宿舍钥匙和床位信息找谁申请","申请新宿舍床位和钥匙要走什么流程"],"h":0},{"q":"超新星遗迹里有什么？","a":"超新星爆发后留下扩散的气体壳层，富含氧、硅、铁等重元素，中心可能有中子星或黑洞。这些物质逐渐融入星际云，成为下一代恒星和行星的原料，蟹状星云就是著名例子。","v":["蟹状星云是谁爆发的","超新星留下什么","超新星遗迹是什么"],"h":0},{"q":"绩点在哪里查？学校有专门的系统吗？","a":"登录学校教务系统或本科生信息平台，在成绩查询栏目里能看到绩点；具体入口和开放时间以学校最新通知为准。","v":["学校系统怎么查绩点","成绩单上的绩点从哪查","绩点在哪看啊"],"h":0},{"q":"风力发电的原理是什么？","a":"风力发电利用风推动叶片旋转，通过传动系统带动发电机把风能转为电能。风越大、叶片扫过面积越大，发电量越高。它清洁、运行成本低，但受风速不稳定影响，需要合理选址、并网调度和储能配合，也要评估对鸟类与景观的影响。","v":["风力发电有什么问题","风能怎么发电","风车为什么转得慢"],"h":0},{"q":"猫为什么喜欢晒太阳？","a":"猫晒太阳有多重原因：阳光带来温暖，帮助节省维持体温的能量；紫外线有一定杀菌作用，有助皮肤健康；同时晒太阳时猫会放松、心情愉悦。此外猫的祖先来自干旱地区，喜暖怕冷的天性被保留下来。所以你常看到猫在窗边趴成一滩。","v":["猫为什么老晒太阳","猫喜欢暖和的地方吗","猫晒太阳有好处吗"],"h":0},{"q":"身份证快到期了在学校附近能换吗？","a":"可到居住地或学校所在地公安机关身份证受理点申请换领，通常需带旧证和居住证明；具体材料和地点以官方最新说明为准。","v":["在学校能办新身份证吗？","旧身份证快过期怎么换？","身份证到期了去哪换？"],"h":0},{"q":"数据库连接池满了怎么排查？","a":"先看慢查询和未释放的连接，再检查连接池最大连接数是否过小；及时关闭结果集和连接，必要时调大上限并观察。","v":["数据库连接数老是不够用","连接池满了从哪查起","连接池爆了怎么处理"],"h":0},{"q":"感冒了应该怎么办？","a":"普通感冒多为病毒感染，通常7到10天自愈。注意休息、多喝水、对症缓解症状即可。抗生素对病毒无效。若高烧不退、呼吸困难应及时就医。","v":["感冒多久能好","感冒怎么办","感冒要吃抗生素吗"],"h":0},{"q":"城濮之战的退避三舍是怎么回事？","a":"春秋时晋楚城濮之战前，晋文公重耳兑现流亡时对楚王的承诺，主动退军九十里。这既守信用，又在战术上避开楚军锋芒、后发制人，最终晋军大胜。故事见于《左传》，体现信义与谋略的结合。","v":["城濮之战经过","晋文公退避三舍原因","退避三舍历史"],"h":0},{"q":"动画效果在切换电脑时容易丢失的原因是什么？","a":"主要是两端软件或版本不同：用不同办公软件或较低版本打开时，新增的动画/切换效果不被支持而被降级或丢弃；另存为旧版格式、PDF、图片或视频也会失去动画。此外链接的音视频未随文件一起拷贝会导致相关效果无法播放。字体缺失只影响文字排版显示，本身不会让动画消失。","v":["动画换电脑就丢失是什么原因"],"h":0},{"q":"欧拉线是什么？","a":"任意非等边三角形中，垂心、重心、外心三点共线，这条直线称为欧拉线，且重心位于垂心与外心之间、到垂心的距离是到外心距离的两倍。等边三角形中三点重合，欧拉线退化。","v":["为什么三点共线","欧拉线定理","欧拉线性质"],"h":0},{"q":"抢到心仪的热门课程后如何保证能上课？","a":"选课后先在教务系统确认选课结果是否成功，再按课表按时上课并留意课程通知；如有疑问可联系开课院系或教务部门。","v":["抢到热门课以后怎么确保能上","热门课抢到了要怎么做才能真的上成","选上心仪的热门课程后怎样保证顺利上课"],"h":0},{"q":"如何使用公式快速计算学分总和？","a":"在表格中用 SUM 函数求和：在目标单元格输入 =SUM(求和区域)，把区域换成实际存放学分的单元格（如 =SUM(C2:C26)），回车即可得到总和。","v":["怎么用公式一下子算出学分总和","怎样用公式把学分总和快速算出来","用公式快速求学分总和的方法是啥"],"h":0},{"q":"图书馆的文献传递服务怎么申请？","a":"在图书馆官网的文献传递/馆际互借栏目提交申请并填写文献信息，审核后按通知获取全文；具体流程以学校最新通知为准。","v":["文献传递在哪提交","校外文献怎么申请","馆际互借怎么办理"],"h":0},{"q":"什么是毛利率和净利率？","a":"毛利率是毛利除以营业收入，反映产品本身的赚钱空间；净利率是净利润除以营业收入，反映最终盈利能力。毛利率高说明产品有竞争力，净利率还受期间费用、税费影响。二者趋势比绝对值更重要。","v":["毛利率和净利率区别","毛利率是什么","毛利率高说明什么"],"h":0},{"q":"律师费由谁承担？","a":"我国一般实行各自承担律师费的原则，败诉方通常不承担对方律师费。但法律规定或合同明确约定的情形除外，如知识产权侵权、恶意诉讼、合同约定违约方承担维权费用等，法院可支持律师费由败诉方承担。","v":["律师费能让对方出吗","打官司律师费谁付","败诉方承担律师费吗"],"h":0},{"q":"放射性测年怎么确定岩石年龄？","a":"某些放射性同位素以固定半衰期衰变成子体元素。测定岩石中母体与子体的比例，就能算出岩石结晶至今的时间。铀铅法、钾氩法等方法覆盖不同时间尺度，是建立地质年代表的基础。","v":["岩石年龄怎么测定","放射性测年原理","铀铅法测年"],"h":0},{"q":"位置算符有什么作用？","a":"位置算符用于限定两个检索词之间的位置关系，如相邻、同句、同段或按固定顺序出现，比布尔逻辑的与更精确。合理使用位置算符可避免两个词虽同时出现但相距很远、语义无关的情况，提高查准率。不同数据库的位置算符符号不同，使用前应查看帮助文档。","v":["位置算符是什么","布尔逻辑不够精确怎么办","邻近检索怎么用"],"h":0},{"q":"海平面为什么会上升？","a":"气候变暖使海水受热膨胀，同时陆地冰川和冰盖融化注入海洋，两者共同抬升海平面。海平面上升威胁沿海低地和岛屿，加剧风暴潮和盐水入侵。","v":["冰川融化影响","海平面上升有什么危害","海平面为什么升高"],"h":0},{"q":"在哪里可以办理丢失的校园卡挂失手续？","a":"一般可通过学校一卡通（校园卡）服务中心或服务窗口办理挂失，部分学校也支持校园卡APP、自助终端或电话挂失。具体方式请咨询学校一卡通管理部门。","v":["我的校园卡丢了上哪办挂失啊","校园卡不见了找哪个部门挂失","校园卡丢了去哪挂失"],"h":0},{"q":"库仑定律的内容是什么？","a":"真空中两个静止点电荷间的作用力与电荷量乘积成正比、与距离平方成反比，同号相斥异号相吸。它定量描述静电作用力，是电学的基本定律，形式上类似万有引力定律。","v":["库仑力公式","库仑定律内容","电荷间作用力"],"h":0},{"q":"辅修课程的学分认定有时间限制吗？","a":"多数学校对辅修学分认定有时限要求，一般需在主修专业毕业前或规定学期内提出申请，逾期可能不予受理。具体时限请查阅本校教务处的辅修管理与学分认定规定。","v":["辅修学分认定有时限要求吗","辅修学分认定有没有时间限制","辅修课程学分认定截止到什么时候"],"h":0},{"q":"如何计算某月内费用累计超过100元的天数？","a":"先按日期用 SUMIFS（或 ？","a":"3:00和9:00时两针成直角，12:00两针重合、6:00成一直线。通用算法：分针每分钟走6°，时针每分钟走0.5°，夹角=|30×小时−5.5×分钟|，若大于180°则用360°减去该值，结果为90°即成直角。","v":["如何看时针分针有没有成直角","怎么判断手表时针分针是不是直角","手表上时针和分针成直角怎么看"],"h":0},{"q":"什么是药品有效期？过期药能吃吗？","a":"有效期是药品在规定储存条件下质量合格的期限。过期药有效成分可能降解、药效降低甚至产生有害物质，不应服用。定期清理家庭药箱，过期药按当地药品回收点处理，不要随意丢弃或继续使用。","v":["效期怎么看","药品过期了怎么处理","过期药能吃吗"],"h":0},{"q":"气候变化研究为什么难有绝对结论？","a":"气候系统变量众多、时间尺度长，无法做行星尺度的对照实验，只能依靠观测、模型和自然实验相互印证。因此结论多以概率和置信区间表达，但概率性不等于不确定到无法行动。","v":["概率性结论怎么理解","气候研究难点","气候结论为什么是概率"],"h":0},{"q":"身份证丢失了怎么办理线上恢复服务？","a":"身份证丢失没有“线上恢复/重新激活”这类服务，需要办理挂失申报和丢失补领。可到公安机关户籍窗口或异地受理点办理；部分地区支持在公安政务服务平台线上申请补领并邮寄，具体以当地公安机关的规定为准。","v":["身份证丢了线上怎么恢复","身份证丢失能在网上办恢复吗","身份证没了线上恢复服务咋办"],"h":0},{"q":"教资面试成绩出来后怎么查？","a":"登录中国教育考试网，进入教师资格证面试成绩查询入口，输入姓名和证件号码即可查询，具体开放时间以官方最新说明为准。","v":["教资面试分数怎么查询","教资面试成绩在哪查","面试成绩出来怎么查"],"h":0},{"q":"如何给 iPhone 和安卓手机分别设置锁屏密码和解锁图案？","a":"iPhone：设置—面容 ID 与密码（或触控 ID 与密码）—打开密码，可设数字或自定义字母数字密码；iOS 不支持图案解锁。Android：设置—安全（或锁定屏幕与安全）—屏幕锁定方式，选择“图案”“PIN”或“密码”，具体名称因机型而异。","v":["iPhone和安卓咋各自设锁屏密码跟解锁图案啊","iPhone跟安卓手机咋各自设锁屏密码和图案","想给iPhone和安卓手机设密码和图案解锁该咋操作"],"h":0},{"q":"后期制作包括哪些环节？","a":"包括剪辑、调色、声音设计和混音、视觉特效合成和字幕制作等。拍摄只是素材采集，后期把这些素材组织成完整作品，对最终质量影响极大。","v":["后期为什么重要","后期制作做什么","调色有什么用"],"h":0},{"q":"如何在线备份我的微信聊天记录和文件到电脑版上？","a":"微信没有“保存至云盘”功能。可在电脑版微信左下角菜单中选择“备份与恢复”→“备份聊天记录至电脑”，确保手机与电脑连接同一网络，然后在手机上确认并选择要备份的聊天，备份完成后即可在电脑端保存。","v":["微信聊天记录怎么在线备份到电脑版","微信记录备份到电脑版上怎么操作","怎么把微信聊天和文件备份到电脑版微信"],"h":0},{"q":"页缓存和文件系统怎么配合加速读写？","a":"文件读写先经过内存中的页缓存，命中则直接返回，未命中才从磁盘加载，写操作通常先改缓存再由后台写回。这样把慢速磁盘访问转化为内存访问，并能合并多次写入。内存映射文件也复用同一缓存，保证映射读写与普通读写看到一致内容。页缓存大小与回写策略直接影响文件系统性能。","v":["文件写什么时候落盘","页缓存和映射文件关系","页缓存怎么加速文件读写"],"h":0},{"q":"钚是怎么产生的？","a":"钚主要由铀238在核反应堆中吸收中子后经衰变生成，是人工合成的超铀元素。钚239也可裂变，是核燃料和核武器材料。钚有剧毒且半衰期长，处理和储存要求极高。","v":["超铀元素是什么","钚239","钚怎么来的"],"h":0},{"q":"出院后需要注意什么？","a":"按医嘱继续服药、按时复诊、伤口护理和饮食活动限制、观察异常症状（发热、伤口红肿渗液、疼痛加重等）并及时就医。保留出院小结和检查报告，便于后续就诊。康复期循序渐进，不要急于恢复重体力活动。","v":["出院后不舒服怎么办","出院后注意什么","出院小结有什么用"],"h":0},{"q":"选调生的选拔对象是什么时候毕业的学生？","a":"选调生一般面向当年应届毕业生，学历要求以本科及以上为主，部分岗位或省份要求硕士、博士，具体以各省招录公告为准。","v":["选调生招的是哪一届毕业的学生","选调生选拔对象要求什么时候毕业","选调生面向什么时间毕业的学生招"],"h":0},{"q":"什么是危险废物？","a":"危险废物是具有毒性、腐蚀性、易燃性、反应性或感染性等危险特性的废物，如废电池、废机油、医疗废物和某些化工废料。它需专门收集、贮存、运输和无害化处置，严禁混入生活垃圾或随意丢弃。全过程严格管理是防止污染的关键。","v":["危废是什么","哪些是危险废物","废电池为什么不能乱扔"],"h":0},{"q":"如何在自助机上挂失校园卡并补办？","a":"各校自助机界面不同，一般在自助机上找到挂失相关功能，按提示输入学号/验证身份后办理挂失；补办新卡通常需按学校规定到校园卡服务中心办理并可能收取工本费，具体流程以本校说明为准。","v":["如何用自助机挂失校园卡并补办新卡","校园卡在自助机挂失补办怎么操作","自助机上怎么挂失校园卡再补办"],"h":0},{"q":"什么是能流和能量守恒在环境中的体现？","a":"能量在环境中遵循守恒定律，不会凭空消失，只会从一种形式转化为另一种形式，并在每次转化中有一部分变成难以利用的废热。这解释了为什么能源利用总有损耗、为什么节能重要，也说明所谓消耗能源本质是消耗可用的低熵能量。","v":["为什么能源会越用越少","能量会消失吗","能量守恒和环境有什么关系"],"h":0},{"q":"内存不足杀手是怎么挑选要杀的进程的？","a":"当内存耗尽且回收无法及时释放时，内核启动该机制选一个进程终止以腾出资源。它综合每个进程占用内存、运行时长、优先级和用户可调的评分，通常倾向杀掉占内存多且不重要的进程，同时保护关键系统进程。选择并非绝对精确，重要服务可通过调整评分降低被杀概率。","v":["内存不足杀手怎么选进程","内存耗尽时系统会杀进程吗","怎么保护关键进程不被杀"],"h":0},{"q":"双学位的认证时间是什么时候？","a":"双学位的审核与认定时间由各高校自行规定，通常与毕业资格审核一并办理，具体以所在学校教务部门的通知为准。","v":["双学位什么时候认证啊？","双学位的认定一般啥时候办？","双学位认证时间是怎么安排的？"],"h":0},{"q":"参加选调生考试前有哪些注意事项？","a":"主要注意：一是确认报考条件，选调生一般面向应届毕业生，通常要求中共党员、学生干部经历，并有年龄、学历等限制；二是留意本省公告的报名时间和推荐、资格审核流程，按时报名并提交材料；三是了解笔试科目（多为行政职业能力测验和申论）并针对性备考，同时准备面试、体检和考察环节。具体以本省当年公告为准。","v":["参加选调生考试需要提前注意哪些事","考选调生之前有啥要留意的","选调生考试报名前要注意什么"],"h":0},{"q":"为什么世界是圆的？","a":"梗答案是“因为这样走路才不会掉下去”。它把球形地表这一事实解释成“为了防止掉落”的目的性设计，属于目的论式的胡说：先有结果，再倒编一个理由，听着合理其实经不起追问。","v":["世界为什么是圆的","地球圆形废话解释","走路不会掉下去是什么梗"],"h":0},{"q":"预约座位后多久可以使用？","a":"预约成功后一般需按系统提示在规定时间内到馆签到或取座，座位方可生效；具体时限和取座方式以所在图书馆的预约规则为准。","v":["座位预约完了要等多久才能用","约好座位以后多长时间能去坐","预约座位成功后多久能生效使用"],"h":0},{"q":"查全率和查准率是什么？","a":"查全率是检出的相关文献占系统中全部相关文献的比例，反映漏检程度；查准率是检出的相关文献占全部检出文献的比例，反映误检程度。两者往往此消彼长：扩大检索范围提高查全率但降低查准率，缩小范围则相反。检索策略要根据需求在两者间权衡。","v":["怎么提高查全率","查全率查准率区别","检索结果太多太少的调整"],"h":0},{"q":"人类在MATH上大概是什么水平？","a":"资料显示三届国际数学奥林匹克金牌得主在MATH上的参考正确率约九成。这说明MATH对普通人是相当有难度的竞赛级挑战，但对顶尖数学人才并非不可逾越。当前先进模型在MATH-500上已达到甚至超过这个参考水平，这也是该基准被视作接近饱和、逐渐让位于更难评测的原因之一。","v":["MATH对人类难吗","人做MATH能得多少","模型超过人类了吗"],"h":0},{"q":"合纵连横是什么意思？","a":"合纵连横是战国时两种外交策略。合纵指弱国联合抗秦，苏秦为主；连横指秦国拉拢个别国家、瓦解联盟，张仪为主。二者围绕秦与六国的力量博弈展开，深刻影响了战国后期的政治格局。","v":["合纵连横区别","合纵连横是谁提出","苏秦张仪典故"],"h":0},{"q":"网签在全国高校毕业生毕业去向登记系统怎么走流程？","a":"用人单位在系统上发起邀约，学生在系统应约，然后等学院审核，学院审核通过后再等学校审核。网签同时须在中农云系统同步录入签约单位信息，学院才会审核通过。","v":["单位发起邀约后我怎么应约","网签的步骤是什么","网签要等哪些审核"],"h":0},{"q":"性能回归通常从哪些指标查起？","a":"先对比吞吐、延迟分位、处理器与输入输出利用率、上下文切换和中断次数等宏观指标，确认变化范围。再对照同期变更，包括代码、配置、内核参数和负载特征。缩小到具体子系统后用剖析与追踪深入。回归分析强调用对比基线说话，避免凭单次采样下结论。","v":["为什么要对比基线","回归分析看什么","性能变差怎么排查"],"h":0},{"q":"校园卡丢了或者坏了去哪儿补办？","a":"需到校园卡服务窗口补办新卡。东校区窗口在体育馆东侧，西校区在主楼一层师生服务大厅，服务时间一般为9点至17点，可拨打电话东区62736133、西区62734719咨询。","v":["一卡通坏了怎么换新卡","补办校园卡去哪个窗口"],"h":0},{"q":"U 盘损坏导致的数据无法读取应该怎样修复？","a":"先换USB接口、换电脑或换读卡设备测试，排除接口和驱动问题；若能识别但提示格式化，不要格式化，可用数据恢复软件先做镜像再提取文件；若完全不识别、发热或有物理断裂，应停止反复通电，交由专业数据恢复机构处理。","v":["U盘坏了读不出数据该怎么修","U盘损坏数据读不出来怎么修复","U盘读不了数据坏了要怎么处理"],"h":0},{"q":"申请身份证需要哪些材料？","a":"首次申领一般需携带居民户口簿到户籍所在地公安机关（派出所）办理，照片和指纹由现场采集，通常不需自带照片；换领、补领带原身份证或户口簿即可，具体以当地公安机关要求为准。","v":["办身份证要带什么材料去","第一次申请身份证需要准备哪些东西","身份证申领要交哪些材料"],"h":0},{"q":"家庭经济困难认定每年都要重新申请吗？","a":"家庭经济困难认定一般按学年组织申请和复核，已认定学生也需按要求提交材料，具体安排以学校最新通知为准。","v":["去年认定过今年还要再申请吗","困难认定需要每年重新提交吗","家庭经济困难认定多久申请一次"],"h":0},{"q":"如何在网站查询自己的语言成绩是否符合出国院校要求？","a":"分两步：先登录雅思、托福等考试主办方的官网考生账号查询自己的成绩；再到目标院校官网的招生/入学要求页面查看该校该专业的语言成绩要求，两者对照判断是否达标。考试机构官网只提供成绩，不提供各院校的录取标准。","v":["怎么在网上查自己的语言成绩够不够目标院校要求","语言成绩达不达标去哪儿查怎么对比","雅思托福成绩符不符合出国学校要求怎么查"],"h":0},{"q":"摩擦力定律怎么表述？","a":"滑动摩擦力大小与接触面间的正压力成正比，方向与相对运动方向相反，比例系数由材料和表面状况决定。静摩擦力则在零到最大值间自适应变化，最大静摩擦力通常与正压力成正比。","v":["摩擦定律","滑动摩擦力公式","静摩擦力特点"],"h":0},{"q":"如何在线查询个人成绩？","a":"通常用学号和密码登录学校教务系统，在“成绩查询”类栏目中选择学期或课程查看。具体入口名称以本校系统实际界面为准。","v":["个人成绩怎么在网上查","如何在线查自己的成绩","网上查询个人成绩的方法是什么"],"h":0},{"q":"一加一等于几的歇后语怎么说？","a":"常见说法是“一加一——二（两）”，也有“一加一——等于三”的玩笑版，取“两个人有了孩子”之意。歇后语里的数字题多为谐音或凑趣，重点不在算术，而在引出后面的双关笑点。","v":["一加一歇后语下一句","一加一等于几歇后语","数字歇后语答案"],"h":0},{"q":"宿舍楼内公共设施与消防通道","a":"宿舍楼内的灭火器、消防栓、应急照明、疏散指示标志和烟感报警装置属于公共安全设施，任何人不得挪用、遮挡、损坏或者私自拆改。楼道、楼梯间和疏散通道必须保持畅通，不得堆放纸箱、杂物、自行车或者晾晒衣物，不得在疏散通道内给电动车及电瓶充电，也不得将电瓶带入宿舍楼存放或者充电。使用公共洗衣机、开水器、微波炉等设备时要按操作说明使用，发现设备漏电、异味或者异常声响应立即停止使用并报修。宿舍内发现火情要第一时间按下报警按钮、拨打 119 和保卫处值班电话，并沿疏散通道有序撤离，不要乘坐电梯，不要贪恋财物返回取物。","v":["宿舍楼的灭火器能随便挪动吗？","楼道里能堆纸箱和自行车吗？","电动车电瓶能带回宿舍楼充电吗？","电瓶"],"h":0},{"q":"怎么快速判断细胞处于有丝分裂哪个时期？","a":"先看染色体的行为和位置：染色体散乱分布、核膜核仁消失是前期；染色体着丝粒排列在赤道板上是中期；着丝粒分裂、姐妹染色单体分开并移向两极是后期；染色体到达两极、核膜核仁重新出现、细胞板形成是末期。关键是记住中期看排列、后期看分离这两个最典型的特征。","v":["中期后期特征","怎么判断分裂时期","染色体排列在赤道板是什么期"],"h":0},{"q":"什么是量价关系？","a":"量价关系研究成交量与价格变动的配合。常见规律有量价齐升（健康上涨）、价涨量缩（动能减弱）、量增价跌（抛压释放）等。它是判断趋势真伪的重要辅助，但没有固定公式，需结合位置和市场环境。","v":["价涨量缩说明什么","量价关系是什么","量价背离什么意思"],"h":0},{"q":"电费充值卡上显示还有10元余额，但用时提示不足电了怎么办？","a":"先确认卡内金额是否已成功写入电表：可重新插卡（或按当地购电方式）充值一次，再看电表余额。若仍提示电量不足，可能是充值未到账、存在欠费或阶梯电价扣费。建议携带购电卡和缴费凭证到当地供电营业厅，或拨打供电客服热线核实处理。","v":["充值卡还有10元余额但说电不够怎么回事","电费充值卡显示有10元却提示电量不足咋办","电费卡上剩10元可用电时提示不足怎么处理"],"h":0},{"q":"扫描文件到云空间通常多久能拿到结果？","a":"没有固定的等待时间。扫描并上传完成后通常即可在云端查看，实际耗时主要取决于页数、文件大小和网络速度。","v":["扫描件传到云空间多久能看到结果","扫描文件到云空间一般要等多久","把文件扫描上传云空间要等多长时间"],"h":0},{"q":"图书馆入馆规则与座位使用","a":"本校读者凭本人校园一卡通刷卡入馆，可以借书、预约研讨室、预约上网学习区座位；一卡通限本人使用，不得转借。校外读者凭馆际互借证或单位介绍信加有效证件办理临时入馆。图书馆明确禁止用书本、水杯、衣服等物品占座，读者暂时离开超过二十分钟，其他人就可以使用这个座位；闭馆前个人物品必须带走，图书馆会不定期清理占座和存放物品，被清理的物品凭身份证和校园卡到总服务台登记领取，自清理之日起三十天内无人认领按无主处理。此外，全馆禁止吸烟和携带易燃易爆物品，食品饮料要严密包装、不得在阅览区进食，着装不要穿背心、运动短裤、拖鞋和钉鞋。","v":["入馆","刷卡进馆","图书馆拿书占座行不行？","图书馆规矩","着装","离开二十分钟座位还能留吗？"],"h":0},{"q":"什么是战略威慑的稳定性？","a":"战略稳定指双方都缺乏率先发动攻击的动机、危机中不易因误判升级的状态。它依赖可靠二次打击能力、清晰的沟通渠道和克制性的政策。相反，若一方担心被解除武装，就可能在危机中倾向于先发制人，从而削弱稳定。","v":["为什么危机中容易误判","怎么维持战略稳定","战略稳定是什么"],"h":0},{"q":"重心和质心有什么区别？","a":"质心是质量分布的平均位置，只和质量有关；重心是重力合力的作用点，在均匀重力场中与质心重合。工程通常默认重力场均匀，所以常用重心。求组合体重心可用分割法，把各部分重力对某轴取矩再除以总重力。","v":["均匀重力场什么意思","重心和质心区别","重心怎么求"],"h":0},{"q":"看医生前要准备什么？","a":"带上身份证医保卡、既往病历和检查报告、正在服用的药物清单（或药盒）、症状记录（何时开始、什么诱因、如何变化）、想问的问题清单。检查报告按时间排序，便于医生快速了解病情全貌。","v":["怎么跟医生说病情","看医生要带什么","看病前准备什么"],"h":0},{"q":"如何正确切换电脑并保护PPT母版？","a":"母版保存在 PPT 文件内部，换电脑时拷贝原 .pptx 文件即可带走母版；为避免版式错乱，把用到的字体安装到新电脑，或在“文件→选项→保存”中勾选将字体嵌入文件，换机后在“视图→幻灯片母版”中检查。另存或打印为 PDF 只能保留外观，不能保留可编辑的母版。","v":["换台电脑演示文稿母版会乱吗","换电脑怎么保住幻灯片母版","换电脑放幻灯片怎么保留母版"],"h":0},{"q":"电脑开机后总要手动输密码，想让它自动登录怎么设置？","a":"按 Win+R 输入 netplwiz 回车，取消勾选“要使用本计算机，用户必须输入用户名和密码”，点应用后输入一次当前 瓶颈在计算、内存还是存储？","a":"看三类信号：处理器持续满载且等待少偏向计算；缓冲池命中率低、换页或内存回收频繁偏向内存；输入输出等待高、队列深、磁盘利用率饱和偏向存储。三者会相互影响，例如内存不足引发更多读盘表现为存储瓶颈，根因却在内存。应沿着等待链向上追溯，而不是只看最表面的高利用率。","v":["cpu内存磁盘瓶颈怎么分","存储瓶颈根因在内存吗","资源指标怎么交叉看"],"h":0},{"q":"选课的正选、补退选与名额释放规则","a":"选课分正选和补退选两个阶段，正选阶段按培养方案选下学期的课，补退选阶段做最后的增减。退课释放出来的名额不会立刻回到课池，系统每天 12:00 和 18:00 分两次集中释放，所以补退选期间卡点刷新比一直反复点更有效。选课时间截止后既不能再选课也不能退课，选上了不去上课又没退课，会被按旷考处理，所以拿不准的课宁可不选。学校严禁课程代选和买卖名额，被查实要按违纪处理。选课时注意看清课程的开课校区、上课时间、容量和是否限选专业，东西校区之间来回跑的时间要算进课表。每学期选课的具体时间安排以本科生院通知为准。","v":["名额释放","抢课","正选","补退选","补退选卡点刷新有用吗？","退课名额每天几点放出来？"],"h":0},{"q":"森林为什么被称为地球之肺？","a":"森林通过光合作用大量吸收二氧化碳、释放氧气，并调节全球碳循环和气候，因此被称为地球之肺。此外森林还能涵养水源、保持水土、防风固沙、维持生物多样性。不过需要注意，成熟森林的氧气净产出并不像想象中那么高，其价值更在于固碳和生态调节。","v":["森林为什么叫地球之肺","森林有什么生态作用","森林能吸收多少二氧化碳"],"h":0},{"q":"如何在图书馆保持安静阅读状态？","a":"进馆前把手机调成静音或震动，需要听音乐戴耳机；阅读时不交谈、不外放，接电话或讨论到馆外/指定讨论区；轻拿轻放椅子、书本，减少走动噪音。","v":["图书馆里怎样做才能安静看书","在图书馆怎么保持安静阅读","如何让自己在图书馆安静地阅读"],"h":0},{"q":"平衡常数和平衡转化率是一回事吗？","a":"不是。平衡常数只由温度决定，反映反应进行的最大限度，与初始浓度无关；平衡转化率是实际达到平衡时反应物转化的比例，随初始浓度、配比和压强改变。同一平衡常数在不同起始条件下可对应不同转化率，增大某种反应物浓度可提高另一反应物的转化率。","v":["平衡限度怎么衡量","提高转化率方法","转化率和K关系"],"h":0},{"q":"怎样添加并调整文档中的批注？","a":"选择需加批注的文本区域，转至审阅标签下的新建评论按钮创建新批注内容，并根据需要移动和编辑该批注的位置。","v":["怎么在文档里添加批注并调整","文档批注的添加和调整方法是什么","文档里的批注怎么加怎么调位置"],"h":0},{"q":"震荡市怎么配置资产？","a":"震荡市缺乏明确趋势，可采取均衡配置、降低仓位、增加债券和货币基金比例、保留现金等待机会。策略上以高抛低吸的波段操作和定投为主，避免重仓追涨。控制回撤比博取收益更重要。","v":["震荡市怎么投资","震荡市风险","震荡行情买什么"],"h":0},{"q":"考试时发现桌子上有别人写的字，需要提前报告吗？","a":"进考场后先检查桌面，发现字迹或刻痕立刻举手向监考老师报告，由老师处理或调换座位，不要自己擦掉或不管。以学校最新通知为准。","v":["桌上有字要不要跟老师说","考试桌面有字迹怎么办","进考场发现桌上刻了字"],"h":0},{"q":"退换货包裹应该放在哪里寄送呢？","a":"按商家提供的退货地址和方式寄送即可：可在购物平台申请退货后预约快递上门取件，或自行到快递网点、驿站等寄件点交寄；校园内可到提供寄件服务的快递点办理。","v":["商家让退货包裹该送到哪个点寄","退换货的东西放哪儿寄","退货的包裹要寄到哪里去"],"h":0},{"q":"Word的页面布局总是出错怎么办？","a":"先统一页面设置（纸张大小、页边距、纸张方向）；不同版式之间用分节符分隔，而不是靠空格和回车排版；打开编辑标记，删除多余的空段落、手动分页符；正文和标题统一使用样式，必要时清除格式后重新套用样式。","v":["排版时页面设置总乱，怎么弄好？","文档的页面格式总出问题，咋解决？","文档页面布局老是出错怎么办？"],"h":0},{"q":"绿水青山就是金山银山怎么理解？","a":"这一理念揭示了生态环境保护和经济发展的辩证统一关系。良好生态环境是最普惠的民生福祉，保护生态环境就是保护生产力，改善生态环境就是发展生产力。不能以牺牲生态为代价换取一时经济增长。","v":["两山论意义","发展和保护关系","绿水青山是什么"],"h":0},{"q":"如何避免学校通知被误判成广告过滤掉？","a":"把学校通知的发件人地址加入邮箱白名单或通讯录，检查并放宽自定义过滤规则；若已被误判，在垃圾邮件中将其标记为“非垃圾邮件”，并定期查看垃圾邮件文件夹。","v":["咋防止学校通知被误判成广告","学校通知总进垃圾箱咋整","学校通知老被当广告过滤怎么避免"],"h":0},{"q":"学校有哪些勤工助学岗位可以报名？","a":"勤工助学岗位一般由学校学生资助部门统一发布，可关注校内资助平台或向学院咨询报名；岗位和安排以学校最新通知为准。","v":["勤工助学怎么找岗位","想参加勤工助学咋报名","校内勤工岗位在哪看"],"h":0},{"q":"查重时如何避免重复使用同一篇文献的不同部分作为参考材料？","a":"引用同一篇文献的不同部分并不违规，关键是规范标注出处（同一来源沿用同一引用编号或按要求的格式重复标注），并用自己的语言概括、避免大段照抄原文。查重检测的是文字重复率，而不是引用来源是否重复。","v":["一篇文献拆开引多次会不会算重复","同一篇文献分几处引用算重复吗","查重时引用同一文献不同段落行不行"],"h":0},{"q":"安全带为什么重要？","a":"碰撞时安全带将乘员固定在座位上，避免与车内硬物撞击或被甩出车外，能显著降低重伤和死亡风险。开车和乘车都要全程系好，后排同样需要，儿童应使用安全座椅。","v":["不系安全带有什么后果","后排要系安全带吗","安全带的作用"],"h":0},{"q":"英语里 the 什么时候必须加，什么时候可以不加？","a":"特指双方都知道的人或物、独一无二的事物前通常加 the；泛指一类人或物、专有名词前一般不加。拿不准时看是否“特指”。","v":["the 不加行不行？","什么时候该加 the？","定冠词 the 怎么用？"],"h":0},{"q":"什么是蚕头雁尾？","a":"蚕头指横画起笔时藏锋圆顿、形如蚕头，雁尾指收笔时重按后向右上挑出、形如雁尾。这是隶书横画的典型笔法，一波三折、富有弹性。写隶书要突出主横的蚕头雁尾，但一字之内不宜重复太多。","v":["一波三折","蚕头雁尾指什么","隶书横画怎么写"],"h":0},{"q":"打印时如何避免页面空白和边距不正确的问题？","a":"在“页面设置”中选择合适的纸张大小与方向、调整页边距和页眉页脚距边界的距离；打印前用打印预览检查分页，删除多余的空段落、分页符或空行，避免出现空白页。","v":["怎样防止打印时页面空白边距不正确","打印出现空白页和边距不对怎么避免","打印边距不对还有空白页要怎么处理"],"h":0},{"q":"宇宙有多大？","a":"可观测宇宙的直径约930亿光年。宇宙可能无限大，而可观测范围受光速和宇宙年龄（约138亿年）限制。宇宙还在加速膨胀。","v":["可观测宇宙是多少光年","宇宙边界"],"h":0},{"q":"用典过度有什么坏处？","a":"通篇堆砌典故会让文章晦涩难懂、显得炫耀，冲淡自己的观点，也容易因误用而暴露知识缺陷。好的表达应以清楚传达为前提，典故只是辅助，用得恰到好处才见功力。","v":["典故堆砌问题","用典太多的坏处","适度用典"],"h":0},{"q":"苏武牧羊体现了什么精神？","a":"西汉苏武出使匈奴被扣留，匈奴多方威逼利诱劝其投降，他坚贞不屈，被流放到北海牧羊十九年，持汉节不失，直到汉匈和亲才回国。故事体现忠贞不屈、坚守气节的精神，见于《汉书·苏武传》。","v":["苏武持节","苏武牧羊典故","苏武被扣留多久"],"h":0},{"q":"密码忘了但邮箱还能用，怎么把账号找回来？","a":"走登录页的“忘记密码”，通过邮箱收验证码或重置链接来设新密码；别在陌生页面输入旧密码，重置后顺手检查登录设备。","v":["忘记密码怎么重置","账号密码忘了怎么弄回来","邮箱还能用怎么找回密码"],"h":0},{"q":"体育俱乐部课程选课需要满足什么条件？","a":"选课需要同时满足两个条件，一是最近一学期国家学生体质健康标准测试成绩达到 60 分及以上，二是已经修读过该项目的基础课程或者具备同等运动水平。选课前应仔细阅读课程说明和教师要求，避免选了之后无法完成考核。","v":["俱乐部课程对体测成绩有要求吗","报体育俱乐部有什么门槛","选体育俱乐部要先修基础课吗"],"h":0},{"q":"忘记 iPhone 密码怎么办？","a":"iPhone 锁屏密码无法找回，只能抹掉设备后重新设置：用电脑让 iPhone 进入恢复模式并恢复系统，或在“查找”中远程抹掉设备（需 Apple ID 密码），之后可从备份恢复数据。若忘记的是 Apple ID 密码，可在 iforgot.apple.com 重置。","v":["iPhone密码忘了该怎么处理","iPhone密码记不住了咋整","iPhone锁屏密码想不起来怎么办"],"h":0},{"q":"React项目部署到服务器上需要哪些步骤？","a":"先执行构建命令（如 npm run build）生成静态产物（CRA 默认 build 目录，Vite 默认 dist 目录），把产物上传到服务器，再用 Nginx 等 Web 服务器指向该目录并配置 try_files 回退到 index.html 以支持前端路由；如需调用后端接口，配置反向代理或正确的接口地址，最后绑定域名并按需开启 HTTPS。index.html 不能直接“运行”。","v":["React项目上线到服务器需要做哪些步骤","React项目部署到服务器要经过哪些步骤","把 React项目放到服务器上怎么部署"],"h":0},{"q":"宿舍报修找哪里？","a":"宿舍报修可通过学校后勤维修平台或找宿管登记，紧急情况直接联系楼内值班室，具体入口以学校最新通知为准。","v":["宿舍维修找谁","报修流程是什么"],"h":0},{"q":"什么是伦理审查委员会？","a":"伦理审查委员会由医学、法律、伦理和公众代表组成，负责审查涉及人或动物的研究方案，评估风险收益、知情同意和隐私保护，有权批准、要求修改或否决研究，以保护受试者权益。","v":["伦理委员会做什么","伦理审查流程","谁监督医学实验伦理"],"h":0},{"q":"提交代码时需要包含哪些信息？比如版本号或者描述文字。","a":"除了修改的文件内容外，在每次推送前应添加详细的信息如commit message或tag以记录更改的目的和状态。","v":["代码提交需要附上啥说明内容","推代码时得带什么描述和版本号","提交代码要写哪些信息进去"],"h":0},{"q":"电动车电池能带回宿舍充电吗，车停哪儿？","a":"电动自行车要在学校设置的充电区域充电，严禁把电池带进宿舍、楼道或室内充电，也禁止从楼上飞线充电，学校会严格检查处理。自行车、电动自行车应停放在指定区域并摆放整齐，禁止在宿舍楼内停放。","v":["飞线充电会被查吗"],"h":0},{"q":"什么是过敏？过敏反应分几级？","a":"过敏是免疫系统对无害物质过度反应。轻度表现为皮疹、瘙痒、打喷嚏；中度可伴呕吐、喘息；重度过敏性休克会出现喉头水肿、血压骤降，需立即注射肾上腺素并急救，属致命急症。","v":["过敏严重会死吗","过敏反应分级","过敏有哪些症状"],"h":0},{"q":"开发一个简单的网页需要哪些必备的HTML/CSS/JS知识和工具？","a":"知识方面：HTML 的文档结构与常用标签（标题、段落、链接、图片、表单等）；CSS 的选择器、盒模型和常见布局（Flex/Grid）；JavaScript 的基础语法、DOM 操作与事件处理。工具方面：一个代码编辑器（如 VS Code）、一个浏览器及其开发者工具即可，静态页面直接用浏览器打开或用本地静态服务器预览。","v":["做网页前要准备什么HTML/CSS/JS技能和工具","入门网页开发要掌握哪些HTML/CSS/JS知识啊","想做个简单网页得会哪些HTML/CSS/JS基础"],"h":0},{"q":"快递驿站与取件流程","a":"东校区设有快递服务点和智能快递柜，校内快递服务由近邻宝、京东派等运营，包裹到达后会通过短信或公众号推送取件码。学校在东区设有近邻宝快递服务中心，公主楼 B 座前、研究生 2 号公寓南侧、3 号公寓南侧一带设有集中服务点，毕业季的行李托运也在这几处集中办理。取件时按取件码到对应货架或智能柜领取，出库时扫描二维码或刷取件码核销；部分快递柜支持 24 小时自助取件，人工代收点则有固定营业时间，通常上午开门、晚间关门前有一个取件高峰。包裹在代收点一般有免费保管期限，超期可能被退回或被收取保管费用，具体以各代收点的提示为准。取件时核对姓名和手机号，避免拿错他人包裹。","v":["东校区快递在哪取？","京东派","京东派的快递去哪拿？","取快递","快递","快递在哪取"],"h":0},{"q":"每个月结余不多，还有必要做资产配置吗？","a":"有必要，钱少时先做简单配置，比如留出应急金后，剩余部分按低风险和高风险比例分开投，比例按自己承受力定。","v":["小资金要不要分散投资","结余少怎么做资产配置","钱不多需要做资产配置吗"],"h":0
