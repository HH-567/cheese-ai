分。它能提供不同于学术教育的上升通道，促进社会流动和就业。但在学历社会中常被视为'次等选择'，反映出社会观念和制度安排的问题。提升职业教育地位是许多国家的政策方向。","v":["为什么职教被看低","职业教育如何发展","职业教育有什么用"],"h":0},{"q":"抓不住的泥鳅是什么歇后语？","a":"答案是“滑溜得很”。泥鳅身上滑，越想抓越抓不住，比喻人狡猾机灵、难以被拿住把柄，也形容事情棘手不好处理。这句歇后语常带点无奈的语气，说对方实在太滑头。","v":["抓不住泥鳅下一句","泥鳅滑什么意思","滑溜得很歇后语"],"h":0},{"q":"WPS 演示怎么给所有幻灯片加上连续页码？","a":"在「插入」里选「幻灯片编号」，勾选应用到全部幻灯片，页码就会按顺序显示。如需从某页开始，可在页面设置里调整起始值。","v":["PPT每页怎么加页码","怎么给幻灯片编号","演示文稿页码怎么设置"],"h":0},{"q":"投影面平行线有哪几种？","a":"平行于一个投影面而倾斜于另两个投影面的直线称投影面平行线，按所平行的投影面分为正平线、水平线和侧平线。它在所平行的投影面上投影反映实长和真实倾角，在另两投影面上的投影平行于相应投影轴且长度缩短。","v":["投影面平行线分类","正平线是什么","水平线投影特点"],"h":0},{"q":"世界贸易组织的核心职能是什么？","a":"世界贸易组织负责管理多边贸易规则、组织贸易谈判、解决成员间贸易争端并审议各国贸易政策。其基本原则包括最惠国待遇和国民待遇，旨在降低关税壁垒、促进贸易自由化。它取代了此前的关税与贸易总协定，是国际贸易体系的支柱。","v":["WTO管什么","世界贸易组织作用","世贸组织职能"],"h":0},{"q":"PPT 母版的背景颜色设置时容易出错的地方有哪些？","a":"常见易错点：只改了某一张版式的背景，导致其他版式不一致；在普通视图逐页改背景而不是在母版中统一设置；背景色与文字颜色对比不足，投影时看不清；用图片或深色填充时未调整透明度，遮挡了占位符内容。","v":["PPT母版背景颜色设置有哪些常见错误","PPT母版设背景颜色容易踩哪些坑","设置PPT母版背景色常出错的地方有哪些"],"h":0},{"q":"公务员面试一般有哪几种形式，结构化面试是什么样？","a":"常见形式有结构化和无领导小组讨论，结构化面试是考生单独答题、考官按统一题目和评分标准打分，备考要练审题和表达。","v":["无领导小组讨论是什么形式","结构化面试是怎么回事","考公面试都有哪些形式"],"h":0},{"q":"退了某门课后还能补选吗？","a":"各校规定不同：一般在补退选阶段仍可重新选回该课程，但课程容量、先修条件等可能有限制；具体以本校教务处的选课通知为准。","v":["课退了还能再补选回来吗","退了的课可以重新补选不","退课之后还能补选吗"],"h":0},{"q":"什么是神经细胞？","a":"神经细胞（神经元）是神经系统的结构和功能基本单位，由细胞体和突起（树突、轴突）组成，能接受刺激、产生并传导兴奋，实现信息传递。","v":["神经信号传导","神经元是什么","神经细胞结构"],"h":0},{"q":"喝牛奶拉肚子怎么办？","a":"这多为乳糖不耐受。可选无乳糖牛奶、酸奶或奶酪，少量多次饮用并随餐吃，多数人可改善。若伴皮疹、喘息等过敏表现，应停食乳制品并就医。","v":["乳糖不耐怎么办","喝牛奶拉肚子是怎么回事","牛奶和酸奶哪个好"],"h":0},{"q":"续借图书需要什么条件？","a":"一般需在图书到期前主动办理续借，且账户无逾期欠费、该书未被他人预约、续借次数未超上限；可通过图书馆网站、自助机或服务台操作，与账户余额无关。","v":["图书续借要满足哪些条件","想续借书得符合啥条件","续借图书有什么要求"],"h":0},{"q":"复试时通常会准备些什么材料？","a":"考研复试一般需准备身份证、初试准考证、本科成绩单、学历学位证明（应届生提供学生证或学籍证明）、政治审查表，以及个人简历、科研与获奖等证明材料；部分院校要求外语水平证明或体检报告。推荐信、PPT等仅在个别院校或专业有要求，具体以报考院校的复试通知为准。","v":["复试一般要准备哪些材料","复试的时候通常都得备好哪些东西","考研复试通常准备什么材料"],"h":0},{"q":"误删文件后多久还能恢复数据？","a":"没有固定期限：文件还在回收站且未清空时随时可还原；已彻底删除的，能否恢复取决于原数据是否被新数据覆盖，应尽早停止写入并用恢复工具或备份找回。","v":["删掉的文件多长时间内可以找回","文件误删了多久之内还能恢复","误删文件后还能恢复的期限是多久"],"h":0},{"q":"怎么用地图学习地名？","a":"把地名标在地图上，观察其分布规律，如沿河、沿海、沿山分布；再结合地形、气候和历史上人口迁移理解命名原因。图文结合、由点到面，能系统掌握地名知识。","v":["地名学习方法","地图与地名","怎么学地名效率高"],"h":0},{"q":"餐饮信息时效性说明与核实建议","a":"食堂的营业时间、窗口设置、菜品价格和对外开放政策会随学期、节假日和经营方调整而变化，任何一份整理出来的信息都可能滞后。使用本类资料时，应把具体时间和价格视为参考值：需要精确信息时，优先查看食堂门口张贴的现场公告，其次查看学校后勤保障部门通过官方渠道发布的当期通知，再次可以拨打食堂公示的联系电话确认。寒暑假、法定节假日和开学初是变动最集中的时段，出行前最好先确认目标食堂是否正常营业。涉及校园卡、一卡通业务的问题，以一卡通服务中心的规定为准；涉及食品安全的问题，以现场反映和正式投诉渠道的处理结果为准。切勿仅凭网络转述判断，也不要传播未经核实的消息。整理类资料适合用来快速了解大致的营业规律、就餐动线和办事渠道，具体到某一餐吃什么、几点去，仍以现场情况为准。遇到明显与实际情况不符的信息，可以反馈给资料维护方，帮助后续更新。养成出门前看一眼公告、需要时打一个电话确认的习惯，能省下不少白跑的时间。","v":["以官方为准","信息更新","变动","寒暑假食堂窗口开放看什么通知？","怎么核实","时效性"],"h":0},{"q":"变压器为什么只能变交流？","a":"变压器靠电磁感应工作，原边交流电产生变化磁通，副边才能感应出电压。直流电产生恒定磁场，副边没有持续变化的磁通就不产生感应电压，且还可能使铁芯饱和、原边过流烧毁。因此变压器只能用于交流场合，直流变压要先逆变成交流。","v":["变压器为什么不能用直流","变压器工作原理","电磁感应条件"],"h":0},{"q":"忘记密码找回时需要什么信息和证明材料？","a":"一般通过注册时绑定的邮箱或手机号接收验证码即可重置，部分平台还会要求回答安全问题或提供账号相关信息；是否需要额外证明材料以具体平台的提示为准，通常不需要身份证号。","v":["密码忘了重置需要哪些材料","忘记密码找回得提供啥资料","找回密码要准备什么信息和证明"],"h":0},{"q":"制作校园卡申请流程的电子表格时，应该怎样设置数据透视表来汇总信息？","a":"先把申请记录整理成规范表格（首行为字段名，每行一条记录），选中数据后点击“插入—数据透视表”；将分类字段（如院系、申请状态）拖到“行”区域，将需统计的字段（如申请编号）拖到“值”区域并设为“计数”，即可按类别汇总。","v":["做校园卡申请的表格，透视表该怎么设置？","校园卡申请流程表怎么建透视表做统计？","校园卡申请记录表怎么用数据透视表汇总？"],"h":0},{"q":"精神科和心理咨询机构有什么区别？","a":"精神科是医学专科，医生可诊断精神障碍、开具药物、处理危急情况；心理咨询机构提供谈话辅导，不能开药。涉及疑似精神疾病、需要药物或出现安全风险时，应到正规医院精神科就诊，避免延误治疗。","v":["心理问题挂什么科","看精神科丢人吗","精神科和心理咨询区别"],"h":0},{"q":"实验课进实验室有什么规范和安全要求？","a":"进实验室之前必须完成安全培训和考核，着装上要穿实验服、长发束起、不穿凉鞋和拖鞋，禁止在实验室饮食。操作上不擅自改动仪器参数和管路，不独自做危险性实验，实验结束检查水、电、气、门窗。","v":["实验室安全培训怎么完成","实验课操作有哪些底线","实验课着装有什么要求"],"h":0},{"q":"校园网怎么自己测网速正不正常？","a":"可用学校提供的测速入口或通用测速网站，在网线直连或靠近路由处测更准，异常时再报修，以学校最新通知为准。","v":["怎么知道校园网快不快","校园网网速怎么测","网速慢怎么自己测一下"],"h":0},{"q":"遇到紧急情况需要快速补办丢失的校园卡怎么办？","a":"先通过学校提供的校园卡渠道（一卡通 App、公众号、自助终端或服务电话）挂失冻结，避免被盗刷；随后携带学生证或身份证到校园卡服务中心办理补卡手续，具体流程与工本费以本校规定为准。","v":["校园卡丢了急着补办怎么办","校园卡丢了要马上补办该咋做","紧急情况下校园卡丢失怎么快速补"],"h":0},{"q":"学生评教与教学意见反馈","a":"学生评教是教学质量监控的重要环节，通常在每个学期末通过教务系统开展，学生登录后对当学期所选课程的教师教学态度、教学内容、教学方法和教学效果等进行评价，也可以填写开放性意见和建议。评教一般要求在规定时间内完成，有的学院会在选课或者成绩查询环节设置前置条件，未完成评教的同学可能无法查看成绩或者参加下一轮选课，具体规则以本科生院通知为准。评教结果以统计形式反馈给教师和教学管理部门，用于改进教学，学生的个人信息不会直接透露给任课教师，可以如实填写。除评教之外，对课程安排、教材选用、实验条件有意见，也可以通过班级学习委员、学院教务员或者本科生院反馈。","v":["反馈","教学质量","期末评教在哪里做","没完成评教能查成绩吗","评教时可以提教学意见吗","问卷"],"h":0},{"q":"省考的网上报名和缴费时间是什么时候？","a":"各省省考的报名、缴费时间不统一，由各省当年招考公告确定；报考费标准也由各省自行规定，请以本省官方公告为准。","v":["省考什么时候报名什么时候缴费","省考报名和缴费一般啥时候","省考网上报名缴费时间在哪看"],"h":0},{"q":"电脑版的微信文件夹在哪里找不到我的聊天记录了？","a":"可在电脑版微信的“设置—文件管理”中查看聊天文件的实际保存路径（Windows 默认在“文档”下的 WeChat Files 文件夹）。聊天记录只保存在本机，若该文件夹被清理或换了电脑，记录不会自动同步，需要通过手机微信的“聊天记录迁移与备份”功能恢复。","v":["微信电脑版聊天文件存哪了找不到","电脑版微信文件夹在哪 聊天记录找不到了","电脑版微信的聊天记录文件夹找不到怎么办"],"h":0},{"q":"什么是装甲车和步兵战车？","a":"装甲车是带防护装甲的军用车辆统称，用于运输、侦察、指挥和作战。步兵战车是专为步兵乘车作战设计的装甲车辆，既有装甲保护和火力，又能运送步兵快速机动、下车战斗。它让步兵跟得上装甲部队的速度，是机械化战争的重要装备。","v":["步兵战车有什么用","装甲车和坦克区别","装甲车是什么"],"h":0},{"q":"使用邮件客户端时需要准备哪些软件和工具？","a":"需要一款支持 IMAP/POP3 和 SMTP 的邮件客户端（如 Outlook、Foxmail、Thunderbird 等），并准备好邮箱地址、密码或授权码，以及收发件服务器地址和端口等账户设置信息。","v":["发邮件用什么客户端和工具需要先准备啥","用邮件客户端前得备好哪些软件工具","邮件客户端要提前准备什么软件和工具"],"h":0},{"q":"雾凇是怎么形成的？","a":"严寒时空气中的过冷水滴碰到低于零度的树枝等物体直接冻结，形成白色松散的冰晶沉积物，称雾凇。它常见于寒冷潮湿的清晨，吉林松花江畔的雾凇是著名景观。","v":["哪里能看到雾凇","雾凇和霜区别","雾凇怎么形成"],"h":0},{"q":"在哪里可以找到打印机的使用指南和收费标准？","a":"一般可在图书馆服务台咨询，或在学校图书馆官网、校园网的服务指南中查询，具体位置以本校公布的信息为准。","v":["哪里能看到打印机指南和收费标准","打印机使用说明和收费价目去哪查","打印机怎么用、收多少钱在哪找"],"h":0},{"q":"如何防护放射性辐射？","a":"防护遵循三原则：缩短受照时间、增大与源的距离、在源与人之间加屏蔽。不同射线用不同材料，α用纸即可，β用铝板，γ需铅板或混凝土。佩戴剂量计监测累积剂量也很重要。","v":["γ射线怎么屏蔽","辐射剂量监测","辐射防护三原则"],"h":0},{"q":"怎样自助查询个人考试分数？","a":"通常可登录学校教务系统或学校指定的成绩查询平台，用学号和密码登录后在“成绩查询”栏目查看；具体渠道以学校通知为准。","v":["个人考试分数怎样自助查询","考试分数自己怎么查询","自己怎么查考试分数"],"h":0},{"q":"“我命由我不由天”，你怎么看？","a":"神回复是“闹钟响了还是起不来”。它用一句生活小事把豪言壮语直接拉回地面，靠宏大叙事与琐碎现实的落差制造笑点，属于典型的反鸡汤式回答。","v":["反鸡汤神回复","怎么看我命由我不由天","闹钟响了起不来"],"h":0},{"q":"邮箱签名里想加公司 logo 图片，怎么弄上去？","a":"在签名设置里点插入图片，上传 logo 后保存即可；部分邮箱需先开启富文本编辑，以官方最新说明为准。","v":["怎么在签名档放logo","邮件签名怎么插入公司图标","邮箱签名如何加图片"],"h":0},{"q":"安装 macOS 要注意哪些事项？","a":"先确认机型支持要安装的 macOS 版本，备份重要数据，预留足够磁盘空间并保持电源和网络稳定，通过 App Store 或“系统设置—软件更新”获取官方安装程序（macOS 安装器通常是 .app 或恢复模式安装，而非 .pkg）。","v":["macOS安装时需要注意什么","安装macOS有哪些地方要留意","装macOS之前要注意些什么"],"h":0},{"q":"iPhone 用户在哪儿可以备份 iCloud 数据？","a":"iCloud 备份在设备上自行操作：连接 Wi‑Fi 后进入“设置—顶部你的姓名—iCloud—iCloud 云备份”，开启并点击“立即备份”；也可用电脑上的 iTunes/访达做本地备份。无需前往门店或官网办理。","v":["iPhone 上咋备份 iCloud 数据啊","iPhone怎么把iCloud数据存下来","iPhone的iCloud数据在哪儿备份"],"h":0},{"q":"午餐哪个食堂开得最早？","a":"颐园二食堂 10:00 就开午餐；公一、公三、公四和颐三 10:30，颐一 10:40，公二 10:45。","v":["十点能吃上午饭吗","午饭最早几点","哪个食堂午餐开最早"],"h":0},{"q":"自助渠道可以查询携号转网进度吗？","a":"可以。一般可通过运营商官方网站、手机营业厅App等自助渠道查询携号转网办理进度；营业厅柜台和人工客服属于人工渠道，也可咨询。","v":["携号转网进度用自助渠道能查不","携号转网进度能自己在自助渠道查吗","自助渠道能查到携号转网办理到哪步了吗"],"h":0},{"q":"校园内有哪些自助渠道可以查询我的手机信息和账单详情？","a":"各校设施不同，无法确定具体自助终端位置。手机话费与账单一般可通过运营商官方App或网上营业厅查询；校园内是否有相关自助终端，建议咨询学校信息化服务部门或查看校园服务指南。","v":["学校有没有自助查话费账单的地方","手机上账单和手机信息在校园怎么自助查","校园里哪儿能自助查手机信息和账单"],"h":0},{"q":"社会流动带来的社会问题有哪些？","a":"大规模人口流动带来劳动力资源配置和城市发展的活力，也伴随挑战：流动人口的社会融入、户籍和公共服务差异、留守家庭问题、城市承载压力和身份认同困境。这些问题反映了制度安排与人口流动现实之间的张力。","v":["人口流动带来什么问题","农民工融入为什么难","流动人口面临什么困难"],"h":0},{"q":"PDF 文件不能正常打印成图片文件怎么办？","a":"打印和转图片是两回事，打印机没有“PDF 转 PNG”功能。要把 PDF 变成图片，可用 PDF 阅读器或转换工具导出/另存为 PNG、JPG。若是打印内容显示异常，可在 Adobe Acrobat 的打印高级设置中勾选“作为图像打印”后重试。","v":["PDF 打印出来不对劲想转成图片咋弄","PDF 文件没法正常打印成图片该咋办","怎么把 PDF 弄成图片而不是直接打印"],"h":0},{"q":"什么是季播剧的全季一次性放出？","a":"指把一季所有剧集同时在平台上线，观众可连续观看或一口气刷完，改变了传统每周追更的节奏，也影响讨论周期和续订评估方式，是流媒体时代的常见策略。","v":["为什么能刷整季","播出方式变化","整季一次性上线是什么"],"h":0},{"q":"什么是提示词？","a":"提示词（Prompt）是用户输入给AI的指令文本，用来告诉AI要做什么、以什么角色、按什么格式回答。提示词质量直接影响AI输出效果。","v":["prompt工程","怎么写提示词","提示词是什么"],"h":0},{"q":"长江为什么叫长江？","a":"长江古称江、大江，因绵延漫长，全长六千余公里，是中国第一大河，故称长江。长江之名始于六朝，意为长的江。它发源于青藏高原，流经十一省市，注入东海。","v":["长江古称","长江名字由来"],"h":0},{"q":"为什么日食比月食少见？","a":"日食时月球影子落在地球表面很小区域，只有处在影带内的人能看到；月食时半个地球都能同时看到月面进入地影。所以全球范围日食并不少，但对同一地点而言日食更罕见。","v":["日食为什么罕见","日食多久一次","月食为什么大家都看到"],"h":0},{"q":"四六级考试前需要背多少单词才能保证通过？","a":"没有“背够多少词就一定能通过”的标准。建议以四六级考试大纲词汇表为范围系统记忆，并结合真题在语境中巩固；能否通过还取决于听力、阅读、写作和翻译的整体水平。","v":["四六级考前单词要背多少才够过","四六级要背多少单词才能稳过","想过四六级得背多少单词"],"h":0},{"q":"电脑版微信如何备份聊天记录和文件消息？","a":"微信网页版不支持备份。需在电脑上安装并登录微信客户端，让手机和电脑连接同一 Wi-Fi，点击电脑微信左下角的菜单（更多）→“备份与恢复”→“备份聊天记录至电脑”，然后在手机上确认并选择要备份的聊天，等待传输完成。恢复时在同一入口选择“恢复聊天记录至手机”。","v":["微信电脑客户端咋备份聊天记录跟文件消息","用电脑微信怎么把聊天和文件备份下来","电脑版微信聊天记录和文件怎么备份"],"h":0},{"q":"雷达是怎么发现目标的？","a":"雷达发射电磁波，波遇到目标后部分反射回来被接收，通过测量发射与接收的时间差算出距离，通过天线指向确定方位，通过多普勒效应测速度。它不受光照和天气影响，能远距离探测，是军事探测和导航的核心技术之一。","v":["雷达为什么不受黑夜影响","雷达怎么探测目标","雷达测距原理"],"h":0},{"q":"考试迟到多久不能进考场？证件要放哪？","a":"考试一律按学校规定时间进行，迟到15分钟以上者不准入场，取消本次考试资格，该门课程按旷考论。学生应携带学生证或身份证，按座位号或监考教师要求就座，证件放在课桌右上角以便查验。","v":["考试时学生证放哪里","考试迟到15分钟还能进吗","进考场要带什么证件"],"h":0},{"q":"在哪里可以自助办理护照续签手续？","a":"护照没有“续签”，有效期届满需办理换发。可向公安机关出入境管理部门申请，部分地区支持网上预约或线上提交申请、自助设备取证，具体办理方式以当地出入境管理部门公布的信息为准。","v":["哪里可以自助办护照换发手续","护照换发自助办理去哪里","护照续签在哪能自助办"],"h":0},{"q":"整流电路的作用是什么？","a":"整流把交流电变成脉动直流电，利用二极管单向导电让负半周翻转或截去。半波整流只用一只二极管、效率低，全波整流用中心抽头变压器，桥式整流用四只二极管不需中心抽头且应用最广。整流后通常加滤波电容平滑纹波，再经稳压得到稳定直流。","v":["半波和全波整流区别","整流电路干什么用","桥式整流原理"],"h":0},{"q":"如何在线购买笔记本电脑并完成配置调整和售后服务申请？","a":"在电商平台或品牌官网搜索机型，在商品页面选好配置、套餐后加入购物车或直接下单，填写收货信息并付款；配置一般需在下单前选定，下单后要更改通常需联系客服或取消后重新下单。售后可在平台或品牌的客服/售后入口提交申请，按指引提供订单号、发票及故障凭证。","v":["在线买笔记本电脑配置怎么改售后怎么弄","网上买笔记本怎么选配置又怎么申请售后","网购笔记本怎么调配置和走售后申请"],"h":0},{"q":"主卡和副卡共享套餐，副卡用超了流量算谁的？","a":"主副卡通常共享套餐内流量，副卡超用会一起计入主卡账户，按套餐外资费扣主卡；具体规则以运营商最新说明为准。","v":["主副卡共享流量超了算谁的","副卡用超流量扣谁的钱","副卡超流量会影响主卡吗"],"h":0},{"q":"遥知兄弟登高处遍插茱萸少一人是什么意思？","a":"出自王维《九月九日忆山东兄弟》。诗人想象重阳节家乡兄弟登高、人人插茱萸，唯独少了他自己。不直说自己想家，而从对方落笔，含蓄深切地表达思念。","v":["王维思乡手法","遍插茱萸少一人出处","遥知兄弟登高处什么意思"],"h":0},{"q":"电场强度和电势有什么区别？","a":"电场强度是描述电场力的性质的矢量，等于单位正电荷受力；电势是描述电场能的性质的标量，等于单位正电荷的电势能。前者有方向、后者无方向，二者通过电场是电势的负梯度联系。","v":["场强与电势关系","电势是什么","电场强度与电势区别"],"h":0},{"q":"如何进行双重验证设置？","a":"在账号的安全设置中找到“双重验证/两步验证”，选择短信验证码或验证器App等方式，按提示绑定并输入验证码确认，同时保存好备用恢复码。具体入口以所用平台的说明为准。","v":["双重验证在哪里设置","怎么开通双重验证","账号双重验证具体怎么弄"],"h":0},{"q":"如何备份微信聊天记录到电脑上？","a":"在电脑上登录微信电脑版，点击左下角菜单进入「备份与恢复」，选择「备份聊天记录至电脑」；手机与电脑连接同一 Wi-Fi，在手机微信上确认并选择要备份的聊天，等待传输完成。恢复时用同一功能中的「恢复聊天记录至手机」。","v":["微信记录备份到电脑具体怎么操作","怎样把微信聊天记录存到电脑"],"h":0},{"q":"什么是沉没成本？","a":"沉没成本是已经发生、无法收回的投入（时间、金钱）。理性决策不应考虑沉没成本，而应关注未来的收益与成本，'来都来了'是典型误区。","v":["为什么不要太较真","沉没成本是什么","沉没成本谬误"],"h":0},{"q":"如何连接到学校的免费 WiFi 信号？","a":"在校园覆盖区域内搜索并连接学校官方 WiFi 名称，按提示用校园账号完成认证即可；具体网络名称和认证方式请咨询学校网络中心，不是通过手机热点连接。","v":["咋连接学校的免费WiFi信号","学校那个免费WiFi咋连啊","校园免费WiFi信号怎么连"],"h":0},{"q":"加入新的微信群，需要走什么流程？","a":"加入微信群通常有两种方式：由群内成员邀请你加入，你确认同意即可；或扫描该群的二维码申请加入（人数较多时可能需要群主或管理员确认）。微信群没有“输入群名称和密码”加入的方式，点右上角加号是发起新群聊。","v":["加入微信群一般需要什么步骤","想加进一个新微信群要走啥流程","新微信群怎么加进去流程是啥"],"h":0},{"q":"头戴珊瑚帽身穿梅花袄打一动物","a":"答案是梅花鹿。鹿角分叉像珊瑚，身上的白色斑点在褐色皮毛上酷似梅花。它把角与皮毛分别比作帽子和花袄，是动物谜语中画面最漂亮的一则。","v":["头戴珊瑚帽是什么动物","梅花鹿谜语","身穿梅花袄打一动物"],"h":0},{"q":"丢失的校园卡片需要几天后才能重新申请新卡吗？","a":"各校规定不同：一般需先办理挂失，再持本人证件到卡务中心或指定网点补办，有的学校可当天办好，有的需等待数个工作日，具体以本校规定为准。","v":["校园卡丢了要等几天才能补新卡","校园卡片丢了多久后能重新申请","补办校园卡片得隔几天才能申请"],"h":0},{"q":"三方协议什么时候签订？","a":"三方协议（就业协议书）一般在毕业生与用人单位达成就业意向后、毕业离校前签订，由毕业生、用人单位、学校三方签字盖章，与实习开始时间无关。","v":["三方协议一般什么时候签","三方协议啥时候签合适","三方协议该在什么时间签"],"h":0},{"q":"学生去威海旅游需要带哪些证件？","a":"国内旅游一般只需带身份证（未办身份证的未成年人可带户口簿）；学生可另带学生证，用于购买景区、交通的学生优惠票。老年证、驾驶证/行驶证、护照等通常不需要。","v":["去威海旅游学生得带哪些证？","学生党去威海玩证件带啥？","学生去威海玩要带什么证件？"],"h":0},{"q":"遇到可疑贷款信息时，应该怎样处理校园贷风险？","a":"不要轻信陌生贷款广告，不点击不明链接，不向对方提供身份证、学籍、银行卡号及验证码等信息，也不要先交所谓手续费、保证金。确有资金需求应通过正规金融机构办理；若已陷入高息或暴力催收，及时告知家长、老师并报警。","v":["收到可疑贷款消息该怎么处理风险","校园贷有风险遇到可疑贷款信息怎么办","碰到可疑贷款信息校园贷风险咋防范"],"h":0},{"q":"需要截图时如何快速启动截屏工具？","a":"Windows 按 Win+Shift+S 调出截图工具；macOS 按 Shift+Command+4 截取选区，或 Shift+Command+5 打开截屏工具栏。","v":["怎样快速调出截屏功能","想截图的话快捷键是啥","截图工具怎么快速打开"],"h":0},{"q":"为什么要节约能源？","a":"节约能源能减少化石燃料消耗和温室气体排放、降低环境污染、减少对进口能源的依赖并节省开支。节能既包括技术层面提高能效，也包括行为层面改变浪费习惯。它是最直接、成本最低的减排方式之一。","v":["为什么要节能","怎么在日常中节能","节能有什么好处"],"h":0},{"q":"火星为什么是红色的？","a":"火星表面土壤富含氧化铁，也就是铁锈，使整个星球呈现红色外观。火星有稀薄大气、极地冰盖和古老河床痕迹，是寻找地外生命和人类探测的重点目标。","v":["火星为什么发红","火星有水的痕迹吗","火星表面成分"],"h":0},{"q":"什么是加密货币？","a":"加密货币是基于密码学和区块链技术的数字货币，如比特币和以太坊。它去中心化、全球交易、供给由算法决定，价格波动极大，监管政策不明。它不属于任何国家法定货币，投资风险很高。","v":["加密货币是什么","加密货币风险","数字货币和法定货币区别"],"h":0},{"q":"多久换一次机油？","a":"视机油类型和车辆使用情况：矿物油约5000公里或半年，全合成机油可1万公里或一年，以先到为准。经常短途、拥堵或 多尘路况应缩短周期。以车辆保养手册为准。","v":["全合成机油能跑多少公里","机油多久换一次","汽车多久换机油"],"h":0},{"q":"冬练三九夏练伏天合适吗？","a":"这句俗语鼓励人坚持锻炼、不畏寒暑。适度运动确实有益，但极端天气下要量力而行：三九天注意保暖防感冒，伏天避开高温时段防中暑。坚持不等于硬扛，安全前提下锻炼才有意义。","v":["冬天锻炼注意什么","冬练三九夏练伏天什么意思","夏天运动防暑"],"h":0},{"q":"什么是计算机视觉？","a":"计算机视觉是让机器理解和处理图像、视频的AI领域，包括图像分类、目标检测、人脸识别、图像生成等任务。","v":["CV应用","人脸识别原理","计算机视觉是什么"],"h":0},{"q":"第一次养猫要准备什么？","a":"基础装备包括猫砂盆与猫砂、猫粮和食碗水碗、猫抓板、航空箱或猫包、梳子和指甲剪。家里要做好封窗、收好危险物品和线状物。接猫回家后先让它在安静的小空间适应，备好隐蔽处。此外要尽快安排体检、疫苗和驱虫，并了解附近有哪家宠物医院。","v":["养猫需要买什么","接猫回家准备什么","新手养猫注意什么"],"h":0},{"q":"三方协议签订后还能再换工作吗？","a":"可以。需先与原签约单位协商解除协议，按协议约定可能承担违约责任，取得解约函后到学校就业部门办理改签手续，再与新单位签约。","v":["三方协议签完想换单位可以吗","三方签了之后还能重新找工作吗","签了三方协议还能不能换工作"],"h":0},{"q":"去心理咨询会不会被记进档案或者告诉辅导员？","a":"咨询内容通常按保密原则处理，除涉及安全风险等特殊情况外不会随意告知他人；具体保密范围和例外情形以学校最新通知为准。","v":["咨询的事会被告诉老师吗","心理中心会泄露隐私吗","心理咨询内容会保密吗"],"h":0},{"q":"使用PPT母版时是否可以修改字体样式和颜色？","a":"可以。在“视图—幻灯片母版”中可统一修改字体、字号和颜色，关闭母版视图后会应用到使用相应版式的幻灯片。","v":["PPT母版能不能改字体样式跟颜色","PPT母版里能改字体和颜色吗","用PPT母版可以调整字体样式和颜色不"],"h":0},{"q":"想申请调宿舍或者换寝室，流程是啥？","a":"先向学院辅导员说明原因并提交调宿申请，由学院和宿舍管理部门按流程审批；具体条件和办理入口以学校最新通知为准。","v":["宿舍调整流程是啥","换宿舍要找谁办","调寝室怎么申请"],"h":0},{"q":"扫描时经常出现黑边怎么办？","a":"黑边多因扫描区域大于原稿尺寸或原稿未放正造成，与分辨率无关。请把原稿贴齐稿台的定位标记，在扫描设置中选择与原稿一致的尺寸（或开启自动检测尺寸/自动裁切），并合上盖板后重新扫描。","v":["扫描出来老是有黑边该怎么处理","扫描时总有黑边怎么解决","扫描经常出现黑边要怎么办"],"h":0},{"q":"如何在线办理居住证？","a":"部分地区支持网上办理：登录当地政务服务平台或官方政务APP，搜索“居住证”，按提示填写信息并提交材料。具体入口及能否全程网办以当地规定为准。","v":["居住证线上办理走什么流程？","居住证能在网上办吗？","网上申请居住证要怎么操作？"],"h":0},{"q":"校园网账号能不能自己注册，还是得去线下办？","a":"一般需要先通过学校统一的网络服务入口提交开通申请，部分情况需本人到指定服务点核验；具体注册方式和所需材料以学校最新通知为准。","v":["校园网开通必须去线下吗","校园网账号怎么申请开通","校园网账号能自己注册吗"],"h":0},{"q":"Word 文档中如何添加页眉和页脚？","a":"在 Word 中切换到“插入”选项卡，点击“页眉”或“页脚”并选择样式后输入内容；也可直接双击页面顶部或底部的空白区域进入编辑，完成后点击“关闭页眉和页脚”。","v":["Word文档咋设置页眉和页脚","Word文档页眉页脚怎么弄啊","在Word中怎么插入页眉页脚"],"h":0},{"q":"职业资格证书取消了怎么办？","a":"近年国家分批取消和调整了一批职业资格许可和认定事项，目的是降低就业门槛。被取消的证书不再作为从业硬性要求，但已取得的证书仍可作为能力证明。判断一个证书是否值得考，要看它是否仍在国家职业资格目录内以及用人单位的实际认可度。","v":["取消的证书还有用吗","怎么看证书是否被取消","职业资格目录在哪查"],"h":0},{"q":"复试一般什么时候开始准备，通常有哪些内容考察？","a":"考研复试建议初试结束后就着手准备，复试由各招生院校自行安排，通常在初试成绩公布后进行，具体时间以院校通知为准。考察内容一般包括专业课笔试或面试、英语听力与口语、综合素质及科研经历面试等。","v":["复试一般考哪些内容","复试啥时候开始准备比较好","考研复试要准备什么内容什么时候开始"],"h":0},{"q":"选调生需要具备什么条件才能报名？","a":"各省要求不同，一般面向应届毕业生，通常要求中共党员（含预备党员）、有学生干部经历、成绩优良，并符合年龄、学历等条件，具体以当年招录公告为准。","v":["想考选调生得符合什么要求","报选调生要满足哪些条件","选调生报名需要什么资格"],"h":0},{"q":"HTTPS的证书是什么？","a":"SSL/TLS证书是证明网站身份并建立加密连接的数字凭证，由可信机构颁发。浏览器显示小锁图标表示证书有效，连接被加密。","v":["https小锁什么意思","证书是什么","证书过期怎么办"],"h":0},{"q":"数据库的页和操作系统页大小不一致会怎样？","a":"数据库按自己的页大小组织数据，操作系统按内存页做交换。两者大小不匹配会导致读写放大，一次数据库页访问可能触发多次系统页操作，缓存对齐也会变差。多数数据库允许配置页大小，创建表空间的早期就要结合业务记录长度和硬件特性确定，后期修改成本高，需要重建存储结构，所以初始规划很重要。","v":["数据库页大小和系统页关系","页大小能改吗","页大小设置不当影响"],"h":0},{"q":"在创建新分支前需要做什么准备？","a":"先拉取目标分支（如 main/develop）的最新代码，确认本地未提交的改动已提交或 stash，再基于最新代码创建分支，并按团队规范命名。","v":["创建新分支之前要做什么准备","建新分支前需要准备哪些事","开新分支前该先做哪些准备"],"h":0},{"q":"寄件时有没有包邮的优惠活动？","a":"个人寄件一般没有“包邮”，包邮通常指商家承担运费。部分快递或寄件平台会发放优惠券、折扣或满减活动，具体以官方App、小程序或客服公布的信息为准。","v":["个人寄件能包邮不有啥优惠","寄东西有没有免邮的优惠","寄快递有包邮活动吗"],"h":0},{"q":"PDF文件如何在校园网内快速扫描上传到云端存储？","a":"PDF 本身已是电子文件，无需扫描：在校园网内登录所用网盘（云存储）的网页版或客户端，选择“上传文件”并选中该 PDF 即可。若原件是纸质材料，可先用扫描仪或手机扫描类 App 生成 PDF，再上传到网盘。","v":["手头有PDF文件，在校园网内咋上传到云端存储啊","校园网里怎么把PDF快速传到云盘上","纸质材料扫成PDF后怎么在校园网上传到网盘"],"h":0},{"q":"四六级考试的听力材料会提前多久公布？","a":"四六级听力试题属于考试内容，不会提前公布。可在考试结束后关注官方或正规出版物发布的真题及听力音频用于复习。","v":["四六级听力材料什么时候公布","四六级听力材料提前多久会公布","四六级听力试题会提前公布吗"],"h":0},{"q":"退货包裹应该送到哪里？","a":"一般按商家或平台在退货申请中提供的退货地址寄回，可通过原快递渠道或指定网点交寄，具体以退货页面提示为准。","v":["退回去的包裹应该送到哪儿","退货包裹寄到哪里才对","退货的包裹要寄到哪个地址"],"h":0},{"q":"过氧化氢为什么既有氧化性又有还原性？","a":"过氧化氢中氧的氧化数为负一，处于氧的零价与负二价之间，遇到强还原剂可被还原为水表现氧化性，遇到强氧化剂如高锰酸钾可被氧化为氧气表现还原性。它不稳定，受热、光照或遇催化剂易歧化分解，因此需避光低温保存。","v":["H2O2保存条件","双氧水氧化性还原性","过氧化氢为何不稳定"],"h":0},{"q":"为什么反例能推翻猜想？","a":"数学命题要求对所有情况成立，只要找到一个满足前提却违背结论的例子，就足以否定整个命题。因此反例在数学中力量极强，一个反例的证明成本远低于证明或否定一个普遍命题。","v":["一个反例够吗","反例为什么有效","反例在数学中的作用"],"h":0},{"q":"考试作弊被认定后一般给什么处分？","a":"考试违规按情节分档处理：携带规定以外物品未放指定位置、提前答题或结束后继续答题等给予警告以上处分；旁窥、交头接耳、带答卷出考场等给予严重警告以上；夹带、抄袭、答卷雷同给予记过以上；替考、组织作弊、使用通讯设备作弊等给予留校察看以上。","v":["替考会被留校察看吗","考场交头接耳怎么处理","考试夹带资料算哪档处分"],"h":0},{"q":"如何设置微信不自动保存群聊消息？","a":"微信没有“不保存群聊消息”的开关。可在“我→设置→通用→照片、视频、文件和通话”中关闭自动下载，避免群里的图片视频自动保存；不想保留消息可在聊天列表长按该群删除聊天，或在群聊右上角“…”中选择清空聊天记录。","v":["微信怎么关掉群聊消息自动保存","微信能设置群消息不自动保存吗","怎样让微信不自动保存群里的消息"],"h":0},{"q":"什么是笔势和气韵？","a":"笔势指笔画之间的呼应和运动趋向，让字与字、行与行气脉贯通；气韵是作品整体的精神气息和韵律感。有势则生动不散，有韵则耐看不俗。二者是书法从技法上升到艺术境界的重要标志。","v":["书法怎么有气势","气韵生动什么意思","笔势是什么"],"h":0},{"q":"需要准备哪些材料来办理挂失手续呢？","a":"一般需本人携带有效身份证件（如身份证、学生证）到发卡或服务网点填写挂失申请表办理；卡已丢失时无需携带原卡，具体材料以发卡单位要求为准。","v":["办挂失要准备什么材料","去办挂失得拿什么材料","挂失手续需要带哪些东西"],"h":0},{"q":"什么是运动中的'极点'和'第二次呼吸'？","a":"极点是剧烈运动初期出现的胸闷、腿沉、想停下，因内脏惯性跟不上运动需要；坚持并调整呼吸后症状缓解、进入稳定状态，即第二次呼吸。充分热身可减轻极点。","v":["怎么度过极点","极点是什么","第二次呼吸什么感觉"],"h":0},{"q":"创建一个 SQLite 数据库需要哪些步骤和工具？","a":"工具：sqlite3 命令行工具，或编程语言自带的驱动（如 Python 内置 sqlite3 模块）。步骤：确认工具/驱动可用 → 连接指定的数据库文件名（文件不存在时会新建）→ 用 CREATE TABLE 建表 → 执行增删改查 → 提交并关闭连接。","v":["SQLite 数据库怎么创建需要啥工具","创建 SQLite 数据库需要哪些步骤和工具","建一个 SQLite 数据库要用什么工具和步骤"],"h":0},{"q":"什么是早期经验对发展的影响？","a":"早期经验尤其是婴幼儿期的照顾质量，对依恋形成、情绪调节和认知发展有重要影响。丰富的刺激、稳定的照顾和安全的环境促进发展，长期忽视或创伤可能带来持久影响。但发展具有可塑性，后期积极的干预和关系仍能改善早期的不利影响。","v":["早期创伤能修复吗","早期教育重要吗","童年经历影响一生吗"],"h":0},{"q":"Mac 上怎么把截图直接存到剪贴板而不是桌面？","a":"按 Control+Shift+Command+4 框选区域，截图会直接进剪贴板，再到需要的地方粘贴即可。","v":["Mac 截图怎么直接复制不存文件","Mac 截图怎样直接粘贴","苹果电脑截图怎么放进剪贴板"],"h":0},{"q":"校园卡除了吃饭还能在哪些地方用？","a":"校园卡通常可用于食堂消费、图书馆借阅、门禁通行、洗浴和校内缴费等场景，具体适用范围以学校最新通知为准。","v":["校园卡有哪些功能","校园卡都能干嘛用","校园卡除了吃饭还能刷啥"],"h":0},{"q":"活动场地需要多久才能审批完成，一般有哪些常见的审核标准？","a":"审批时长没有统一标准，取决于具体单位（学校/场馆）的规定和申请情况，需向场地管理部门确认。常见审核标准包括：活动内容与用途是否合规、场地安全与消防条件、是否与已有安排冲突、是否落实责任人与应急预案等。","v":["场地审批通常看哪些标准要几天","活动场地审批一般要等多久","申请活动场地多久能批下来有啥要求"],"h":0},{"q":"申请语言成绩时，TOEFL 和 IELTS 的区别是什么？","a":"两者都考查听、说、读、写四项英语能力，也都可用于留学申请。主要区别在形式与评分：托福为机考，口语对着电脑录音，总分120分；雅思口语与考官面对面交流，成绩按1—9分的等级评定。具体认可哪种考试需看目标院校要求。","v":["TOEFL 和 IELTS 有啥不一样","TOEFL 跟 IELTS 的区别是什么","申请时 TOEFL 与 IELTS 区别在哪"],"h":0},{"q":"如何在我的电脑上备份微信群聊里的信息到云端？","a":"微信官方没有提供聊天记录的云端备份。电脑版微信的“备份与恢复”功能只能把手机上的聊天记录备份到电脑本地（需手机与电脑连同一网络并在手机上确认）。若想存到云端，可在备份完成后自行把电脑上的备份文件夹上传到网盘。","v":["微信群聊信息在电脑上怎样备份到云端","怎么把电脑上微信群聊信息备份到云端","电脑上微信群聊记录如何备份到云端"],"h":0},{"q":"如何办理自行车借还手续？","a":"各校自行车借用/归还的办理方式不同，需按学校公布的规定办理，建议咨询学校后勤或相关管理部门确认具体流程和所需证件。","v":["怎么办理自行车的借用和归还","自行车借还手续怎么办","自行车借还要走什么手续"],"h":0},{"q":"误删短信会怎样处理，还能找回来吗？","a":"能不能找回主要取决于有没有备份：若之前做过云备份（如 iCloud、厂商云服务）或本地备份，可从备份中恢复短信；部分机型的短信应用有“最近删除/回收站”可短期找回。完全没有备份时通常很难恢复，第三方恢复工具成功率有限且有风险。建议之后开启短信的自动云备份。","v":["不小心删了短信怎么处理能恢复吗","短信误删了还能找回来吗","误删短信有办法找回吗"],"h":0},{"q":"如何为 Word 演讲稿创建目录，并与内容同步更新？","a":"先给各级标题应用“标题1/标题2”等大纲级别样式，再把光标放在要插入目录的位置，点击“引用—目录”选择自动目录。内容改动后，点击目录并选择“更新目录”（或按 F9），可选择只更新页码或更新整个目录；Ctrl+单击目录项只是跳转到对应标题，自动更正与目录更新无关。","v":["Word演讲稿的目录咋弄才能随内容更新","Word演讲稿目录怎么建还能跟内容一起更新","怎么给Word演讲稿做目录并保持同步更新"],"h":0},{"q":"现象学的核心观点是什么？","a":"现象学由胡塞尔创立，主张回到事物本身，通过悬搁对外部世界的自然态度，直接研究意识经验中被给予的现象。它强调意向性，即意识总是指向某物，为后来的存在主义和解释学提供了方法基础。","v":["回到事物本身","现象学是什么","胡塞尔核心思想"],"h":0},{"q":"自由基取代反应是怎么进行的？","a":"在光照或高温下卤素分子均裂产生自由基，经历链引发、链增长和链终止三个阶段。氯自由基夺取烷烃氢生成烷基自由基，后者再与卤素分子反应生成卤代烷并再生自由基。反应一旦引发便自发进行，直到自由基相互结合而终止。","v":["烷烃卤代步骤","自由基取代机理","链引发链终止"],"h":0},{"q":"江西为什么叫江西？","a":"江西之名源于唐代江南西道，简称江西，因在江南道之西得名。此前属豫章、吴越之地。宋代设江南西路，元代设江西行省。江西简称赣，因赣江为最大河流。","v":["江西名字由来","江西简称赣"],"h":0},{"q":"四六级报名时间是什么时候，怎么知道自己的年级是否能报四六级了？","a":"四六级每年上下半年各考一次，报名一般分别在春季和秋季进行，四级和六级的报名时间段基本相同，并非按月份区分四级、六级；具体报名时间及本年级能否报考，以学校教务处通知和全国大学英语四六级考试官网公告为准。","v":["四六级啥时候报名，怎么查自己年级能不能报","四六级报名时间在哪看，我这年级能报吗","怎么知道四六级报名时间和我能不能报"],"h":0},{"q":"如何去除水壶里的水垢？","a":"白醋加水（或柠檬酸）倒入水壶浸泡加热后静置，水垢会溶解，再用清水冲洗。硬水地区水垢多，定期除垢可延长电器寿命。","v":["怎么去水垢","水垢有害吗","水壶水垢怎么清除"],"h":0},{"q":"补考和重修有什么区别，哪个更容易通过？","a":"补考是课程考核不及格后给的一次重新考试机会，通常安排在下一学期初，成绩多按及格记载；重修是重新选修该课程、跟班学习并参加考核，成绩按实际得分记载。补考只需自行复习，投入少但机会有限；重修有系统教学和平时成绩，通过把握通常更大，但耗时较多。具体以本校教务规定为准。","v":["补考没过还能重修吗","补考没过怎么办？","补考和重修有啥不一样哪个好过","补考跟重修区别在哪哪个容易过","重修和补考哪个通过率高一些"],"h":0},{"q":"选课费用是多少呢？","a":"选课本身一般不单独收费，费用通常按学分或学期计入学费；具体标准请以本校教务处或财务处的收费说明为准。","v":["选课收费是多少","选课的费用大概多少","选课要交多少钱"],"h":0},{"q":"苯为什么易取代难加成？","a":"苯环的六个π电子高度离域，整体能量很低，若发生加成会破坏芳香性，需要付出很大能量；取代反应只在环上替换氢，反应后芳香体系得以保留，因此苯主要发生亲电取代反应，如卤代、硝化、磺化、傅克烷基化和酰基化。","v":["芳香稳定性影响反应","苯为什么难加成","苯容易发生什么反应"],"h":0},{"q":"家丑不可外扬是什么意思？","a":"指家中的矛盾和丑事不要往外传，免得被人看笑话。它反映传统社会看重家庭颜面的观念。现代理解中要分辨：隐瞒琐事可维护关系，但涉及违法或伤害时，该求助外界就不能一味遮掩。","v":["家丑不可外扬什么意思","家丑该不该外扬","面子与正义"],"h":0},{"q":"如何在我的Mac上创建一个新的截图文件夹并添加快捷方式到Dock？","a":"在 Finder 中新建一个文件夹（例如命名为 Screenshots），然后把该文件夹拖到 Dock 分隔线右侧（靠近废纸篓的一侧）即可生成快捷方式。若希望截图默认存入该文件夹，可按 Command+Shift+5 打开截图工具，在“选项—存储到”中选择这个文件夹。","v":["Mac上怎么新建截图文件夹再放到Dock上","Mac怎么创建截图文件夹并弄个Dock快捷方式","在Mac建个截图文件夹并加Dock快捷方式怎么做"],"h":0},{"q":"为什么矿泉水含有矿物质？","a":"矿泉水是地下水经岩层过滤溶滤，溶解了钙镁钾等矿物质和微量元素，因此含有多种离子。这些矿物质对人体有一定补充作用，但主要来源仍是均衡饮食，不能夸大矿泉水功效。","v":["矿泉水为什么有矿物质","矿泉水健康作用","矿物质来源"],"h":0},{"q":"重结晶提纯的原理是什么？","a":"利用目标物与杂质在溶剂中溶解度随温度变化幅度不同：高温时都溶解，降温时目标物因溶解度下降明显而析出晶体，杂质大多留在母液。选择溶剂要求目标物热溶冷不溶、杂质要么全溶要么不溶，且不与被提纯物反应。操作包括溶解、热过滤、冷却结晶和抽滤洗涤。","v":["重结晶原理","重结晶操作步骤","重结晶溶剂怎么选"],"h":0},{"q":"植物会'睡觉'吗？","a":"有些植物有睡眠运动：如含羞草叶片夜间合拢，睡莲花朵昼开夜合。这是对光照、温度变化的适应，由生物钟和生理机制调控。","v":["含羞草会睡觉吗","植物感应"],"h":0},{"q":"什么是后现代主义建筑？","a":"后现代主义建筑在二十世纪后期兴起，反对现代主义的单调和功能至上，重新引入历史符号、装饰和色彩，强调建筑的隐喻性与多元风格。文丘里是其理论代表。它反映了当代文化中对多样性和个性化的追求。","v":["后现代和现代建筑区别","后现代建筑是什么","建筑为什么要装饰"],"h":0},{"q":"怎样自助查询个人的校园网使用流量情况？","a":"一般可登录本校的校园网自助服务系统（或校园网认证客户端、网络信息中心网站），在个人信息/流量统计页面查看已用流量；具体入口和名称以本校网络中心公布的为准。","v":["咋自助看校园网流量用了多少","校园网流量在哪能自助查询","自己怎么查校园网用了多少流量"],"h":0},{"q":"什么是固体废物？","a":"固体废物指在生产生活中被丢弃的固态或半固态物质，按来源分为生活垃圾、工业固废、危险废物和建筑垃圾等。它若不加处理会占用土地、污染土壤和地下水、散发异味。管理遵循减量化、资源化和无害化原则。","v":["固体废物有哪些","固废怎么处理","固废是什么"],"h":0},{"q":"面包板搭电路有哪些注意？","a":"面包板内部横向五孔相通、竖向不相通，中间凹槽两侧的电源轨通常整条连通。插元件时引脚要插到底避免虚接，跳线尽量短并贴板，电源极性务必核对。它适合临时验证但接触电阻较大、不适合大电流和高频，正式电路应焊接到电路板上。","v":["面包板孔怎么连通","面包板怎么接线","面包板适合什么电路"],"h":0},{"q":"报名国考时是否需要提前准备所有材料？","a":"报名时主要在线填写个人信息、上传照片并选择职位，不必一次性备齐所有材料；身份证、学历学位证书等一般在面试前资格复审时提交，具体以当年招考公告为准。","v":["国考报名时材料要一次性准备齐全吗","国考报名要提前把所有材料都备齐吗","报名国考需不需要事先准备好全部材料"],"h":0},{"q":"游泳有哪些好处？","a":"游泳是全身性有氧运动，能增强心肺功能、锻炼全身肌肉、对关节冲击小（适合伤后康复）、帮助控制体重。也是重要的生存技能。","v":["游泳减肥吗","游泳注意事项","游泳的好处"],"h":0},{"q":"英语里怎么判断一个句子是不是被动语态？","a":"看主语是不是动作的承受者，结构通常是be加过去分词；如果不确定，就试着把动作发出者加回去，能加by且意思通顺一般就是被动。","v":["怎么看出句子是被动语态","英语被动句怎么辨认","被动语态有什么明显标志"],"h":0},{"q":"硬连线控制器和微程序控制器有何不同？","a":"硬连线控制器用组合逻辑电路直接产生控制信号，速度快但线路复杂、修改困难，适合指令简单的处理器；微程序控制器把每条指令拆成若干微指令存放在控制存储器中，设计规整、易于修改和扩展，但多一步查表所以速度略慢。现代复杂处理器多采用微程序思想。","v":["两种控制器区别","微程序控制器原理","硬连线控制优点"],"h":0},{"q":"买基金有哪些费用？","a":"场外基金费用包括申购费、赎回费、管理费、托管费和销售服务费；场内ETF主要是交易佣金和管理费。频繁申赎会产生高额费用，长期持有通常更划算。指数基金费用普遍低于主动基金。","v":["场内场外基金费用区别","基金手续费有哪些","基金赎回费怎么算"],"h":0},{"q":"干涉测量为什么能提高分辨率？","a":"把多台望远镜同时观测同一天体，利用信号到达时间差合成，等效口径相当于望远镜间最大距离，分辨率大幅提升。事件视界望远镜用全球台站组成地球尺度阵列，拍到了黑洞影像。","v":["多台望远镜为什么更清楚","干涉测量原理"],"h":0},{"q":"抢到心仪的课程名额有概率吗，如果没赶上怎么办？","a":"部分热门课程会优先满足大一学生需求，在选课截止前几分钟可能会出现秒空现象；未能成功选上可留意后续补报机会。","v":["抢到心仪课程名额有概率吗没抢到咋办","热门课程名额靠运气吗没赶上怎么办","选课没抢到心仪名额还有啥办法"],"h":0},{"q":"如果忘记了绑定的电话号码怎么处理？","a":"携带身份证或学生证到校园卡服务中心（或联系其客服）核验身份，查询并更换绑定的手机号，之后再重新获取验证码。","v":["不记得绑定手机号了怎么处理","忘记绑定的电话号码怎么解决","绑定手机号忘了咋办"],"h":0},{"q":"海沟是怎么形成的？","a":"海洋板块与大陆板块汇聚时，密度较大的海洋板块俯冲到另一板块之下，在边界处形成深海沟。马里亚纳海沟是最深的例子，俯冲带常伴地震和火山弧。","v":["俯冲带有什么现象","马里亚纳海沟多深"],"h":0},{"q":"使用什么客户端能安全接收学校的电子邮件？","a":"优先使用学校信息化部门推荐的邮件客户端（如 Outlook、Foxmail、Thunderbird），从官方渠道下载，并按学校给出的参数配置 SSL/TLS 加密的 IMAP/SMTP 收发。","v":["哪个客户端接收学校电子邮件靠谱又安全","学校邮箱用什么邮件客户端接收才安全","收学校邮件用哪个客户端比较安全"],"h":0},{"q":"校园里突发身体不适该找谁帮忙？","a":"立即拨打校医院急救电话或联系辅导员、宿舍管理员，情况紧急时直接拨打120；求助电话和流程以学校最新通知为准。","v":["在学校突然不舒服怎么办","校内急救找谁","身体不舒服打哪个电话"],"h":0},{"q":"大学如何平衡学习和社团活动？","a":"建议以学业为底线，把主要精力放在专业课上，社团活动选择一到两个真正感兴趣的深入参与。学会用日程表管理时间，考试周主动减少活动投入。社团经历能锻炼沟通和组织能力，但如果挤占学习时间导致挂科，就得不偿失了。","v":["大学时间怎么分配","大学要参加社团吗","社团影响学习怎么办"],"h":0},{"q":"篆刻和书法有什么关系？","a":"篆刻以篆书入印，印文的书法性决定作品格调，所谓篆刻先篆后刻。书法功底好的篆刻家，印文线条更有笔意。二者同源共流，都讲究用笔、结构和气韵，被称为姊妹艺术。","v":["为什么篆刻要懂篆书","篆刻先篆后刻","篆刻和书法关系"],"h":0},{"q":"动画效果何时添加到演示文稿中，以确保在最后放映时流畅无卡顿？","a":"建议在内容与排版定稿后再统一添加动画，尽量使用简单效果并控制数量；添加后用预览和“排练计时”检查各动画的衔接与时长，放映前再整体试放一遍。","v":["动画啥时候加才能放映不卡","动画效果何时加进去放映才顺","演示文稿动画什么时候添加比较流畅"],"h":0},{"q":"减肥期间怎么吃？","a":"保证优质蛋白（蛋奶鱼肉豆）和蔬菜充足，主食选全谷物并适当减量，戒掉含糖饮料和零食。三餐规律、晚餐清淡，每周允许一餐放松以防暴食反弹。","v":["减肥吃什么","减肥能吃饭吗","减肥食谱怎么安排"],"h":0},{"q":"提交代码时应该包含哪些内容？","a":"提交代码时一般应包含本次改动的文件、说明改动内容的提交信息（commit message），必要时补充相关注释、测试和文档更新；具体以团队或平台的提交规范为准。","v":["代码提交时应该包含什么","提交代码一般要带哪些内容","提交代码需要附上哪些东西"],"h":0},{"q":"入党申请需要多长时间能审批通过？","a":"入党没有 子居中？","让 div 水平垂直居中的简单方法"],"h":0},{"q":"学生证遗失后如何更换，并且去哪里换新证呢？","a":"先向学校学生证管理部门（多为学生处/学工部，部分学校为教务处）报告遗失并申请补办：填写学生证补办申请表、提交身份证明和照片，部分学校要求登报或校内公示声明原证作废；审核通过后到该部门领取新证。具体材料和办理地点以本校规定为准。","v":["学生证丢了去哪补办新证","学生证掉了补办流程和地点是啥","学生证遗失后怎么换新的"],"h":0},{"q":"新生选课需要提前多久开始准备？","a":"各校选课安排不同，没有统一的提前时长。建议尽早查看本校教务处/院系发布的选课通知与时间表，提前了解培养方案、课程大纲和先修要求，具体时间以学校通知为准。","v":["大一新生选课一般要提前多长时间准备","新生选课得提早多久开始准备啊","选课之前新生需要提前多久做功课"],"h":0},{"q":"评书和快板有什么区别？","a":"评书以散文讲述为主，靠口语和表演推进长篇情节；快板以韵文唱诵为主，用竹板伴奏、节奏鲜明，多为短段。两者都属说唱艺术，但表达方式、伴奏和篇幅差异明显。","v":["两种曲艺形式","快板有伴奏吗","评书和快板区别"],"h":0},{"q":"云文档分享后忘记密码如何找回？","a":"先区分是分享链接的提取密码还是账号登录密码：分享密码可由分享者在分享设置中重新设置或重新生成链接；账号密码可在登录页点击“忘记密码”，通过绑定的手机号或邮箱验证后重置；企业/团队账号可联系管理员协助处理。","v":["云文档分享密码忘了怎么找回来","云文档链接密码丢了如何找回","分享的云文档密码记不住咋办"],"h":0},{"q":"社团招新的时候可以摆摊发传单吗？","a":"需按学校统一安排参加集中招新或向挂靠单位申请临时摊位，未经审批不要擅自摆摊，具体要求以学校最新通知为准。","v":["招新发传单要审批吗","社团招新宣传怎么申请摊位","社团招新能摆摊吗"],"h":0},{"q":"元素周期表是怎么排列的？","a":"元素按原子序数递增排列，横行称为周期，纵列称为族。同一周期电子层数相同，同一族最外层电子数相同因而性质相似。周期表揭示了元素性质的周期性变化规律。","v":["周期和族的区别","周期表怎么排","周期表排列依据"],"h":0},{"q":"U盘无法读取时应怎么办？","a":"先换一个USB接口或换台电脑测试，在磁盘管理中查看是否被识别，必要时更新/重装USB驱动。若提示需要格式化，先不要格式化以免数据丢失，可先用数据恢复工具取出文件；确认是硬件损坏再考虑维修或更换。","v":["U盘插上没反应该咋办","U盘识别不了有什么办法解决","U盘读不出来怎么处理"],"h":0},{"q":"什么是长期投资和短线交易？","a":"长期投资是持有数年至数十年，分享企业成长和复利收益，关注基本面；短线交易是持有数天到数周，靠价差获利，关注技术面和情绪。前者时间成本低、胜率相对高，后者对技术和纪律要求极高。","v":["波段交易是什么","长期投资好还是短线好","长线和短线区别"],"h":0},{"q":"保存的文档如何同步到云端？","a":"先在软件中登录账号，把文档保存到云盘目录（如 WPS 云文档、OneDrive 等）或开启自动同步/自动上传功能，保持联网即可自动同步；也可手动把文件上传到云盘。","v":["保存的文档咋弄到云上同步","文档存好了怎么同步到云端去","文档怎么设置才能自动同步到云端"],"h":0},{"q":"病理检查为什么是金标准？","a":"病理检查通过显微镜观察组织细胞的形态结构，能直接判断病变性质和良恶性，是疾病诊断（尤其肿瘤）最可靠的依据，被称为金标准。影像和化验提供线索，病理给出确诊。标本取材是否充分会影响准确性。","v":["为什么病理最准","活检报告怎么看","病理诊断是什么"],"h":0},{"q":"如何在线办理图书馆借书手续？","a":"通常是登录图书馆官网或App，用读者证账号登录后检索图书并办理预约、续借等操作；借书一般不收费，纸质书多需到馆通过自助借还机或柜台办理。具体流程以所在图书馆规定为准。","v":["图书馆借书在网上怎么弄","怎么在线办图书馆借书","网上能办理图书馆借书手续吗"],"h":0},{"q":"考研报名一般在哪一天开始？","a":"没有固定的某一天，每年由教育部公布安排。一般 9 月下旬进行网上预报名，10 月正式报名，具体日期以当年研招网公告为准。","v":["考研报名一般几月份启动","考研报名开始时间通常是哪天","考研报名每年大概什么时候开始"],"h":0},{"q":"什么是国际机场的免税店？","a":"免税店是免征关税和消费税的商店，常见于机场和口岸，销售烟酒、化妆品、奢侈品。价格不一定最便宜，需比较。","v":["免税和退税区别","免税店买什么划算","免税店真的便宜吗"],"h":0},{"q":"如何申请使用实验室的电脑资源？","a":"各校做法不同，一般需先获得使用资格（如课程选修或导师、实验室管理老师同意），再通过学校的实验室预约系统或线下登记预约时段，经管理员批准后按时使用。具体流程请咨询所在院系或实验室管理中心。","v":["实验室的电脑资源怎么申请使用","怎么申请用实验室的电脑","想用实验室电脑要怎么办申请"],"h":0},{"q":"想申请课程免修，一般要走什么流程？","a":"向学院教务办公室提交免修申请及相关证明材料，经审核同意后方可免修，具体条件和流程以学校最新通知为准。","v":["免修申请找谁交","免修需要什么手续","课程免修怎么办理"],"h":0},{"q":"画字开头的成语有哪些？","a":"常见的有画蛇添足、画龙点睛、画饼充饥、画地为牢、画虎类犬、画栋雕梁。以“画”开头的成语多与绘画行为或虚构事物有关，前四个最常用，其中画蛇添足和画龙点睛常作为一组反面对比来记。","v":["以画开头的四字成语","画字成语","画开头的成语有哪些"],"h":0},{"q":"湿婆为什么被称为毁灭之神？","a":"湿婆掌管毁灭与再生，象征宇宙循环中不破不立的力量。他既是苦修的瑜伽士又是舞王，跳宇宙之舞象征世界的创造与毁灭。毁灭并非单纯破坏，而是为新生命腾出空间，因此他同时受到敬畏与崇拜。","v":["毁灭之神的含义","湿婆为什么被崇拜","湿婆是什么神"],"h":0},{"q":"现代作品怎么改编北欧神话？","a":"奇幻文学、漫画和影视大量借用北欧诸神与诸神黄昏的意象，把奥丁、托尔、洛基重构为现代角色。改编往往强化人物性格冲突、弱化宗教背景，使古老神话获得新的生命力，也让北欧元素广为流行。","v":["为什么北欧神话很火","改编和原神话区别","现代作品怎么改编神话"],"h":0},{"q":"高斯的学生有哪些？","a":"高斯培养了不少学生，其中最著名的是黎曼，他在高斯指导下研究复变函数并完成博士论文；还有戴德金，他在代数数论上贡献巨大。高斯的严谨风格深刻影响了这些后继者。","v":["高斯教过谁","高斯的学生","黎曼的老师是谁"],"h":0},{"q":"投影面垂直线有哪几种？","a":"垂直于一个投影面因而平行于另两个投影面的直线称投影面垂直线，分为正垂线、铅垂线和侧垂线。它在所垂直的投影面上积聚为一点，在另两投影面上反映实长且分别垂直于相应的投影轴，这是判断垂直线的重要依据。","v":["投影面垂直线分类","积聚成点说明什么","铅垂线投影特点"],"h":0},{"q":"运动前需要热身吗？","a":"需要。热身能提高体温、增加关节活动度、促进血液循环，降低运动损伤风险。一般做5到10分钟动态拉伸和低强度活动即可。","v":["不热身会怎样","热身怎么做","运动前要热身吗"],"h":0},{"q":"桃园三结义讲的是谁？","a":"《三国演义》中刘备、关羽、张飞在桃园结拜为兄弟，立誓同心协力、报效国家、不求同生但求同死。这是小说虚构的情节，却塑造了刘关张情义的象征，成为忠义结拜的经典意象。","v":["刘关张结拜典故","桃园三结义人物","桃园结义真假"],"h":0},{"q":"线上查找文献时遇到付费资源有限怎么办？","a":"尝试使用免费的学术搜索引擎如Google Scholar，或者申请学校的试用账号访问更丰富的数据库。","v":["文献下载要钱，有免费的办法吗？","查文献好多都要付费，怎么办？","网上找文献遇到收费的怎么破？"],"h":0},{"q":"如何在邮件客户端设置自动保存重要信件的功能？","a":"各客户端路径不同，一般在“设置/选项”中查找与保存、草稿或存档相关的选项；若想自动留存重要邮件，可建立规则（过滤器），把符合条件的邮件自动复制或移动到指定文件夹保存。","v":["怎么让邮件客户端自动把重要信件存下来","邮件客户端怎么设置自动保存重要邮件","邮件客户端自动留存重要邮件的功能在哪设"],"h":0},{"q":"续借图书超过一次还能再申请吗？","a":"续借次数限制各图书馆不同。一般在没有其他读者预约、且未超期的情况下可以续借，可续借次数和期限请以本馆借阅规则或咨询图书馆为准。","v":["图书续借超过一次还可不可以再续","图书续借超过一次还能再续吗","续借次数用完了还能申请续借吗"],"h":0},{"q":"费马小定理是什么？","a":"若 p 是素数且整数 a 与 p 互质，则 a 的 p 减一次方除以 p 余一。它是模运算与素数性质的重要结论，可用于快速计算大数的模幂，也是素数判别和现代密码学算法的理论基础。","v":["费马小定理内容","费马小定理应用","费马小定理条件"],"h":0},{"q":"查交通信息的官方渠道","a":"出行前查信息，建议使用官方渠道：地铁方面可以看北京地铁官网和官方应用，能查到线路图、车站出入口、首末班车时间和运营公告；公交方面可以看北京公交集团的官方应用和网站，能查到线路走向、站点和实时到站信息；铁路方面用中国铁路官方购票应用查询车次、购票和改签；航班方面用航空公司官网或者航旅类应用查询航班动态和办理值机。市政交通一卡通的余额和消费记录也可以在官方应用里查询。遇到运营调整、临时封站、线路改线，官方渠道发布的信息最准确，社交平台上的传言不要轻信。","v":["App","公交实时到站去哪查比较准","官网","实时到站","查地铁首末班车用哪个官方渠道","查火车车次用铁路官方应用吗"],"h":0},{"q":"黑体辐射为什么引出量子概念？","a":"经典理论无法解释黑体辐射的能量分布，会在短波处得出无穷大即紫外灾难。普朗克假设能量以离散份额交换，成功拟合实验，开启了量子概念。这标志着物理学从经典走向量子时代。","v":["普朗克量子假说","紫外灾难是什么","黑体辐射与量子"],"h":0},{"q":"如何在校园卡自助机上挂失丢失的校园卡？","a":"在自助机屏幕上进入校园卡服务，按提示用学号和密码（或刷身份证）验证身份，选择“挂失”并确认；也可通过学校校园卡App或到卡务中心办理。","v":["卡丢了想用自助机挂失怎么弄？","校园卡丢了在自助机怎么挂失？","自助终端挂失校园卡要输学号吗？"],"h":0},{"q":"一站式服务大厅与线上办事平台","a":"学校设有师生一站式服务大厅，集中受理与学生相关的证明办理、用印申请、财务报销咨询等事项，减少在不同部门之间往返。多数事项已支持线上办理，学生可通过校内信息平台进入办事大厅，选择对应事项提交申请，经审批后到指定窗口领取结果或直接下载电子版文件。使用线上平台前需要确认已完成统一身份认证并保持手机号有效，以便接收审批进度提醒。大厅的开放时间为工作日办公时间，节假日与寒暑假期间的服务安排会另行通知，具体可办理事项清单、窗口位置与开放时间以学校公布的最新办事指南为准。","v":["一站式大厅能办哪些证明？","师生服务","用印申请可以线上提交吗？","线上办事大厅怎么登录？","线上办理"],"h":0},{"q":"预付卡商家跑路怎么办？","a":"可向市场监管部门或商务主管部门投诉，涉及金额较大或多人受害可联合报案（可能涉嫌诈骗）。办理预付卡应尽量选择信誉良好商家、签书面合同、保留付款凭证，并减少大额充值。","v":["充值卡店关门怎么办","办卡要注意什么","预付卡跑路怎么维权"],"h":0},{"q":"如何在线办理论文查重服务？","a":"一般通过学校图书馆官网的论文查重（学术不端检测）入口，用学校提供的账号登录后按提示上传论文；具体入口名称和使用方式以本校图书馆的通知为准。","v":["怎么在线申请论文查重","线上办论文查重的流程是啥","论文查重服务怎么在网上办理"],"h":0},{"q":"什么是交通违法扣分？","a":"交通违法根据严重程度扣分（1到12分），一个记分周期12分，扣满需参加学习考试。常见扣分：闯红灯6分、超速按幅度3到12分。","v":["12分扣完怎么办","驾驶证扣分规则"],"h":0},{"q":"奖学金申请需要提交哪些材料和准备多久的时间？","a":"常见材料有申请表、成绩单及相关获奖、科研或家庭经济情况等证明材料；所需准备时间因奖学金种类而异，建议按学校发布的评选通知安排。","v":["奖学金材料要准备多长时间","奖学金申请要交什么材料准备多久","申请奖学金需要哪些材料和时间"],"h":0},{"q":"2026年美国中期选举谁赢了","a":"截至 **2026年5月7日**，**2026年美国中期选举还没有举行，因此不存在“谁赢了”的结果**。 - 选举日：**2026年11月3日** - 改选范围：美国众议院全部 **435席**、参议院约 **35席**，以及多州州长和州议会席位 - 目前阶段：主要是初选和竞选活动期，尚不能确定国会两院或各州选举的最终赢家 所以答案是：**还没有赢家；结果要等2026年11月3日投票后才能确定。**","v":["2026年美国中期选举最终由谁获胜？","2026年美国中期选举的获胜者是谁？","2026年美国中期选举的赢家是谁？","2026年美国中期选举结果是谁赢了？","2026年美国中期选举谁胜出了？"],"h":0},{"q":"校园卡在浴室洗澡怎么计费？","a":"浴室刷卡一般按实际用水量或使用时间计费，从校园卡余额中直接扣除，具体计费方式和标准以学校最新通知为准。","v":["校园卡在澡堂怎么收费？","校园卡洗澡是怎么扣钱的？","浴室刷卡怎么算费用？"],"h":0},{"q":"辅修课程是否计入总学分里？","a":"各校规定不同。辅修课程学分通常单独记录，是否计入主修专业毕业所需总学分或折算为选修学分，需以本校教务处的辅修管理规定为准。","v":["辅修的学分算不算总学分里","辅修课的学分算进总学分吗","辅修课程学分能不能计入总学分"],"h":0},{"q":"如果想提前知道挂科情况，应该什么时候检查一次绩点？","a":"需在期末成绩公布后登录教务系统查看各科成绩和绩点，才能确认是否挂科；考试前查询只能看到以往学期的成绩。","v":["什么时候查绩点才能提前知道挂没挂科","想早点知道有没有挂科什么时候查绩点合适","期末成绩出来后什么时候查绩点能看挂科情况"],"h":0},{"q":"如何线上办理食堂用餐预约和取消？","a":"各校做法不同，一般可在学校后勤或校园服务的App、小程序中查找食堂订餐/预约相关功能，按提示预约或取消；具体入口和规则请以本校后勤部门通知为准。","v":["学校食堂订餐线上怎么操作","线上怎么预约食堂用餐再取消","食堂吃饭预约和取消咋在线上弄"],"h":0},{"q":"查重报告中重复内容较多怎么办？","a":"对照报告中标红部分逐段修改：用自己的语言重新组织表述、调整句式与结构，规范引用并标注参考文献，必要时删减合并重复内容，改完再重新检测。","v":["查重报告重复率太高怎么改","查重结果里重复太多要怎么修改","查重重复内容多该咋处理"],"h":0},{"q":"社团想办个讲座，请校外的人来讲，要额外审批吗？","a":"需要，邀请校外人员进校通常要按学校外事或活动审批要求单独报备，提前向社团指导老师和挂靠单位说明。具体流程以学校最新通知为准。","v":["校外嘉宾讲座需要备案吗","社团请外人进校讲课咋审批","请校外老师来讲座要报批吗"],"h":0},{"q":"社团要办内部培训，需要提前报备吗？","a":"一般需要向社团管理部门报备活动时间、内容和参与范围，涉及场地使用的按学校规定申请，具体以学校最新通知为准。","v":["办社团培训需要申请吗","社团内部培训要报备吗","社团培训活动怎么报备"],"h":0},{"q":"提交代码时需要包含哪些信息以确保历史清晰和可追溯性？","a":"提交信息应有简明的标题概括本次改动，必要时在正文说明改动原因、影响范围，并关联对应的需求或缺陷编号；作者和时间由版本控制系统自动记录。同时保持一次提交只做一件相关的事，便于回溯。","v":["代码提交信息要包含什么才方便追溯","提交代码时写哪些信息能让历史更清楚","提交代码该带哪些信息保证记录清晰"],"h":0},{"q":"怎么在自助渠道查看党课报名情况？","a":"党课报名一般由院系党组织或党委组织部组织，可通过学校党建平台、组织部（党校）通知查询，或直接咨询辅导员、党支部书记，具体渠道以本校通知为准。","v":["党课报名进度在自助渠道怎么查","哪里能自助查询党课报名情况","自助服务里咋看党课报没报上"],"h":0},{"q":"遇到蓝屏时，应首先尝试哪些自助渠道解决问题？","a":"先记下蓝屏显示的错误代码，重启看是否恢复；若反复出现，可进入安全模式，卸载最近安装的驱动、软件或更新，运行系统自带的疑难解答／启动修复，并检查内存和硬盘。仍无法解决时再联系设备厂商或单位 IT 支持。","v":["电脑蓝屏了先自己试哪些办法","蓝屏时自己能先尝试什么办法处理","遇到蓝屏可以先从哪些渠道自助解决"],"h":0},{"q":"如果我将包裹放在驿站里超过有效期，还能取到吗？","a":"超过驿站保管期限的包裹通常会被退回寄件人，部分驿站也可能继续代管或收取保管费。各驿站保管天数不同，建议尽快联系驿站或快递员确认包裹是否还在，若已退回则需联系寄件人重新发货。","v":["包裹在驿站放超时了还能取吗","包裹过了驿站保管期还能取到吗","快递在驿站超过有效期还能不能拿"],"h":0},{"q":"俗语会过时吗？","a":"会。部分俗语依赖旧时生活方式，如涉及粮票、煤油灯的说法，年轻人已不熟悉。但那些说理深刻、表达生动的俗语，如“路遥知马力”，生命力很强。语言在淘汰旧词的同时也不断产生新俗语。","v":["为什么有些俗语不用了","新俗语产生"],"h":0},{"q":"苟利国家生死以体现了什么精神？","a":"体现了把国家民族利益置于个人得失之上的爱国主义精神。林则徐因禁烟被贬，仍写下这样的句子表明心志：只要于国有利，就不计个人安危祸福。这种担当精神至今仍被推崇。","v":["为国担当","林则徐爱国诗句","苟利国家生死以什么精神"],"h":0},{"q":"选课能选几门通识课？","a":"通识课选课门数或学分通常有限制，具体额度与可选类别以学校最新通知为准，可在选课系统中查看剩余可选数量。","v":["一学期能选几门通识课","通识课最多选几门","通识课选课有限制吗"],"h":0},{"q":"人误地一时地误人一年是什么意思？","a":"指农时不能耽误，错过播种或管理的时机，一年的收成就毁了。它强调农业生产季节性极强，也常被引申为做事要抓住时机，否则后悔莫及。语气朴素有力，是典型的劝诫型农谚。","v":["人误地一时什么意思","农时为什么重要","误农时后果"],"h":0},{"q":"创建母版时忘记选择背景样式怎么办？","a":"可以事后补设：进入“视图—幻灯片母版”，选中母版或相应版式，用“背景样式/设置背景格式”设置背景，关闭母版视图后即会应用到使用该版式的幻灯片。","v":["做母版的时候忘了选背景样式咋整","忘记给母版设背景样式了还能补救吗","母版建好了才发现背景样式没设置怎么办"],"h":0},{"q":"时钟中断对调度器有什么意义？","a":"周期时钟中断周期性打断当前任务，让调度器有机会检查时间片或虚拟运行时间是否到期，决定是否切换任务。它也是维护系统时间、统计处理器占用和触发定时器的基础。高精度与动态时钟技术可减少空闲时的无谓中断，降低功耗，同时保证需要时的调度精度。","v":["时钟中断作用","没有时钟中断会怎样","调度什么时候被触发"],"h":0},{"q":"布尔逻辑检索怎么用？","a":"布尔逻辑用与或非连接检索词：与表示交集，缩小范围提高查准率；或表示并集，扩大范围提高查全率；非表示排除，去掉不相关结果。合理组合三者能精确控制检索范围。例如想查苹果公司的手机可写成苹果与手机，排除食品可用非水果。","v":["AND OR NOT怎么用","布尔逻辑检索怎么理解","怎么缩小检索范围"],"h":0},{"q":"猫为什么喜欢抓老鼠？","a":"猫捕食老鼠源于本能：小型移动的猎物会强烈触发猫的捕猎序列——跟踪、扑击、撕咬。家猫虽不缺食物，这套本能仍保留，因此会追逐玩具、逗猫棒甚至你的脚趾。此外老鼠体内含有牛磺酸等营养，历史上也确实为猫提供了食物来源。抓老鼠既是天性也是游戏。","v":["猫不饿也抓老鼠吗","猫为什么爱抓老鼠","猫的捕猎本能"],"h":0},{"q":"交押金时有哪些注意事项？","a":"先确认押金金额、支付方式、退还条件和时间，尽量以书面合同或条款约定；付款后索取并保留收据等凭证，核对收款方与合同主体一致。押金一般出具收据而非全额发票。","v":["付押金的时候有哪些地方要留心","押金交之前得留意哪些地方","押金交的时候得注意哪些事项"],"h":0},{"q":"债券和股票有什么区别？","a":"债券是债权债务凭证，投资者是债权人，到期还本付息、收益相对固定、风险较低；股票是所有权凭证，投资者是股东，收益来自分红和股价上涨、不保本、风险较高。股市低迷时债券通常更抗跌。","v":["买债券和股票哪个安全","债券收益怎么来的"],"h":0},{"q":"教师资格证怎么考？","a":"教师资格证分笔试、面试和认定三步。笔试考综合素质、教育知识与能力、学科知识；面试为结构化问答、试讲和答辩。合格成绩有效期两年，通过后在有效期内申请认定，需提供普通话等级证书（语文学科一般要求二甲以上）和体检证明。","v":["教资怎么考","教资笔试考什么","教资认定需要什么"],"h":0},{"q":"如何快速备份 iPhone 的照片和视频到 iCloud？","a":"打开“设置”，点按顶部的 Apple ID（你的姓名），进入 iCloud > 照片，开启“同步此 iPhone”（iCloud 照片）。连接 Wi‑Fi 并接通电源后会自动上传照片和视频，需确保 iCloud 存储空间足够。","v":["iPhone照片视频怎么快速备份到iCloud","iPhone相册怎么快速同步到iCloud里","想把iPhone照片视频快速存iCloud该怎么做"],"h":0},{"q":"如何在线办理语言考试报名和成绩查询？","a":"一般在该考试的官方报名网站注册账号、填写个人信息并缴费 心","辅导"],"h":0},{"q":"搬家时水电费如何结算？","a":"一般在搬出时抄录水电表读数，结清截至搬出日的费用，并办理过户或销户；所需材料和具体流程请咨询当地供水、供电单位。","v":["换房子水电费如何结清","搬家水电费怎么算清楚","搬走的时候水电费咋结"],"h":0},{"q":"缓存文件会占用多少空间？","a":"没有固定比例。缓存占用取决于具体应用、使用时长和缓存设置，占用的是磁盘空间而非内存。可在浏览器或应用的存储/缓存设置中查看实际占用，并设置上限或手动清理。","v":["缓存一般会占多大空间啊","缓存占用的空间大概有多少","缓存文件能占多少磁盘空间"],"h":0},{"q":"如何在不同时间点对同一个文件产生多次更改并合并到同一版本中？","a":"用版本控制工具（如 Git）把每次修改分别提交，再通过合并分支（merge）或压缩提交（squash）将这些改动汇总到同一个版本中。","v":["不同时间的修改怎样合进同一版本","同一文件多次改动怎么合并到一个版本","多次改同一个文件怎么汇总到同一版本"],"h":0},{"q":"校园卡里的钱怎么用手机充值？","a":"通常在学校官方校园卡App或微信/支付宝的校园卡服务入口在线充值，圈存到账后即可消费；具体入口和到账方式以学校最新通知为准。","v":["手机给校园卡充值的方法","校园卡怎么用手机充钱","饭卡线上充值怎么弄"],"h":0},{"q":"郑和下西洋是什么？","a":"明朝郑和在1405到1433年间七次率庞大船队远航，到达东南亚、印度洋、东非等地，是世界航海史上的壮举，促进了中外交流。","v":["郑和去了哪里","郑和航海意义"],"h":0},{"q":"快板里的数板是什么？","a":"数板是快板中不计拍节、快速连珠炮似的数说段落，以清楚和速度为亮点，常用来列举事物或渲染气氛。数板考验嘴皮子功夫，念得又快又准才见水平，是快板表演中的技巧展示部分。","v":["快板怎么数得快","数板和唱板区别","数板是什么"],"h":0},{"q":"中农云系统与全国毕业去向登记系统","a":"办理就业手续依托两个系统。一是中农云系统（scc.cau.edu.cn），初始用户名为学号，密码为身份证号，也可通过扫码或手机验证码登录，可办理个人基本信息核对、就业推荐表申请、三方协议申请、签约信息登记与户档派遣申请。二是全国高校毕业生毕业去向登记系统（wq.ncss.cn），选择学生登录并使用本人学信网账号，如无账号需先注册，该系统只用于网签。两个系统中的手机号码与电子邮箱由学生在本人学信网账号信息中修改并自动同步。签约前务必核对系统内个人基本信息，避免因信息有误影响后续签约与派遣。","v":["中农云","中农云初始密码是什么","中农云能申请三方协议吗","去向登记","就业系统","毕业去向登记用哪个系统"],"h":0},{"q":"如果想给同学寄个包裹到外地，应该选择哪种驿站服务更快？","a":"驿站只是代收代寄点，本身不决定速度；快慢取决于所选快递公司的时效产品，通常主打时效的快递（如顺丰）更快，可在下单时比较各家的预计送达时间。","v":["寄包裹到外地用哪个驿站服务更快","往外地给同学寄东西选什么驿站快","给外地同学寄包裹选哪种驿站服务快"],"h":0},{"q":"使用校园网登录时为何频繁收到安全提示，应怎样操作减少此类提醒？","a":"这类提示多为认证证书告警或新设备、异地登录验证。建议通过学校官方认证入口登录，按学校指引安装所需证书，固定使用同一设备和浏览器；若提示内容异常，应联系学校网络中心核实，不要随意忽略。","v":["校园网登录老弹安全提示怎么减少","校园网登录频繁提示安全怎么操作少点提醒","用校园网总收到安全提醒该咋办"],"h":0},{"q":"如何快速查看已安装的应用大小和占用空间？","a":"安卓：进入设置→存储，可查看应用等各类占用；要看单个应用，可在设置→应用管理→选择应用→存储中查看应用大小和数据、缓存。iPhone：设置→通用→iPhone储存空间，列表会按占用大小显示各App。","v":["在哪查看已安装应用的大小和占用","怎么快速看手机里应用占多大空间","手机应用占用的存储空间怎么看"],"h":0},{"q":"新生如何计算自己的绩点？","a":"先把每门课的成绩按学校规定换算成绩点（如4.0或5.0制），再用该课绩点乘以学分得到学分绩点；把所有课程的学分绩点相加后除以总学分，才是平均学分绩点（GPA）。只相加不除以总学分得到的不是GPA，具体换算标准以本校规定为准。","v":["刚入学想知道绩点怎么计算","大一新生绩点是怎么算出来的","新生咋算自己的平均绩点啊"],"h":0},{"q":"早和晨的区别是什么时候用的合适？","a":"“早”和“晨”都指天亮前后的一段时间。“早”更口语化、用法更广，可组词“早上”“清早”，也可表示时间靠前（如“早一点”）；“晨”偏书面语，多用于固定搭配，如“清晨”“晨光”“晨曦”，一般不单独使用。","v":["什么时候该用早什么时候用晨","早和晨平时怎么区分用哪个","早跟晨用法上有啥不一样"],"h":0},{"q":"维护 MySQL 索引时需要注意什么事项？","a":"注意避免在索引列上使用函数、运算或隐式类型转换导致索引失效；避免建立过多重复、冗余索引增加写入和维护开销；定期用 ANALYZE TABLE 更新统计信息，清理长期未使用的索引，必要时重建表以整理碎片。","v":["MySQL索引日常维护该留意什么","MySQL索引维护要注意哪些点","维护MySQL索引有什么注意事项"],"h":0},{"q":"多数投票为什么能提升数学推理准确率？","a":"多数投票让模型对同一题生成多条推理路径，写成不同解法，然后选出现次数最多的答案。核心假设是正确的推理大多收敛到同一个结果，而错误解法各错各的、答案分散。这样无需额外训练就能提升正确率，代价是要多次采样。它和自一致性本质相通，是测试时计算的常见形式。","v":["不训练也能提分吗","投票机制的原理是什么","自一致性原理"],"h":0},{"q":"分支创建后是否可以直接推送至远程仓库？","a":"可以。新建分支后可直接用 git push -u origin <分支名> 推送到远程，不必先在本地提交；若分支上还没有新提交，推送的内容与创建时的基点相同。","v":["分支建好后可不可以马上推送远程","创建完分支直接推送远程行不行","新建的分支能直接推到远程仓库吗"],"h":0},{"q":"宿舍校园网连不上怎么办？","a":"先检查网线或Wi-Fi连接，再重启路由和电脑，仍不行可到校园网服务点报修；具体报修方式和地点以学校最新通知为准。","v":["宿舍网络故障怎么报修","宿舍网连不上怎么解决","校园网断网了找谁"],"h":0},{"q":"如何通过线上渠道办理流量增加服务？","a":"可通过运营商官方App或官网，在流量/套餐办理相关页面选择叠加流量包并确认订购，也可联系在线客服协助办理；具体入口名称以运营商实际页面为准。","v":["流量不够了线上咋办增加流量","线上怎么办理流量加包","网上渠道怎么开通流量增加服务"],"h":0},{"q":"U盘不小心写入错误导致无法读取怎么办？","a":"先不要格式化（格式化会清除数据）。可换USB接口或电脑试读，或用数据恢复软件扫描并先把重要文件导出备份；若仍无法读取，再考虑格式化或送专业数据恢复机构。","v":["U盘写坏了读不出来怎么处理","U盘提示无法读取还能救吗","U盘突然读不了里面的数据咋办"],"h":0},{"q":"报提前批会影响本科批录取吗？","a":"提前批在正常本科批之前录取，若未被提前批录取，档案不会被提走，可以继续参加本科批投档，不影响后续批次。但若被提前批正式录取，就不能再参加本科批录取。所以填报提前批要慎重，只填自己真正愿意去的院校专业。","v":["提前批录取了还能反悔吗","提前批怎么填","提前批没录上影响本科批吗"],"h":0},{"q":"缓考如何申请并参加考试？","a":"一般需在考试前向所在院系或教务处提交缓考申请及证明材料（如病历），获批后按学校安排参加缓考或补考。具体流程和考试安排以本校教务处规定为准。","v":["申请缓考的流程和考试安排是啥","缓考怎么申请，考试怎么参加","缓考要怎么办手续，之后怎么考"],"h":0},{"q":"元素和原子有什么区别？","a":"元素是同类原子的总称，是宏观概念只论种类不论个数；原子是构成物质的微观粒子，既论种类也论个数。可以说水由氢氧两种元素组成，也可以说一个水分子由两个氢原子和一个氧原子构成。","v":["元素原子用法","元素和原子区别","元素是宏观还是微观"],"h":0},{"q":"老年人用药要注意什么？","a":"老年人肝肾功能下降、常多病共存多药联用，易发生药物相互作用和不良反应。应定期整理用药清单、告知医生全部在服药物、从小剂量开始、简化用药方案。避免使用易跌倒药物（如镇静安眠药），定期复查肝肾功能。","v":["多种药一起吃有危险吗","老人吃药要注意什么","老年人用药原则"],"h":0},{"q":"搬家高峰期快递如何预约快速配送服务？","a":"可通过快递公司官方App、小程序或客服电话下单，预约上门取件 端密码忘了怎么找回","邮件客户端忘记登录密码该怎么处理"],"h":0},{"q":"想查的书在某个阅览室，能帮我找一下吗？","a":"先在馆藏检索系统确认索书号和所在阅览室，再按架上标识自行查找，找不到可请服务台工作人员协助，以学校最新通知为准。","v":["书在阅览室怎么找","怎么根据索书号找书","馆藏系统怎么查书的位置"],"h":0},{"q":"信息化服务大厅与网络报修","a":"中国农业大学信息化办公室为师生提供校园网、校园卡、信息系统等技术支持。服务热线为 (010) 62738000；办公地点在东校区体育馆东侧，西校区在图书馆一层；工作时间工作日为 8 点至 12 点、13 点 30 分至 17 点 30 分，节假日为 8 点 30 分至 11 点 30 分、14 点至 17 点；联系邮箱为 wlzx@cau.edu.cn。学校还提供在线咨询和微信报修入口，宿舍网络不通、认证失败、网速异常等问题可以通过上述渠道反馈，报修时说明楼栋、房间号、上网账号和具体现象，便于技术人员快速定位。","v":["62738000","上网故障","上网故障去哪儿报修？","信息化办公室","信息化办公室电话是多少？","信息化服务大厅几点上班？"],"h":0},{"q":"PPT配色有什么原则？","a":"主色不超过3种、对比清晰（深色背景配浅色字）、保持全篇统一、用强调色突出重点。可参考企业VI或经典配色方案。","v":["ppt配色方案","PPT颜色怎么搭","演示设计"],"h":0},{"q":"为什么有些科学家坚决反对新理论？","a":"新理论往往挑战既有权威和投入多年的研究框架，接受它意味着承认此前工作失效；加上新理论早期证据可能不充分，谨慎怀疑本身也符合科学精神。关键是反对应基于证据而非身份和立场。","v":["学术保守的原因","新理论为何难被接受","科学家为什么反对新理论"],"h":0},{"q":"怎样通过自助渠道备份重要数据到云盘上？","a":"一般在云盘客户端或手机相册/文件应用中开启自动备份，或手动选择照片、视频等文件上传到云盘；具体入口以所用应用的实际界面为准。","v":["云盘自动备份重要文件怎么弄","怎么自己把重要资料传到云盘备份","自助备份数据到云盘咋操作"],"h":0},{"q":"社会学是研究什么的？","a":"社会学是研究社会的结构、运行和发展规律的学科，关注社会关系、社会群体、社会制度以及社会变迁。它研究人们如何组织成社会、社会如何维持秩序、不平等如何产生、社会如何变化。与关注个体心理的心理学不同，社会学更看重社会结构对人和群体的塑造作用。","v":["社会学和心理学区别","社会学是什么","社会学研究什么"],"h":0},{"q":"微信电脑版的文件如何快速查找历史消息？","a":"打开对应聊天窗口，点击右上角的「…」选择「查找聊天记录」，可按关键词、图片与文件、日期等筛选；也可用聊天列表顶部的搜索框搜索关键词或文件名。","v":["微信电脑版怎么快速翻到以前的消息","微信电脑版查历史聊天记录有啥快办法","电脑微信里历史消息怎么快速搜出来"],"h":0},{"q":"医保报销的费用什么时候能到账呢？","a":"到账时间因地区和报销方式而异：医院直接结算通常即时抵扣，手工（零星）报销一般需数周甚至更久。建议向当地医保经办机构咨询，或通过当地医保官方App、小程序查询报销进度。","v":["医保报销的钱多久能到账","医保报销费用几天能打过来","报销的医保费用啥时候到账"],"h":0},{"q":"东校区生活服务设施分布速览","a":"东校区的生活服务设施大体沿宿舍区和食堂周边分布：学生公寓集中在校园东南和南侧，一号至三号公寓与学苑楼就在这一片；公共浴室分布在研究生宿舍南侧和三号公寓楼内，浴室一带还有干洗店、自助洗衣机、电吹风和理发服务；食堂、超市、便利店和快递服务点集中在生活区和校园商业街附近，校内快递由近邻宝、京东派等运营，公主楼 B 座前、研究生 2 号公寓南侧、3 号公寓南侧设有集中服务点；校医院、图书馆、体育场馆都在步行可达范围内。近年学校对东校区商业街部分房屋的用途作了优化调整，把部分店铺改为学生浴室等公共服务设施，服务网点的位置会随之变化。办理具体业务前，建议先看楼内张贴的公告或通过后勤服务渠道确认营业时间和办理方式。","v":["一站式","东区公共浴室在哪","东区快递服务点在哪","东区超市和便利店在哪","快递在哪","浴室在哪"],"h":0},{"q":"扫描一张 A4 纸的文档时应准备好哪些物品？","a":"扫描只需准备好待扫描的纸质原件（平整、无遮挡），扫描后生成电子文件，不需要空白纸张；只有需要复印件时才另备纸张。","v":["扫一张A4纸文件需要准备什么","扫描A4纸文件前要准备啥","扫描A4纸文档要准备哪些东西"],"h":0},{"q":"如何清理微信占用的空间？","a":"在微信「我→设置→通用→存储空间」中清理缓存，并进入聊天记录管理，删除不需要的图片、视频和文件；同时在「设置→通用→照片、视频、文件和通话」中关闭自动下载，减少后续占用。具体能释放多少空间取决于实际数据量。","v":["微信占的空间太大了怎么清理？","微信缓存和聊天记录怎么清理省空间？","怎么给微信腾出点存储空间？"],"h":0},{"q":"入党的五个阶段与基本流程","a":"发展党员工作按照《中国共产党发展党员工作细则》执行，整体分为五个阶段：入党申请人的确定与培养教育、入党积极分子的确定和培养教育、发展对象的确定和考察、预备党员的接收、预备党员的教育考察和转正。年满十八周岁的中国公民，承认党的纲领和章程，愿意参加党的一个组织并在其中积极工作、执行党的决议和按期交纳党费的，可以向所在单位党组织递交入党申请书。学生一般向所在学院的党支部提出申请。从递交申请到成为正式党员通常需要较长时间，各阶段的时限、材料与考察要求由学院党委和党支部按当年安排实施，具体以学院党组织通知为准。","v":["从写申请到转正都要走啥流程？","入党","入党流程","发展党员","发展党员五个阶段具体是哪些？","大学入党一共分哪几个阶段？"],"h":0},{"q":"如何从「Finder」快捷方式快速打开磁盘？","a":"在 Finder 中按 Shift+Command+C（或菜单栏“前往”→“电脑”）即可看到并双击打开磁盘；也可在 Finder 的“设置/偏好设置”→“通用”中勾选“硬盘”，让磁盘显示在桌面上双击打开，或把磁盘拖到 Finder 侧边栏以便快速访问。“显示简介”只用于查看信息，不能选择磁盘。","v":["Finder 快捷方式怎么快速打开磁盘","Finder 里怎样迅速调出磁盘","在 Finder 里怎么快捷打开磁盘"],"h":0},{"q":"有哪些动物是真正的群居与社会性昆虫？","a":"真社会性昆虫的典型特征是：世代重叠、共同育幼、分工明确（含不育的工蚁工蜂），代表有蚂蚁、蜜蜂、胡蜂和白蚁。它们通过信息素和复杂交流协调群体，形成超个体。相比之下，蝗虫等只是聚集，没有固定分工和共同育幼，不属于真社会性。","v":["什么昆虫是社会性的","真社会性是什么","蚂蚁蜜蜂为什么合作"],"h":0},{"q":"社团想办收费培训班，学校允许吗？","a":"社团一般不得以社团名义开展经营性收费活动，确有需要的须经挂靠单位和学校相关部门审批；能否开展及具体条件以学校最新通知为准。","v":["社团搞收费培训合不合规","社团活动可以收钱吗","社团能办收费班吗"],"h":0},{"q":"动画效果在导出后会保留吗？","a":"取决于导出格式：另存为 PPTX 会保留动画；导出为视频（如 MP4）会以画面形式呈现动画和切换；导出为 PDF 或图片则不保留动画。","v":["动画导出后能不能保留下来","导出之后动画效果还在吗","导出文件时动画效果会保留不"],"h":0},{"q":"如何在异地同时管理多个 Git 分支的工作进度而不冲突？","a":"每个任务用独立分支开发；开工前先 git fetch 拉取远程更新，再把对应远程分支 merge 或 rebase 到自己的分支上；切换分支前先提交或 git stash 暂存改动，并及时推送，减少长期分叉造成的冲突。","v":["人在异地怎么管好多个Git分支不打架","多个Git分支异地并行工作怎样避免冲突","异地同时管多个Git分支怎么不冲突"],"h":0},{"q":"如何确保所有学期的课程都显示在一张透视表上进行统计分析？","a":"先把各学期的课程数据合并到同一张数据源表中，并保留“学期/学年”字段，再基于整张表创建数据透视表，把“学期”拖到行或列区域；不要对学期、学年做筛选（若已设置筛选，需选“全部”），这样所有学期的课程就会显示在同一张透视表中。","v":["怎么让所有学期课程都显示在同一张透视表里","怎样做透视表才能看到全部学期的课","透视表怎么把各学期课程都统计进去"],"h":0},{"q":"建筑为什么被称为凝固的音乐？","a":"这个比喻强调建筑与音乐一样，通过节奏、韵律和结构比例给人审美感受。建筑的柱列重复、拱券序列、空间序列如同音乐的节拍与旋律，都以数理秩序组织感官体验。它说明建筑不仅有实用功能，也有强烈的艺术表现力。","v":["为什么建筑像音乐","建筑是艺术吗","建筑的美在哪里"],"h":0},{"q":"需要打印学术论文的封面和封底时应该怎么办理页眉？","a":"论文封面和封底通常不设页眉页脚。可用分节符把封面、封底与正文分开，取消“链接到前一节”后删除该节页眉，正文页眉再按要求设置。","v":["学术论文封面封底要打印，页眉如何办理","打印学术论文封面封底时页眉怎么弄","论文封面和封底的页眉该怎么设置"],"h":0},{"q":"为什么氟是最活泼的非金属？","a":"氟原子半径极小、电负性最大，对电子吸引力极强，几乎能与所有元素直接反应，甚至能与水剧烈反应放出氧气、与惰性气体形成化合物。氟气氧化性极强，是已知最活泼的非金属单质。","v":["氟气氧化性","氟活泼性的原因","氟的特殊性"],"h":0},{"q":"MultiPL-E如何把HumanEval扩展到多语言？","a":"MultiPL-E把HumanEval的Python题目翻译到多种编程语言，形成多语言版本，用来评测模型跨语言的代码生成能力。由于题目语义保持一致、只换语言，研究者能区分模型是掌握了算法逻辑还是只熟Python语法。类似的还有HumanEval-X等扩展，都应以各自名字单独报告，不与原版混为一谈。","v":["HumanEval有其他语言版吗","多语言代码基准","怎么测跨语言能力"],"h":0},{"q":"页眉和脚注有什么区别？","a":"页眉位于每页顶部，放标题、页码等重复信息；脚注只出现在有引用标记的那一页底部，用于对该处内容作注释或标明出处。每页底部重复出现的是页脚，不是脚注。","v":["想问页眉和脚注分别是什么区别","页眉跟脚注到底哪里不一样","页眉跟脚注的区别在哪"],"h":0},{"q":"人体需要哪些微量元素？","a":"人体必需微量元素包括铁锌碘硒铜锰氟等，虽含量极少但对酶活性、激素合成、免疫功能不可缺少。它们需从食物中获取，过量或不足都会影响健康，讲究均衡多样。","v":["微量元素作用","微量元素过量危害"],"h":0},{"q":"如何准确地删除微信群聊中的聊天记录？","a":"进入该群聊，点击右上角“…”，选择“清空聊天记录”即可删除本机上的该群记录；单条消息可长按后选择“删除”。注意这只能清除自己设备上的记录，无法删除其他群成员手机里的聊天记录。","v":["微信群里的聊天记录怎么删干净"],"h":0},{"q":"俗语有标准写法吗？","a":"多数俗语没有唯一标准写法，同一个说法常有几种变体，如“外甥打灯笼”各地措辞略异。写文章时以常见通用写法为准，遇到方言俗语可加引号或注释。和成语不同，俗语的固定性较弱。","v":["俗语写法固定吗","俗语变体","俗语有标准版吗"],"h":0},{"q":"HumanEval第46题fib4怎么解？","a":"Fib4数列前四项是0、0、2、0，之后每一项为前四项之和，要求不用递归高效求第n项。用四个变量a,b,c,d保存最近四项，每次滚动a,b,c,d=b,c,d,a+b+c+d，循环到n。递归会指数爆炸，滚动变量是O(n)的正解。关键是把初始四项设对，避免下标错位。","v":["fib4解法","HumanEval递推题","第46题Fib4数列"],"h":0},{"q":"化合价是怎么确定的？","a":"化合价反映原子在形成化合物时得失或共用电子的数目。主族元素最高正价一般等于最外层电子数，负价等于八减去最外层电子数。化合物中正负化合价代数和为零，可据此推算未知元素的化合价。","v":["化合价与电子转移","化合价怎么确定","化合价规律"],"h":0},{"q":"什么是心智理论？","a":"心智理论指个体理解他人拥有独立的心理状态（信念、愿望、意图），并能据此推测他人行为的能力。它是社会交往的基础。经典错误信念任务用来测量儿童是否具备此能力，通常四岁左右儿童能通过，孤独症谱系障碍者在此任务上常有困难。","v":["心智理论什么时候发展","心智理论是什么","错误信念任务测什么"],"h":0},{"q":"四六级考试什么时候报名和开考？","a":"四六级每年通常开考两次，笔试多在6月和12月，口试在笔试前一到两个月。报名一般在3月和9月启动，由各高校教务处组织，考生通过学校指定渠道报名，社会考生能否报考要看当地规定。具体时间以全国大学英语四六级考试网站公告为准。","v":["口试怎么报名","四六级一年考几次","四六级什么时候报名"],"h":0},{"q":"写 CSS 的时候怎么让一个块级元素水平居中？","a":"给元素设置固定宽度后用 margin 左右 auto，或者父容器用 flex 布局加 justify-content 居中。","v":["CSS 让盒子水平居中的方法","块级元素怎么水平居中","如何把 div 放中间"],"h":0},{"q":"楷书写得呆板怎么办？","a":"呆板多因只重笔画外形而忽视笔势呼应、结构缺少变化。办法是加强读帖、体会笔画间的连带和欹正关系，行笔加入提按疾徐，让字有节奏。也可适当临写行楷，把流动感带回楷书。","v":["怎么写出灵动","楷书写死板怎么办","楷书要有变化"],"h":0},{"q":"辅修课程学分认定有时间限制吗？","a":"辅修课程的学分认定通常有修业年限和申请时间要求，具体规定各校不同，建议查阅本校辅修管理办法或咨询教务处。","v":["辅修学分认定是否限时间","辅修课的学分认定有没有时间限制啊","辅修课程学分认定有时间要求吗"],"h":0},{"q":"怎么在知网查文献的被引情况？","a":"在检索结果中打开某篇文献详情，可查看其被引频次和引用了它的文献列表，点击可跳转到施引文献。也可使用引文网络功能查看参考文献和引证文献，形成研究脉络。被引情况反映文献影响力，但需结合发表年限和评价学科差异解读。","v":["引文网络怎么用","查谁引用了这篇论文","知网怎么看被引次数"],"h":0},{"q":"什么是新高考3+1+2模式？","a":"新高考3+1+2指语文、数学、外语三门必考，再从物理和历史中选一门作为首选科目，从化学、生物、政治、地理中选两门作为再选科目。总分750分，首选科目以原始分计入，再选科目以等级赋分计入。","v":["3+1+2是什么意思","新高考怎么考","首选再选科目"],"h":0},{"q":"误删文件后还能恢复吗？如果能，请告诉我具体步骤。","a":"有机会恢复。先停止向文件所在的磁盘写入数据（不要在该盘安装软件或保存新文件）；查看回收站或已有备份能否还原；若无备份，把数据恢复软件安装到另一块磁盘，扫描原盘并将找到的文件保存到其他磁盘；数据重要且自行恢复失败时，可交由专业数据恢复机构处理。","v":["不小心删掉的文件还能找回来吗具体咋操作","删掉的文件能恢复不具体怎么做","文件误删了有办法恢复吗步骤是什么"],"h":0},{"q":"三方协议丢了或者要改签该怎么处理？","a":"先联系学院就业工作老师说明情况，按学校就业指导部门要求申请补办或改签，具体材料和流程以学校最新通知为准。","v":["三方协议怎么补办","三方协议能改签吗","就业协议丢了怎么办"],"h":0},{"q":"离校手续中有哪些必备文件？","a":"各校要求不同，一般需按学校的离校清单逐项办理，常见涉及学生证、离校手续单（相关部门签章确认已归还图书、结清费用等）。具体必备材料请以本校发布的离校通知为准。","v":["办离校都需要什么文件","离校手续要准备哪些材料","离校要交哪些必备材料"],"h":0},{"q":"遇到浏览器兼容性问题该怎么办？","a":"先用各浏览器及其开发者工具复现并定位问题；对不支持的语法或 API 用 Babel 转译、polyfill 补齐，CSS 用 Autoprefixer 加前缀并以 Normalize/Reset 统一默认样式；配合特性检测做渐进增强或降级方案，最后在目标浏览器版本上回归测试。","v":["浏览器兼容性问题怎么解决","碰到浏览器兼容问题该咋处理","遇到浏览器不兼容的情况怎么办"],"h":0},{"q":"Word排版时如何避免因改内容而需重做？","a":"用样式统一设置标题和正文格式，配合自动编号、题注与交叉引用、自动生成的目录，并使用表格/分页符而非空格空行排版；内容改动后更新域（Ctrl+A 后 F9）即可，无需重排。","v":["Word排版如何避免改完内容重排","Word排版怎么改内容不用重做","Word里怎样排版才不怕改内容"],"h":0},{"q":"独立制片如何生存？","a":"靠电影节、艺术院线、众筹和小规模发行触达特定观众，控制成本并寻求补贴或基金支持。虽难获高票房，但创作自由度高，常产出有艺术价值的作品。","v":["小成本电影出路","独立制片优势","独立电影怎么赚钱"],"h":0},{"q":"怎样使用自助机进行校园卡挂失并补办手续？","a":"校园卡丢失后一般无法再刷卡，可凭学号/身份证在自助终端或校园卡平台办理挂失，随后携带有效证件到校园卡服务中心办理补卡（可能需缴纳工本费）。具体流程以本校规定为准。","v":["校园卡丢了用自助机怎么挂失补办","校园卡挂失和补办在自助机怎么弄","自助机上咋给校园卡挂失再补一张"],"h":0},{"q":"如何在知网找到最新的心理学研究文献？","a":"在知网检索框输入心理学相关主题词，结果页按“发表时间”排序；或用高级检索限定学科为心理学并设置较近的时间范围（如近一年），即可看到最新文献。","v":["想找知网里最近的心理学论文该咋操作","知网上怎么才能搜到最新的心理学文献","知网查心理学最新研究文章的方法是什么"],"h":0},{"q":"退了某门课成绩还未更新到系统中可以补选吗？","a":"退课后能否补选取决于学校的选课安排，一般在补退选阶段仍可重新选课，系统数据更新可能有延迟。建议向教务部门或辅导员确认。","v":["成绩还没同步 这时候补选来得及吗","课退了成绩没更新还能补选不","退课之后系统没更新 能重新选吗"],"h":0},{"q":"什么是资金面？","a":"资金面指市场上资金供给的宽松或紧张状况。资金面宽松时利率走低、资金充裕，利好股市债市；紧张时利率上行、融资成本提高。央行公开市场操作、月末季末考核、新股发行都会影响资金面。","v":["什么影响资金面","资金面宽松什么意思","资金面是什么"],"h":0},{"q":"主观题怎么争取步骤分？","a":"写出相关公式和定理、列出已知条件、分步骤推导、即使算错也把思路写清楚。阅卷按点给分，写对一步得一步的分。","v":["不会做也能得分吗","步骤分怎么拿"],"h":0},{"q":"Word里怎么把整页纸调成横向？","a":"把光标点到要做横向的那页内容上，在布局里打开页面设置，选横向并把应用于设为所选文字即可，前后页不受影响。","v":["Word纸张方向怎么变横向","如何让某段内容横着排","怎么把一页纸改成横的"],"h":0},{"q":"如何删除浏览器的书签记录？","a":"在浏览器中打开书签管理器（多数浏览器快捷键为 Ctrl+Shift+O），选中书签后右键删除即可；“清除浏览数据”只清理历史记录、缓存等，不会删除书签。","v":["怎么把浏览器里的书签删除","浏览器书签要怎么清理删除","浏览器书签记录怎么删掉"],"h":0},{"q":"手机上点按钮没反应，电脑上却正常，一般先查哪里？","a":"先确认点击区域有没有被其他元素盖住，再用移动端调试工具看事件是否真的触发，多半是层级或触摸事件的问题。","v":["为啥手机上点击没反应","手机端点不动电脑上没事","移动端按钮点不了怎么排查"],"h":0},{"q":"在国外用国内手机号上网，怎么避免天价漫游费？","a":"出发前开通国际漫游并买好流量包，或者到当地买电话卡、用eSIM，落地后关掉数据漫游只连WiFi更保险。","v":["出国手机上网怎么省钱","境外流量怎么买划算","怎样防止出国漫游费太贵"],"h":0},{"q":"竞技场式评测是怎么运作的？","a":"用户提出一个问题，系统同时展示两个匿名模型的回答，用户选出更好的一个或判定平局，投票后才揭晓身份。大量配对投票汇总成排名。因为提问者不知道模型是谁，能有效减少品牌印象带来的偏差。","v":["匿名投票排名","模型竞技场怎么玩","盲测对比原理"],"h":0},{"q":"如何做好时间管理提高工作效率？","a":"用四象限法区分轻重缓急、整块时间处理重要任务、批量处理同类小事、减少会议和消息干扰、设定明确截止点、每天留出规划复盘时间。","v":["工作效率低怎么办","怎么安排一天","提高生产力方法"],"h":0},{"q":"关系和非关系数据库怎么选？","a":"关系数据库适合结构固定、强调事务和多表关联的业务，如订单与账务；非关系数据库类型多样，文档型适合结构多变的业务，键值型适合高并发简单读写，列族型适合海量分析，图数据库适合关系网络。选型要看数据模型、一致性要求和访问模式，而非简单比较优劣。","v":["什么场景用文档数据库","关系型和非关系型怎么选","图数据库适合什么"],"h":0},{"q":"边界条件设置为什么关键？","a":"有限元方程必须靠足够的约束消除刚体位移才能求解，约束方式要与真实支承一致。约束过强会高估刚度、低估变形，约束过弱会导致模型飘移甚至奇异。载荷的大小方向和作用位置也要准确。错误的边界条件比粗糙网格更致命。","v":["约束过强会怎样","载荷怎么施加","边界条件为什么重要"],"h":0},{"q":"如何在哪个时间段内到学校图书馆补办丢失的校园卡？","a":"校园卡丢失后一般需到学校一卡通（卡务）服务中心办理挂失和补办，具体办理地点与受理时间请以学校官方公布的信息为准。","v":["什么时间去学校图书馆补校园卡","校园卡丢了去图书馆哪里补办","校园卡丢了在图书馆补办的时间地点"],"h":0},{"q":"预读机制是怎么提高扫描效率的？","a":"当数据库判断查询会顺序访问大量相邻页时，会提前把后续页从磁盘读入缓冲池，让计算与输入输出重叠，减少等待时间。顺序扫描、索引范围扫描常能触发预读。预读过度会读入用不到的数据污染缓存，因此优化器会依据访问模式判断是否开启。观察实际读取量与结果量的差距，可以评估预读是否有效。","v":["顺序扫描为什么快","预读会浪费缓存吗","预读机制作用"],"h":0},{"q":"在校外能用学校图书馆的数据库吗？","a":"一般通过图书馆提供的校外访问入口或统一身份认证登录后使用，具体开通方式和可用范围以学校最新通知为准。","v":["不在学校能用数据库吗","回家还能查知网吗","校外怎么访问图书馆电子资源"],"h":0},{"q":"选课前需要准备哪些材料？","a":"一般网上选课只需用学号登录教务系统即可，不需要提交纸质材料；少数有先修或资格审核要求的课程可能需另行提交证明，具体以本校教务处通知为准。","v":["选课之前得准备好啥东西","选课前材料要准备哪些","选课需要提前准备哪些东西"],"h":0},{"q":"风筝都指的是哪里？","a":"风筝都指山东潍坊，当地风筝制作历史悠久、工艺精湛，每年举办国际风筝节，风筝文化深入人心，故有鸢都、风筝都之称。风筝成为城市文化符号和特色产业。","v":["潍坊为什么叫鸢都","潍坊风筝节","风筝都是哪里"],"h":0},{"q":"教资面试抽到不会讲的课文，现场该怎么救场？","a":"先稳住节奏，按导入、提问、小结的框架把流程走完，把不会的知识点转化成让学生讨论的环节，别停下来冷场。","v":["教资面试抽到陌生课文咋办","试讲时卡壳了怎么圆回来","面试抽到没准备过的题怎么办"],"h":0},{"q":"什么是国家主权？","a":"国家主权指国家独立自主处理内外事务的最高权力，包括对内的管辖权和对外的独立权、平等权。主权意味着国家有权决定自己的政治制度、法律和发展道路，不受外部干涉。主权平等是国际法和联合国宪章的基本原则。","v":["为什么不干涉内政","主权是什么意思","国家主权包括什么"],"h":0},{"q":"世界的物质统一性原理是什么？","a":"世界统一于物质，物质是世界的本原。自然界是物质的，人类社会本质上也是物质的，意识是物质世界长期发展的产物并依赖于物质。世界的统一性不在于某种具体形态，而在于客观实在性；这一原理是一切从实际出发的哲学依据。","v":["世界统一于什么","为什么世界是物质的","物质统一性原理"],"h":0},{"q":"有机物中碳原子的杂化方式有哪些？","a":"有机物中碳常见三种杂化：只形成四个单键时为sp3杂化呈四面体构型；含一个双键时为sp2杂化呈平面三角形；含三键时为sp杂化呈直线形。杂化方式决定键角和空间形状，也影响键长与反应活性，是判断分子构型的第一步。","v":["sp2杂化什么构型","怎么判断碳的杂化","碳的杂化类型"],"h":0},{"q":"开发前端应用时需要准备哪些工具和环境配置文件？","a":"需安装 Node.js 和 npm，并且准备好 HTML/CSS/JS 文件以及可能的构建脚本（如 Webpack 或 Rollup）。","v":["做前端要装哪些工具和配置文件","前端开发得准备什么工具和环境配置","开发前端应用需要哪些工具和环境配置文件"],"h":0},{"q":"文献管理软件与引用规范","a":"写论文和报告时用文献管理软件能省下大量手工整理的时间。常见选择有 NoteExpress（图书馆讲座里经常讲，对中文文献支持较好）、EndNote（投稿国际期刊常用）、Zotero（免费开源、浏览器插件抓取方便）。基本用法是：建库并分文件夹、按主题导入题录、把 PDF 附件关联到题录、在 Word 里插入引用并自动生成文后参考文献。关键习惯是边读边记录——读完一篇就把研究问题、方法、数据、结论和可用之处写进笔记，否则过两周就只剩一个文件名。引用格式要按目标期刊或课程要求统一，中英文文献的著录规则不同，学位论文另有学校的格式规范文件。图书馆的讲座培训和在线课程里都有软件实操教学。","v":["EndNote","Zotero","写论文用哪个文献管理软件好","参考文献","参考文献引用格式怎么弄","引用格式"],"h":0},{"q":"如何区分日常压力与严重抑郁症状？","a":"日常压力多与具体事件相关，事情缓解后情绪一般好转，生活工作基本正常；抑郁则表现为持续两周以上的情绪低落、兴趣减退，常伴睡眠、食欲、精力和注意力改变，明显影响学习工作与社交，严重时出现自伤念头，应及时就医评估。","v":["怎么分辨日常压力和严重抑郁","日常压力跟严重抑郁怎么辨别","普通压力和抑郁症状咋区分开"],"h":0},{"q":"为什么英文疑问词读起来像“歪”？","a":"梗答案是“因为问题问多了，路就走歪了”。它把英文疑问词的发音与汉字“歪”联系起来，再编造一条因果链。这类中英谐音梗的思路是望文生义，用发音相似做幽默联想，不追求语义上的严谨。","v":["英文为什么读歪","英文疑问词谐音梗","问多了路就歪是什么梗"],"h":0},{"q":"电荷守恒定律说什么？","a":"孤立系统中电荷的代数和保持不变，电荷既不能被创造也不能被消灭，只能从一个物体转移到另一个物体。它是物理学基本守恒律之一，在电路分析和粒子反应中都必须遵守。","v":["电荷为什么守恒","电荷守恒定律内容","电荷守恒应用"],"h":0},{"q":"SQLite的查询为什么有时比全扫描还慢？","a":"当索引选择性差、命中表中大部分行时，走索引需要大量回表随机 I/O，反而比顺序全表扫描慢；缺少统计信息（未执行 ANALYZE）也可能让查询计划选错索引。","v":["SQLite查询为啥有时候比全表扫描还慢","SQLite查询比全扫描慢是什么原因","SQLite走查询怎么反而比全扫描慢"],"h":0},{"q":"如何正确填写收件人和邮件主题？","a":"收件人栏填写对方完整、准确的邮箱地址（多人可用抄送/密送）；主题栏用简短一句话概括邮件核心事由，必要时加上时间或事项标识，便于对方识别和检索。","v":["写邮件收件人和主题要注意什么","发邮件时收件人地址和主题栏怎么填","邮件收件人和主题该怎么写才规范"],"h":0},{"q":"什么是食品保质期和保存期？","a":"保质期是厂家承诺的品质期限，保存期（推荐食用期）是最后食用期限。过期食品不一定立即变质，但风味和安全无保证。","v":["保质期怎么定","保质期过了能吃吗","食品过期"],"h":0},{"q":"如何通过线上渠道提交 Git 代码变更请求？","a":"登录 GitHub 或 Bitbucket 网站，在项目页面点击 Pull Request 按钮发起。","v":["GitHub上提交代码变更请求的步骤","Git变更请求咋从线上提","在网页上怎么发起Git代码变更请求"],"h":0},{"q":"如何在手机应用自助完成教资面试模拟测试？","a":"教资面试没有官方统一的手机模考应用。可依据中小学教师资格考试网公布的面试大纲和流程（结构化问答、试讲、答辩），用手机自行计时录像练习；若使用第三方备考App，按其内置的面试练习功能提示操作即可。","v":["手机应用里怎么自助练教资面试模拟","教资面试模拟测试怎么在手机上自己做","用手机应用做教资面试模考怎么操作"],"h":0},{"q":"校内电动车能在宿舍楼道里充电吗？","a":"禁止在宿舍楼、教学楼、实验室的楼道、楼梯间、门厅停放或充电，也禁止把电池带回宿舍充电。校内设有集中的非机动车停放区和充电设施，充电时不要私拉乱接电线，充完电及时拔掉插头。","v":["校内电动车去哪充电","楼道里能停电动车吗","电动车电池能带回宿舍吗"],"h":0},{"q":"光的干涉需要什么条件？","a":"两束光要产生稳定干涉，必须频率相同、振动方向相同、相位差恒定，即相干光。普通光源发出的光不相干，需通过分波前或分振幅方法获得相干光，如杨氏双缝和薄膜干涉。","v":["干涉条件","杨氏双缝干涉","相干光是什么"],"h":0},{"q":"档案如何寄送到工作单位？","a":"毕业生档案不能由个人自行快递或自带。应向学校档案管理部门（或就业指导中心）提供接收单位/人才服务机构的名称、地址、联系人和电话，由学校通过机要通信或EMS“公对公”方式转递。","v":["档案寄送单位走什么流程","档案怎么寄到工作单位去","毕业生档案如何转递到单位"],"h":0},{"q":"使用云服务时月费是多少且会持续收费还是有期限限制？","a":"费用和收费方式取决于具体云服务商及套餐：多数网盘/云服务提供少量免费空间，超出后按月或按年订阅扩容，订阅到期不续费则停止扩容服务（部分有免费试用期，到期自动转为付费需留意）。请查看所用服务的官方资费说明。","v":["云服务收费是按月一直收吗","云服务月费多少会一直扣还是有期限","用云服务每个月多少钱有没有期限"],"h":0},{"q":"动漫里的热血主角有什么套路？","a":"热血主角常出身平凡、有明确目标、伙伴众多，通过不断战斗变强，强调友情努力和永不放弃。这种套路符合青少年成长心理，容易引发代入和共鸣。","v":["为什么热血漫好看","少年漫特点","热血动漫套路"],"h":0},{"q":"最惠国待遇是什么意思？", q":"汽车保险买哪些？","a":"交强险是法定必买；商业险建议第三者责任险（额度尽量高）、车损险，按需加乘员险和医保外用药责任险。玻璃险、划痕险等视车辆情况选择，无需全险堆砌。","v":["汽车保险买哪几种","第三者险买多少","车险必须买什么"],"h":0},{"q":"哈希索引和树索引各自适合什么查询类型？","a":"哈希索引用哈希值定位，等值查询非常快，但无法支持范围查找和排序，因为哈希值不保留原有顺序。树索引的键有序排列，既能等值查找也能做范围扫描和排序。因此内存表或只做精确匹配的场景可用哈希索引，绝大多数需要区间、排序、前缀匹配的数据库场景都选择B+树类索引。","v":["什么场景用哈希索引","哈希索引为什么不能范围查询","哈希索引和B+树区别"],"h":0},{"q":"合并分支时不自动解决冲突如何处理？","a":"手动打开有冲突的文件，删除冲突标记并保留正确内容，再用 git add 标记为已解决，最后 git commit 完成合并；想放弃合并可执行 git merge --abort。","v":["git 合并分支冲突不自动解决怎么处理","分支合并时冲突没自动处理咋办","合并分支冲突不自动解决怎么办"],"h":0},{"q":"如何自助办理补考资格确认手续？","a":"各校流程不同，一般需登录本校教务系统，在补考报名或考试管理相关模块提交申请；具体入口和步骤请以学校教务处发布的补考通知为准。","v":["自助确认补考资格要走什么流程","补考资格确认怎么自己办","补考资格确认手续自己怎么办"],"h":0},{"q":"怎么判断一句歇后语用得对不对？","a":"看三点：一是前后两部分是否对应得上，别张冠李戴；二是感情色彩是否符合场合，褒义贬义别弄反；三是对方能不能听懂，尤其是带方言谐音的。拿不准时宁可不用，也别用错闹笑话。","v":["歇后语使用注意","歇后语怎么用才对","歇后语用错怎么办"],"h":0},{"q":"如何判断自己是不是有压力了？","a":"可以从情绪、身体和行为三方面的变化来判断：如容易紧张烦躁、情绪低落、注意力下降，失眠或食欲改变、头痛乏力，以及拖延、回避社交等。若这些状态持续存在并影响到学习生活，建议寻求专业帮助。","v":["怎么知道自己是不是压力大了","我是不是有压力了该怎么看出来","有什么办法判断自己有没有压力"],"h":0},{"q":"早睡早起身体好有道理吗？","a":"有一定道理。规律作息有助于维持生物钟稳定，保证睡眠时长和深睡比例，对免疫、记忆巩固和情绪都有好处。但“早”没有统一标准，关键是规律和睡够，盲目过早反而可能睡眠不足。","v":["作息规律重要性","几点睡算早睡","早睡早起为什么好"],"h":0},{"q":"社会形态更替的规律性和人的选择性是什么关系？","a":"社会形态依次更替有客观规律，由生产力与生产关系、经济基础与上层建筑的矛盾运动决定，是不以人的意志为转移的。同时人在历史面前有选择性：可以在规律允许的范围内选择发展道路、作出创造，但不能违背基本规律。规律性与选择性是辩证统一的。","v":["历史能随意选择吗","社会形态能跨越吗","规律性和选择性"],"h":0},{"q":"湖南湖北的名称怎么来的？","a":"湖南因位于洞庭湖以南得名，湖北因位于洞庭湖以北得名，二者以洞庭湖为界。宋代设荆湖南路、荆湖北路，简称湖南、湖北。两省同属荆楚文化圈，语言饮食相近。","v":["以洞庭湖为界","湖南湖北名字由来","荆楚文化"],"h":0},{"q":"使用 pandas 进行数据处理时常出现内存不足的问题，如何解决？","a":"pandas 没有可调的“缓存大小”。可用 read_csv 的 chunksize 分批读取处理，只读取需要的列并指定更省内存的 dtype（如 category、int32），及时删除中间变量释放内存；数据量过大时可改用 Dask、Polars 或数据库。","v":["pandas 内存不够用有什么办法","pandas 处理数据老内存不够咋办","用 pandas 跑数据内存不足怎么解决"],"h":0},{"q":"绿植能净化空气吗？","a":"实验条件下部分绿植可吸附少量甲醛和颗粒物，但家庭环境中的净化量远不足以替代通风。养绿植主要价值在美化环境和情绪放松，除甲醛还是靠持续开窗通风。","v":["家里放什么植物好","植物除甲醛有用吗"],"h":0},{"q":"风力作用主要塑造什么地貌？","a":"风蚀形成风蚀蘑菇、雅丹和风蚀洼地；风积形成沙丘和黄土堆积。风力作用在干旱半干旱地区最显著，因为植被稀少、沙源丰富且风力强劲。","v":["雅丹地貌怎么形成","风力地貌有哪些","黄土是风吹来的吗"],"h":0},{"q":"党的组织建设包括哪些方面？","a":"党的组织建设包括民主集中制建设、干部队伍建设和基层党组织建设等内容。要贯彻新时代党的组织路线，建设忠诚干净担当的高素质干部队伍，把基层党组织建设成为坚强战斗堡垒。","v":["基层党组织作用","好干部标准","组织建设包括什么"],"h":0},{"q":"成绩单的有效期是多久呢？","a":"成绩单本身是学业成绩的正式记录，一般没有统一的“有效期”，可长期向学校教务部门申请开具。但接收单位（如留学院校、用人单位）可能要求提供近期开具或加盖公章的成绩单，具体以对方要求为准。","v":["成绩单有效期是多长时间","成绩单有没有期限限制","成绩单能用多久啊"],"h":0},{"q":"宿舍网络接入方式","a":"东校区学生宿舍房间内提供网络端口，可使用网线接入校园网，同时校园范围内覆盖了校园无线网络，宿舍、教学楼、图书馆等区域均可用校园账号登录。上网账号一般与学生学号一致，初始密码和登录方式由信息化办公室在迎新和开学通知中说明，首次登录后应及时修改密码。宿舍内如使用无线路由器，需注意不要在宿舍内私自改动公共线路，也不要架设对外提供服务的设备。校园网访问校外资源、部分学术数据库和校内业务系统的方式有差别，校外访问校内资源一般需要通过学校 VPN，具体以信息化办公室公布的方法为准。","v":["WiFi","上网","宿舍无线网怎么登录？","宿舍有网线口能上网吗？","宿舍网","宿舍里能装无线路由器吗？"],"h":0},{"q":"打印机打出来的字有一道道白条是怎么回事？","a":"先取出墨盒或硒鼓轻轻摇晃几下再装回，然后运行打印机自带的清洁程序；如果白条还在，通常需要更换墨盒或硒鼓。","v":["打出来的字有白道子","打印有白条怎么处理","打印机出白条怎么办"],"h":0},{"q":"申请语言成绩未达到要求的项目怎么办？","a":"可重考语言考试提高分数；或申请目标院校的语言班/预科，部分院校可发放条件录取；也可考虑接受其他语言成绩或语言要求较低的项目。具体以院校官方要求为准。","v":["申请项目时语言成绩没到线怎么办","语言分没达标还能申请这个项目吗","语言成绩不够项目要求该咋整"],"h":0},{"q":"安装扩展时遇到权限请求怎么办？","a":"先看清扩展申请的权限及其用途，确认来源可信、权限与功能相符后再点允许；若权限明显超出功能需要或来源不明，建议取消安装。","v":["安装插件提示要权限怎么办","扩展要权限的时候我要不要点允许","装扩展弹出权限请求该咋处理"],"h":0},{"q":"奖学金申请成功后多久能拿到奖金？","a":"发放时间因奖学金种类和学校而异，一般在评审公示结束、财务审批完成后打款，具体到账时间以本校学生资助管理部门的通知为准。","v":["奖学金的钱一般什么时候打过来"],"h":0},{"q":"如何保存一个网页上的图片到浏览器书签栏中收藏起来？","a":"书签栏收藏的是网页链接，不是图片文件。可右键图片选择“在新标签页中打开图片”，再按 Ctrl+D（Mac 为 Command+D）添加书签并选择保存到书签栏。若想保存图片本身，则右键选择“图片另存为”存到本地文件夹。","v":["想把网页图片收藏到书签栏该咋操作","网页上的图片怎么存到浏览器书签栏里","网页图片怎样加到书签栏收藏"],"h":0},{"q":"转专业后新专业课程绩点怎么算？","a":"转专业后按新专业培养方案认定课程并计算绩点，原课程是否计入以学院认定结果为准。具体规则以学校最新通知为准。","v":["换专业后绩点怎么重新算","转专业绩点按哪个方案算","转专业课程绩点怎么认定"],"h":0},{"q":"四六级报名时间在每年的什么时候开始和结束？","a":"四六级报名一般每年两次，上半年多在3月前后、下半年多在9月前后，各省和各校具体起止时间不同，请以所在省份教育考试院及学校教务处的通知为准。","v":["四六级报名一般几月开始几月结束","四六级每年报名啥时候开始啥时候截止","每年四六级报名时间大概是什么时候"],"h":0},{"q":"驾照过期了还能正常换证吗？","a":"过期一年内通常可以直接换证，超过一年可能需要重考科目一，过期期间不要开车上路，具体以官方最新说明为准。","v":["驾照到期没换怎么办","驾照过期还能换新证吗","驾驶证过期了怎么换"],"h":0},{"q":"食堂刷卡失败或充值没到账，该找谁处理？","a":"刷卡失败多为余额不足或卡片消磁，可先到圈存机查余额，仍无法解决则到一卡通服务中心处理；充值未到账需保留支付订单号，到服务中心登记核查。反映问题时尽量提供具体时间、食堂名称和窗口位置。","v":["一卡通充值没到账找谁","食堂刷卡刷不了怎么办","食堂吃出异物怎么反映"],"h":0},{"q":"矿产资源和岩石有什么关系？","a":"矿产是有开采价值的矿物或岩石，赋存在地壳中。岩浆活动可形成金属矿，沉积作用可形成煤和沉积矿床，变质作用可形成宝石和某些金属矿，地质过程决定了矿产的分布规律。","v":["岩石和矿产关系","矿产分布规律","矿产怎么形成"],"h":0},{"q":"服药时间有什么讲究？","a":"按药物特性和医嘱：饭前服（如部分胃药、降糖药）利于吸收；饭后服（如布洛芬、阿司匹林）减少胃刺激；睡前服（如部分降压药、安眠药）配合生理节律；定时服（如抗生素）维持血药浓度。读说明书或问药师。","v":["抗生素要定时吃吗","药该什么时候吃","饭前吃还是饭后吃"],"h":0},{"q":"中国传统婚礼有哪些习俗？","a":"传统婚礼有纳采、问名、纳吉、纳征、请期、亲迎六礼。常见习俗包括媒人说亲、下聘礼、择吉日、迎亲、拜堂、敬酒、闹洞房。红色为主色调，寓意喜庆吉祥。现代婚礼多已简化。","v":["中国传统婚俗","六礼是什么","婚礼为什么用红色"],"h":0},{"q":"找校外租房时如何使用线上平台查找合适的房源信息并进行预约看房？","a":"可登录各大房产网站或APP浏览房东发布的出租房屋，并通过在线聊天工具与业主沟通确认时间安排上门查看。","v":["想在校外租房用网上平台怎么找合适房源看房","找校外房子时线上平台怎么查房源约看房","校外租房怎么用线上平台找房并预约看房"],"h":0},{"q":"查重报告出来后需要准备哪些材料以备答辩使用？","a":"通常需准备查重报告、按查重结果修改后的论文定稿（按学校要求打印相应份数）、答辩演示文稿，以及指导教师评阅意见、答辩申请表等学校规定的表格。具体材料清单以本校学院或研究生院的通知为准。","v":["查重报告出来后备答辩要准备哪些材料","查重结果出来后答辩需要备齐哪些东西","答辩前拿着查重报告还要准备什么材料"],"h":0},{"q":"遇到分支冲突该如何解决并且保持项目进度不中断？","a":"用 git status 找出冲突文件，手动编辑保留正确内容并删除冲突标记，再 git add、git commit 完成合并；若想放弃这次合并，可用 git merge --abort 回到合并前的状态。","v":["分支冲突怎么处理还能不影响项目进度","合并分支起冲突了怎么弄才能不耽误进度","遇到分支冲突如何解决并让项目继续推进"],"h":0},{"q":"退课后，成绩何时会更新到我的档案中？","a":"退课手续审核通过后，教务系统会更新该课程记录（一般标记为退课、不计成绩），具体更新时间以学校教务处安排为准，可向教务处咨询确认。","v":["退课之后成绩啥时候更新到档案","退课了成绩多久进档案","退课后成绩什么时候录入档案"],"h":0},{"q":"如何恢复浏览器的默认书签文件夹设置？","a":"浏览器通常没有单独“恢复默认书签文件夹”的按钮。可先导出备份书签，再在书签管理器中删除自建文件夹、把书签移回“书签栏/其他书签”；若要恢复浏览器整体默认配置，可在设置中选择重置设置。","v":["怎么把书签文件夹恢复成默认设置","浏览器书签文件夹能恢复默认吗","浏览器默认书签文件夹怎么恢复"],"h":0},{"q":"心理咨询预约需要提前多久打电话咨询或者在线填写信息呢？","a":"提前多久预约没有统一规定，各心理咨询机构安排不同，建议按该机构公布的预约电话或线上表单尽早预约，并以其说明为准。","v":["心理咨询得提早多久预约打电话或网上填资料","心理咨询预约要提前多久打电话或在线填信息","约心理咨询提前多长时间联系或填表合适"],"h":0},{"q":"在制作 PPT 时，动画效果的使用频率应该怎样控制以保持内容流畅性？","a":"动画宜少而精：每页只对需要强调的重点内容添加动画，全篇尽量统一使用一两种简洁效果（如淡入、擦除），避免每段文字都设置动画或叠加多种特效；页面切换效果也保持统一简洁，这样内容推进更流畅、不分散注意力。","v":["PPT动画用多少合适不影响流畅","PPT里动画效果该控制到什么程度","做PPT时动画频率咋把握才顺"],"h":0},{"q":"周末想去市区，学校附近有共享单车停放点吗？","a":"学校周边通常设有共享单车停放区，按App地图指引在指定区域取还车；具体停放范围以现场标识和学校最新通知为准。","v":["共享单车停在哪","周末骑共享单车去市区怎么找车","学校附近哪有共享单车"],"h":0},{"q":"办理四六级考试报名手续需要什么步骤？","a":"一般按学校通知的时间登录全国大学英语四、六级考试报名网注册账号，填写并核对个人信息与学籍，选择报考级别和考点，上传符合要求的照片，完成网上缴费并确认报名状态；部分学校由教务处统一组织报名，具体以本校通知为准。","v":["四六级报名要走哪些流程","四六级考试报名步骤是怎样的","报名四六级考试需要办什么手续"],"h":0},{"q":"怎么办理自行车的临时借用手续？","a":"各校或各借车点的规定不同，建议先咨询学校后勤/保卫部门或查看借车点说明；一般需要凭学生证或校园卡登记后借用。","v":["借用自行车临时手续如何办理","怎么办理自行车临时借用的流程","自行车临时借用手续怎么办"],"h":0},{"q":"健身时如何避免受伤？","a":"充分热身、动作标准优先于重量、循序渐进增加负荷、注意休息恢复、倾听身体信号（疼痛时停止）。新手建议请教练指导动作。","v":["健身动作错误","健身怎么不受伤","新手健身注意什么"],"h":0},{"q":"PPT 母版的背景颜色设置为白色后是否会影响所有幻灯片？","a":"会影响。母版中设置的背景会应用到所有基于该母版及版式的幻灯片；只有单独为某张幻灯片自定义了背景（或隐藏背景图形）时，该页才保留自己的设置。","v":["PPT 母版背景设成白色会影响到全部幻灯片吗","PPT母版背景设成白色所有幻灯片都会变吗","PPT 母版背景颜色设白后所有页都跟着变吗"],"h":0},{"q":"氢是谁发现的？","a":"英国科学家卡文迪许在十八世纪六十年代用金属与酸反应制得氢气并确认它是独立气体，命名为可燃空气。拉瓦锡后来命名氢为 hydrogen，意为生成水的元素，因其燃烧产物是水。","v":["hydrogen词源","卡文迪许氢气","氢气谁发现的"],"h":0},{"q":"古琴有什么文化意义？","a":"古琴是中国最古老的弹拨乐器之一，音色古朴清淡。它被尊为国乐之父、圣人之器，琴棋书画为文人雅士的四艺，古琴列首位。弹奏讲究心境和意境，《高山流水》典故即与古琴有关。","v":["古琴和古筝区别","古琴是什么","高山流水典故"],"h":0},{"q":"校园里突发急病或受伤该怎么处理？","a":"先确保自身安全并拨打急救电话，同时联系校医院或辅导员协助，不要随意搬动伤者；校内应急联络方式以学校最新通知为准。","v":["在学校突然晕倒怎么办","校园受伤了怎么急救","突发急病该找谁"],"h":0},{"q":"办理图书馆借书手续需要提前多久在线提交申请表单？","a":"一般借书无需提前在线提交申请表单，凭本人借书证或校园卡到馆办理即可；如有特殊要求，请以所在图书馆的规定为准。","v":["借书要提前几天在网上填申请","去图书馆借书得提前多久在线交表","图书馆借书需要提前网上申请吗"],"h":0},{"q":"使用校园网需要支付费用吗？如果是免费的，请说明有效期。","a":"各校规定不同：有的学校校园网免费使用，有的按月、学期或学年收取网费。是否收费及计费周期请以本校网络中心公布的资费说明为准。","v":["学校校园网收费吗，有效期多长","校园网是免费还是有费用，期限怎么算","校园网用不用交钱，免费的话能用多久"],"h":0},{"q":"电脑连不上WiFi但手机能连上，是什么原因？","a":"多半是电脑的无线网卡驱动或网络配置出了问题，可以先在设备管理器里禁用再启用无线网卡，或者重启路由器试试。","v":["手机有网电脑没网咋回事","电脑搜不到WiFi手机却可以","笔记本连不上无线网怎么弄"],"h":0},{"q":"洋流是怎么形成的？如何分类？","a":"洋流按成因分风海流密度流和补偿流，盛行风是主要动力，地转偏向力和陆地轮廓影响方向。按性质分暖流和寒流，由低纬流向高纬的是暖流、由高纬流向低纬的是寒流。北半球中低纬海区形成顺时针环流、南半球逆时针，北半球中高纬形成逆时针环流。","v":["暖流和寒流区别","洋流分布规律","洋流怎么形成"],"h":0},{"q":"在制作 PPT 时应该提前多久准备文字内容以便留出时间进行润色优化？","a":"没有统一的时间标准。建议按汇报或演讲的截止时间倒推安排：先完成文字初稿，再进入排版美化，并为文字修改和润色预留出缓冲时间，具体时长视内容篇幅和项目周期而定。","v":["PPT文字稿一般提前多长时间写好留润色","做PPT的文字内容要提前多久开始准备","准备PPT文字得提早多久才够时间优化"],"h":0},{"q 怎么发展循环经济"],"h":0},{"q":"重修课程如何报名？","a":"一般在学校规定的重修报名期内，通过教务系统提交重修申请并按要求缴费，之后跟随相应班级重新学习并参加课程考核；具体流程与时间以本校教务处通知为准。","v":["想重修一门课要怎么报","重修课怎么报名啊","重修课程的报名流程是啥"],"h":0},{"q":"什么是战争？","a":"战争是政治集团之间、民族或国家之间为达成特定目的而进行的有组织的武装斗争，是政治通过暴力手段的延续。按规模性质可分为局部战争与全面战争、正义战争与非正义战争等。战争造成巨大人员和社会代价，因此现代国际体系强调以和平方式解决争端。","v":["战争是什么","战争有哪些类型","战争的本质是什么"],"h":0},{"q":"强度条件怎么用？","a":"强度条件要求最大工作应力不超过材料许用应力，据此可校核构件是否安全、确定所需截面尺寸或求许可载荷。许用应力由极限应力除以安全系数得到，塑性材料取屈服极限、脆性材料取强度极限。安全系数要考虑载荷不确定性和失效后果。","v":["安全系数取多大","强度条件三用途","许用应力怎么定"],"h":0},{"q":"如何设置双重验证？","a":"在账号安全设置中找到“双重验证/两步验证”并开启，按提示绑定手机号或身份验证器应用，输入收到的验证码完成验证。开启通知提醒不等于双重验证。","v":["双重验证怎么开通啊","想开启双重验证该怎么弄","账号两步验证在哪里设置"],"h":0},{"q":"拼图和数独锻炼什么能力？","a":"拼图训练观察、空间想象和耐心，数独锻炼逻辑推理和专注。两者规则简单、入门容易，能在安静的重复中找到秩序感和成就感。","v":["拼图锻炼什么","数独怎么解","数独有什么用"],"h":0},{"q":"绩点计算时是否包括重修的成绩和不及格课程的学分？","a":"各校规定不同：不及格课程一般按0绩点计入学分绩点；重修成绩有的学校用新成绩替代原成绩，有的两次成绩都计入。请以本校学籍管理或成绩管理规定为准。","v":["挂科和重修的成绩学分会计入绩点吗","算绩点时重修成绩和挂科课程学分算不算","绩点计算包不包括重修成绩和不及格学分"],"h":0},{"q":"公司可以随意扣工资吗？","a":"用人单位不得克扣或无故拖欠工资。只有在劳动者造成经济损失、缺勤等法定情形下才可按规定扣减，且每月扣减一般不超过当月工资的20%，扣后不得低于当地最低工资标准。","v":["乱扣工资怎么办","公司扣工资合法吗","工资能被扣多少"],"h":0},{"q":"去哪个地方可以找到卡务中心来办理新卡的领取和充值手续？","a":"各校设置不同，校园卡（卡务）中心一般设在校园卡服务大厅或后勤、信息化服务部门，具体位置请以学校官网通知或校园服务热线的说明为准。","v":["办新卡领取和充值要去哪个卡务中心","卡务中心位置在哪，领卡充值找谁办","卡务中心在哪，新卡领取和充值去什么地方办"],"h":0},{"q":"在六道口坐15号线能直达哪些地方？","a":"向西一站是终点清华东路西口站，适合去清华大学东门、成府路一带；向东可直达奥林匹克公园站、大屯路东站、望京西站、望京站，并延伸到顺义站和俸伯站。去鸟巢、水立方乘到奥林匹克公园站最直接，从六道口出发大约20分钟。","v":["15号线沿线都到哪些站","六道口乘15号线能到望京吗","坐15号线去鸟巢怎么走"],"h":0},{"q":"打印成绩单时如何确保数据准确无误？","a":"打印前先与教务系统中的原始记录逐项核对课程、学分和成绩，可用公式复核总分或绩点；再通过打印预览确认内容完整、没有缺页或错行。","v":["成绩单打印前怎么核对才准确","打印成绩单怎么保证数据没错","打成绩单时如何确认信息准确"],"h":0},{"q":"绩点满了还可以再选其他专业的课程学习吧？","a":"多数高校允许跨专业选修课程，但能否选修、是否计入绩点以及学分上限，需以本校教务规定为准，建议咨询教务部门。","v":["学分绩点修满以后选其他专业的课程行不行","绩点已经满了还能选修别的专业的课吗","绩点达标了再挑别的专业的课来上可以吗"],"h":0},{"q":"跑鞋怎么选？","a":"按用途选：日常慢跑选缓震型、竞速选轻量碳板、越野选防滑抓地。还要看足弓和步态——内旋过度选稳定支撑款。最好傍晚试穿、留出一指余量，跑鞋一般500到800公里更换。","v":["缓震和支撑跑鞋区别","跑鞋多久换","跑鞋怎么挑"],"h":0},{"q":"社团收的会费有没有标准，能随便定吗？","a":"会费标准和收取方式需按学校社团管理规 校流程不同，一般是向学院教务办提交实习单位盖章的实习材料，审核通过后开具实习证明；所需材料和办理时限请咨询本院教务办。","v":["实习证明怎么开，多久能拿到","实习证明的开具流程和领取时间是怎样的","开实习证明要走什么流程，什么时候能领"],"h":0},{"q":"喀斯特地貌发育需要哪些条件？","a":"喀斯特地貌发育需要四个条件：岩石具有可溶性，以石灰岩等碳酸盐岩为主；岩石透水性好、裂隙发育，便于水流渗透；气候湿热降水丰富，水的溶蚀能力强；地势起伏使水流动通畅。地表形成石芽峰林峰丛和溶沟，地下形成溶洞地下河和石钟乳石笋石柱。","v":["喀斯特发育条件","峰林是什么地貌","石钟乳怎么形成"],"h":0},{"q":"什么是后印象派？","a":"后印象派是十九世纪末在印象派基础上发展出来的艺术倾向，代表画家塞尚、梵高、高更。他们不满足于印象派对光色的客观记录，更强调主观情感、结构探索和象征意味，为现代艺术奠定了基础。","v":["后印象派和印象派区别","后印象派是什么","梵高为什么著名"],"h":0},{"q":"一句话证明你是学生，怎么回？","a":"神回复是“我的假期作业一个字都没动”。它用一个人人熟悉的场景瞬间建立身份认同，还顺带抖出拖延症。好的神回复往往不描述身份，而是抛出一个只有当事人才懂的细节。","v":["一句话证明是学生","假期作业没动","学生神回复"],"h":0},{"q":"中国农业大学校园卡丢了怎么挂失？","a":"卡片丢失应当立即通过自助终端、企业微信号或者网络中心办理挂失，挂失后原卡即停止使用，避免被他人冒用消费；确认无法找回后再申请补办新卡。校园卡中心服务电话总机为 62738000，东区拨 0，西区拨 819；校园卡管理中心卡务科电话东区 62736133、西区 62734719。","v":[],"h":0},{"q":"死锁产生的必要条件是什么？","a":"死锁指多个进程互相等待对方持有的资源而无法推进。产生必须同时满足四个条件：资源互斥使用、占有资源同时申请新资源、资源不可被强行剥夺、形成循环等待链。破坏任一条件即可预防死锁，其中打破循环等待最常用，方法是给资源编号并要求按序申请。","v":["怎么预防死锁","死锁产生的条件","死锁四个必要条件"],"h":0},{"q":"饮食健康与营养搭配建议","a":"在食堂长期就餐要做到营养均衡并不难，关键是结构上保证主食、蛋白质和蔬菜的搭配：主食可以粗细结合，用杂粮饭、玉米、红薯替代一部分白米饭；蛋白质来源尽量每天有鸡蛋、豆制品、瘦肉或鱼类；蔬菜每天保证一定量，颜色尽量多样。食堂的低脂餐窗口、清蒸和水煮类菜品适合控制体重的同学，油炸、红烧和糖醋类菜品热量偏高，可以偶尔吃而不是天天点。含糖饮料和奶茶是容易被忽略的热量来源，日常以白水、茶水或无糖饮品为主更合适。三餐时间尽量规律，不吃早餐和长期夜宵对肠胃和作息都不利。有慢性疾病或特殊营养需求的同学，建议咨询校医院医生或专业营养师后再调整饮食结构。食堂菜品油盐含量普遍略高，可以用清水涮一下过油菜，或者主食搭配清淡汤品来平衡。运动量较大的同学要注意补足主食和蛋白质，长期只吃沙拉并不适合高强度的训练安排。","v":["健康饮食","减脂","吃胖了","在食堂怎么吃才能减脂？","均衡","每天食堂吃饭怎么搭配均衡？"],"h":0},{"q":"工程制图课程怎么学效率高？","a":"建议把画图和读图结合：先吃透点线面投影和基本体规律，再用组合体大量练习三视图的画与读，空间想象能力就是练出来的；剖视断面和零件装配图要在理解表达目的基础上记忆画法规定。学有余力可用AutoCAD和SolidWorks把视图与三维模型对照，理解会更直观。","v":["三视图空间想象怎么练","工程制图怎么学","画法几何难学吗"],"h":0},{"q":"犯罪的社会学解释有哪些？","a":"社会学从社会结构角度解释犯罪：失范理论认为当社会目标与合法手段脱节时易产生越轨；紧张理论强调压力下的适应方式；标签理论关注被标签后的身份转变；社会控制理论关注社会纽带的作用。这些视角强调犯罪行为的社会根源，而非单纯个人道德问题。","v":["为什么会产生犯罪","失范理论怎么解释犯罪","犯罪的社会学解释"],"h":0},{"q":"购买校园套餐后多久能生效，具体地点在哪找人咨询？","a":"生效时间和咨询地点因学校及运营商而异，请以购买时的套餐说明为准，或向学校校园卡/后勤服务部门及运营商客服确认。","v":["买了校园套餐生效时间和咨询地点在哪","校园套餐买完多久生效去哪问人","校园套餐啥时候生效找谁咨询"],"h":0},{"q":"外来物种一定有害吗？","a": 请","macOS系统更新申请在哪提交"],"h":0},{"q":"钨为什么用作灯丝？","a":"钨是所有金属中熔点最高的，在高温下仍能保持固态且不易蒸发，因此适合做白炽灯灯丝。通电后钨丝发热到白炽状态发出可见光，惰性气体或真空环境可防止其氧化烧断。","v":["灯泡里为什么充惰性气体","钨为什么做灯丝","钨的熔点"],"h":0},{"q":"鹦鹉为什么能学人说话？","a":"鹦鹉有特殊的发声器官和强大的学习能力。它们能精确控制气流通过鸣管发出复杂声音，大脑中有专门负责声音学习的区域，社交性又强，会通过模仿同伴或主人的声音来融入群体、获得关注。不过鹦鹉多是机械模仿，并不真正理解话语的抽象含义。","v":["什么鸟会学舌","鹦鹉为什么学说话","鹦鹉听得懂人话吗"],"h":0},{"q":"什么是栖息地破坏？","a":"栖息地破坏指动物植物生存环境被人类活动改变或消灭，如森林砍伐、湿地填埋、城市扩张、河流筑坝。这是当前物种灭绝的首要原因，因为生物失去食物、庇护和繁殖场所，种群会急剧萎缩。保护措施包括建立自然保护区、生态廊道和恢复退化栖息地。","v":["动物为什么濒危","怎么保护野生动物","栖息地破坏是什么"],"h":0},{"q":"群公告怎样快速发布给全部成员？","a":"以微信为例：群主或管理员进入群聊，点击右上角进入群设置，选择“群公告”，编辑内容后发布，公告会通知到全体群成员。","v":["群公告怎么发布让大家都看到","群公告怎么快速通知所有人","群里公告怎么一次发给全体成员"],"h":0},{"q":"如何区分安卓与 iPhone 的通知栏位置差异？","a":"两者的通知一般都出现在屏幕顶部：iPhone 从屏幕左上角向下滑动打开通知中心，安卓从屏幕顶部向下滑动打开通知栏。","v":["安卓与iPhone通知栏下拉位置区别在哪","安卓和iPhone通知栏位置有啥不一样","怎么区分安卓跟iPhone的通知栏在哪"],"h":0},{"q":"网页里想让一个元素始终固定在右下角，不随滚动跑掉，怎么写最省事？","a":"给该元素设置 position: fixed，并用 right 和 bottom 定位到右下角，同时注意给页面内容留出空间避免被遮挡。","v":["元素不跟着滚动跑怎么设置？","右下角悬浮按钮用 CSS 怎么写？","怎么让按钮一直固定在页面右下角？"],"h":0},{"q":"打印成绩单时如何设置边框和颜色以提高清晰度？","a":"在“开始”选项卡的“边框”按钮（或“设置单元格格式—边框”）中为成绩表添加边框线，选用深色线条配浅色底纹以形成对比；若要打印网格线，可在“页面布局”中勾选网格线的“打印”，并先用打印预览确认效果。","v":["成绩单打印时怎么调边框和颜色才清晰","打印成绩单怎么设边框颜色提高清晰度","打印成绩单边框颜色怎么设置更清楚"],"h":0},{"q":"如何延长电子设备寿命？","a":"避免高温和潮湿环境、使用正规充电器、避免过度放电、定期清理灰尘和系统垃圾、及时更新系统补丁、避免摔落。","v":["手机怎么用久一点","电子产品怎么保养","电脑保养"],"h":0},{"q":"扫描文件为何无法识别文字内容？","a":"可能是扫描分辨率过低、图像模糊或倾斜，文字为手写或特殊字体，也可能所用软件未启用OCR识别功能。建议以300dpi以上重新扫描、摆正文档，再用支持OCR的软件识别。","v":["扫描件为什么提取不了文字内容","扫描后文字识别不出来是什么原因","扫描的文件怎么识别不出文字"],"h":0},{"q":"贾宝玉的丫鬟是什么歇后语？","a":"答案是“多愁善感”。《红楼梦》里宝玉和丫鬟们情感细腻、时常伤春悲秋，借用来形容人感情丰富、容易触景生情。这句歇后语带一点书卷气，多用来打趣心思敏感的人。","v":["多愁善感歇后语","红楼梦歇后语","贾宝玉的丫鬟下一句"],"h":0},{"q":"知网的CAJ和PDF格式有什么区别？","a":"CAJ是知网自有的文档格式，需安装CAJViewer阅读器打开，能较好保留原版排版和批注；PDF是通用格式，多数阅读器都能打开便于打印和分享。下载时若两种格式都有，长期保存建议选PDF通用性更好，需特定功能时用CAJ。","v":["CAJ和PDF区别","CAJ文件怎么打开","知网下载什么格式好"],"h":0},{"q":"校医院能洗牙或者做口腔检查吗？","a":"先通过校医院官方入口查是否设口腔科及可约项目，能约就按预约时段前往；具体服务范围以学校最新通知为准。","v":["校医院有口腔科吗","校医院洗牙怎么约","校医院能看牙吗"],"h":0},{"q":"为什么尺寸数字不能被图线穿过？","a":"尺寸数字是图样中最关键的信息，若被轮廓线中心线或剖面线穿过会降低清晰度，容易造成读图错误。制图标准规定尺寸数字应写在尺寸线上方且不使任何图线通过，不可避免时应将图线断开。保持数字清晰是制图清晰性要求的具体体现。","v":["为什么要断开图线","尺寸数字位置要求","尺寸数字被线穿过怎么办"],"h":0},{"q":"姓名章和闲章有什么区别？","a":"姓名章刻姓名字号、用于署名和凭证，是实用印章；闲章刻格言、诗句、斋号或图像，用于点缀书画、抒发志趣，内容灵活。书法作品常钤姓名章加一至两方闲章，起到平衡章法和增添意趣的作用。","v":["书画怎么盖章","姓名章和闲章区别","闲章刻什么"],"h":0},{"q":"如何在线提交求职实习证明申请材料？","a":"一般需登录学校就业信息网或就业服务系统，找到证明申请相关入口，按提示填写信息并上传所需材料后提交，等待审核。具体入口名称和所需材料以本校就业部门的通知为准。","v":["在线提交实习证明申请要怎么做","实习证明的材料网上怎么交上去","求职实习证明申请材料怎么在线提交"],"h":0},{"q":"校园绿色生活与快递包装循环","a":"学校在生活垃圾分类和源头减量方面提出了明确要求：校内快递服务站要鼓励快递包装循环使用，校内食堂和餐饮单位不得主动提供一次性餐具，并通过张贴节俭标识倡导光盘行动。同学们在日常生活中可以做得更细一些：拆快递时尽量完整拆封，把纸箱、气泡膜交给快递点回收或投入可回收物桶；自带水杯、餐具，减少一次性用品消耗；离开宿舍随手关灯、关空调、关水龙头，洗浴时缩短用水时间；打印材料尽量双面打印、按需打印。这些做法既减少资源浪费，也能降低宿舍的用电用水开支，节约下来的宿舍用电定额用不完的部分不会结转到下月。","v":["包装回收","宿舍平时怎么节约水电","拆完的快递纸箱怎么回收","绿色校园","节水","节约用电"],"h":0},{"q":"安卓手机和 iPhone 的设置界面有什么不同吗？","a":"iOS 的“设置”是统一的分组列表，各项目位置和名称基本固定；Android 的设置界面因厂商（三星、小米等）而异，通常带搜索框和更多可自定义的分类与选项。","v":["iPhone和安卓手机设置界面有啥不一样","安卓手机和iPhone的设置界面区别在哪","安卓跟iPhone的设置界面有什么差别"],"h":0},{"q":"韦达定理说明了什么？","a":"一元二次方程两根之和等于一次项系数除以二次项系数再取相反数，两根之积等于常数项除以二次项系数。它把根与系数联系起来，可用于求根的对称式、判断根的情况，无需显式解出根。","v":["根与系数关系","韦达定理内容","韦达定理应用"],"h":0},{"q":"如何快速计算出某月总销售额并显示前五名的销售员？","a":"以 Excel 为例：先用 SUMIFS 按月份条件汇总该月总销售额；再插入数据透视表，按销售员汇总销售额并降序排序，取前 5 名（也可用 LARGE 或 RANK 配合筛选取前五）。Excel 中没有 TOPN 函数，TOPN 属于 DAX（Power BI/Power Pivot）。","v":["Excel怎么按月份汇总销售额取前五名","Excel里怎么算某月总销售额再挑出前五销售员","用Excel统计月销售额并显示前五名怎么搞"],"h":0},{"q":"报名教资时忘记选择科目怎么办？","a":"在报名信息审核通过前，一般可登录报名系统自行修改或取消后重新填报科目；若已审核通过或已缴费，通常无法自行修改，需及时联系当地教育考试机构咨询处理办法。","v":["报名教资没选科目还能改吗","教资报名时科目忘了选怎么补救","教资报名科目漏选了该咋办"],"h":0},{"q":"人类命运共同体理念的内容是什么？","a":"构建人类命运共同体主张建设持久和平普遍安全共同繁荣开放包容清洁美丽的世界，坚持对话协商共建共享合作共赢，倡导共商共建共享的全球治理观，反映了全人类的共同价值追求。","v":["五个世界指什么","命运共同体是什么","理念意义"],"h":0},{"q":"外甥打灯笼是什么歇后语？","a":"答案是“照旧”，谐音“照舅”——灯笼照着舅舅，表示还是老样子。它借“旧”与“舅”同音，把一句生活场景转化成表示“没有变化”的说法，和“依然如故”意思相当。","v":["外甥打灯笼下一句是什么","照旧歇后语来源","照舅谐音怎么来的"],"h":0},{"q":"什么是'酒令'？","a":"酒令是饮酒时助兴的游戏和规则，形式有猜拳、行令、掷骰、对诗和成语接龙等 ”，右上角消息图标里能看到别人给你的互动，但你点过的赞没有集中列表可查。","v":["微信点赞记录在哪看","微信能查自己点过的赞吗","怎么看我给谁点过赞"],"h":0},{"q":"什么是中心极限定理？","a":"中心极限定理指大量独立同分布随机变量之和（均值）近似服从正态分布，无论原分布是什么。它解释了正态分布的普遍性。","v":["CLT","中心极限定理是什么","为什么很多现象正态"],"h":0},{"q":"校园WiFi是否有免费时段或者有效期限制？","a":"各校规定不同。多数校园WiFi对在校师生免费，用校园网账号认证登录，账号在校期间有效，部分学校对流量或时长有限制。具体请咨询本校网络中心或查看其官网说明。","v":["学校WiFi有没有免费时长限制","校园WiFi免费时段和有效期怎么算","校园WiFi有免费时间或者期限吗"],"h":0},{"q":"文化符号为什么容易产生误解？","a":"同一符号在不同文化中可能有完全相反的含义，颜色、手势、动物形象都可能承载不同联想。误解往往源于用自己的文化编码去解读对方符号。跨文化传播中需要了解符号的本地语境，必要时直接询问，避免想当然。","v":["手势为什么会有歧义","文化符号误解例子","颜色在不同文化含义"],"h":0},{"q":"宿舍晾晒与阳台管理","a":"学校宿舍一般设有阳台或公共晾晒区域，同学们可在指定位置晾晒衣物和被褥。按宿舍管理规定，禁止在楼内走廊和房间内私自拉绳或在公共区域随意晾晒衣物，以免影响通行和消防疏散。北京气候干燥、晴天较多，衣物晾晒条件较好，但春季风大、沙尘天气较多，晾晒衣物和被褥建议使用夹子固定，防止被风吹落；雨雪天气应把衣物收回室内或阳台内侧。阳台是消防疏散的重要通道，不要堆放大量杂物和纸箱，也不要封闭阳台或在阳台加装固定设施。顶层或临街房间的阳台使用还需注意安全，不要把身体探出护栏外，也不要在阳台边缘放置花盆等易坠落物品。","v":["宿舍阳台能晒被子和衣服吗","春季风大晒被子要注意什么","晒被子","晾晒","晾衣服","晾衣绳"],"h":0},{"q":"报名国考时是否必须提供学位证才能参加笔试？","a":"不一定。国考按职位表要求执行，有的职位只要求学历，有的同时要求相应学位；报名阶段一般在线填报信息，学历学位证明通常在资格复审时提供。","v":["国考报名没有学位证能参加笔试吗","国考笔试阶段必须交学位证吗","报名国考笔试是不是一定要学位证"],"h":0},{"q":"如何在线申请图书馆借书权限调整？","a":"可先登录学校图书馆网站或网上办事大厅，查找借阅权限相关的申请入口并按提示提交；若没有在线入口，可直接联系图书馆服务台咨询办理方式。","v":["图书馆借书权限调整在网上咋申请","想改借阅权限能线上办吗","网上哪里能申请调整图书馆借阅权限"],"h":0},{"q":"HumanEval第49题modp怎么解？","a":"计算2的n次方对p取模。不要先算2**n再取模——那会产生巨大整数。正确做法是循环n次，每次result=(result*2)%p，从result=1开始。利用模运算的乘法性质，边乘边取模把数值始终控制在p以内。这题考的是对大数取模的数值稳定性意识。","v":["HumanEval模运算","modp解法","第49题2的幂取模"],"h":0},{"q":"质壁分离是怎么回事？","a":"把成熟植物细胞放入高浓度外界溶液，细胞失水，原生质层因伸缩性大而收缩，细胞壁伸缩性小基本不变，于是原生质层与细胞壁逐渐分离，这就是质壁分离。发生的内因是原生质层相当于半透膜且伸缩性大于细胞壁，外因是外界溶液浓度大于细胞液浓度。放入清水可发生质壁分离复原。","v":["为什么能质壁分离","质壁分离原因","质壁分离复原条件"],"h":0},{"q":"什么是景深？","a":"景深是照片中看起来清晰的前后范围。光圈越大景深越浅、背景越虚化，适合人像突出主体；光圈越小景深越深、前后都清晰，适合风光。焦距和拍摄距离也影响景深。控制景深是摄影表达的重要手段。","v":["大光圈小光圈区别","怎么拍出背景虚化","景深是什么"],"h":0},{"q":"图书馆的网上预约座位是否需要提前确认可用性？","a":"预约系统一般会显示座位的可用状态，建议预约前先查看确认；可提前多久预约、是否需要签到确认，以本馆规定为准。","v":["图书馆座位网上预约前用不用先查空没空","网上约图书馆座位得先看看有没有空位吗","预约图书馆座位之前要不要确认一下能不能用"],"h":0},{"q":"瑞雪兆丰年适用于所有地方吗？","a":"不一定。它主要适合有冬季 "如何确认本地分支与远程仓库提交历史相同","怎么查本地分支和远程仓库提交历史是否一样","本地和远程分支的提交记录一致不一致怎么查"],"h":0},{"q":"火车票退改签需要注意什么事项？","a":"主要注意办理时限（退票、改签通常需在列车开车前办理，开车后按规定一般只能改签当日其他列车）、退票手续费按距开车时间长短分档收取、原则上通过原购票渠道（如12306或车站窗口）办理，已打印报销凭证的需先交回。具体规则以铁路12306的最新规定为准。","v":["买好的火车票要退要改，注意啥","退改签火车票得留心哪些地方"],"h":0},{"q":"校园卡怎么绑定手机NFC刷门禁？","a":"需使用学校官方App或校园卡服务中的NFC绑定功能，按提示将校园卡贴近手机写入；具体支持机型与流程以学校最新通知为准。","v":["手机NFC怎么录校园卡","校园卡怎么添加到手机","校园卡能绑手机刷门禁吗"],"h":0},{"q":"食堂饭菜不好吃该找哪个部门反映？","a":"食堂入口或收银台附近一般张贴有管理人员的联系电话和意见二维码，后勤保障部门设有服务监督电话和线上投诉入口，学校层面还设有校长信箱。反映时写清时间、食堂名称、窗口位置和具体情况，附上照片或消费记录，处理效率会明显提高。","v":["对菜品有建议怎么提","食堂意见去哪里投诉","饭菜分量少找谁反映"],"h":0},{"q":"面试前是否必须购买实习证明以增加竞争力？","a":"不需要，也不应该购买实习证明。买卖、伪造实习证明属于造假，一经核实可能被取消录用、辞退，甚至承担相应责任。应通过真实的实习、项目或校园经历来体现实力，并在面试中如实说明。","v":["买实习证明对面试有帮助吗必须买吗","面试前必须买实习证明吗","面试前要不要买实习证明提升竞争力"],"h":0},{"q":"怎么设计一次可信的人工评测？","a":"要点是：明确任务与评分维度、随机化模型与选项顺序、匿名化模型身份、保证足够样本量、设置重复样本检验一致性、公布评分细则和统计方法。缺少任何一环都可能让结论偏向特定模型或特定评分者。","v":["人工评测怎么组织","如何避免评测偏差","评测流程注意什么"],"h":0},{"q":"怎样快速创建表格，并且调整其大小适应文档布局？","a":"在 Word/WPS 文字中用“插入—表格”选择行列数插入表格；插入后拖动表格边框或在“表格工具”中设置行高列宽，也可用“自动调整—根据窗口调整表格”使表格适应页面宽度。","v":["Word里表格怎么建还能调大小","快速做表格并调整尺寸适配文档咋弄","怎么插表格并让它适应页面宽度"],"h":0},{"q":"如何通过网上租房平台找到合适的房源并完成在线签约？","a":"登录租赁服务平台网站，在搜索栏输入地区和房型等条件查找房源，并在详情页阅读房东或中介信息确认无误后，点击在线咨询提交看房需求。待安排好时间上门查看房屋后进行线上签订电子版合同。","v":["想在网上租房平台找合适房源并线上签合同咋操作","网上租房平台怎么找房然后在线签约啊","通过网上租房平台找房和在线签约的流程是啥"],"h":0},{"q":"开启双重认证后，忘记手机验证码如何处理？","a":"短信验证码是一次性的，不能“重设”。收不到时可点击重新获取，或改用平台提供的其他验证方式（验证器应用、备用验证码、备用邮箱等）。若手机已丢失或号码停用，请通过平台的账户申诉流程或联系客服解除/重置双重认证。","v":["双重认证后收不到手机验证码咋处理","开了双重认证手机验证码忘了怎么办","忘记手机验证码双重认证怎么解决"],"h":0},{"q":"辅修课程是否能算作主修成绩，如果可以的话有没有时间限制？","a":"多数学校辅修课程单独记录、单独计算绩点，不直接计入主修绩点；能否折算或替代主修的选修/通识学分，以及申请与认定的年限要求，均以本校教务处的辅修管理规定为准，建议直接咨询教务处。","v":["辅修成绩能算进主修吗有时间限制没","辅修的分数能抵主修吗期限是多久","辅修课算不算主修成绩有没有年限要求"],"h":0},{"q":"读文献时怎么建立自己的知识体系？","a":"围绕研究主题按问题方法理论结论等维度归纳文献，把新文献归入已有框架，记录不同研究之间的关系与演变。可用文献管理工具的标签和笔记功能辅助，定期回顾整理形成主题笔记。知识的系统化能让你从单篇阅读上升到把握领域脉络。","v":["怎么把文献读成自己的知识","文献框架怎么建","读了很多文献还是乱怎么办"],"h":0},{"q":"什么是电影的作者论？","a":"作者论认为导演是电影的主要创作者，其作品应体现个 const messages = document.getElementById('messages');
const input = document.getElementById('input');
function add(role, build){ const wrap=document.createElement('div'); wrap.className='msg '+role; const a=document.createElement('div'); a.className='avatar'; a.textContent=role==='user'?'我':'柒'; const b=document.createElement('div'); b.className='bubble'; build(b); wrap.append(a,b); messages.append(wrap); messages.scrollTop=messages.scrollHeight; return b; }
function find(q){ const k=norm(q); if(!k) return null; if(index.has(k)){ const e=index.get(k); return {item:e.item,kind:e.item.tool?'本地工具':e.kind,score:1}; } let best=null; DATA.forEach(item=>{ const s=dice(k,norm(item.q)); if(!best||s>best.score) best={item,kind:'语义近似',score:s}; }); if(best && best.item.tool) best.kind='本地工具'; return best && best.score>=0.55 ? best : null; }
function nearest(q){ const k=norm(q); return DATA.map(item=>({item,score:dice(k,norm(item.q))})).sort((a,b)=>b.score-a.score).slice(0,3); }
function render(q, hit){ add('bot', b => {
  if (hit && hit.item.tool === 'pelican') {
    const parts = hit.item.a.split(/```html\n?/);
    const intro = document.createElement('p'); intro.textContent = parts[0].trim(); b.append(intro);
    const det = document.createElement('details'); const sum=document.createElement('summary'); sum.textContent='查看完整 HTML（可另存为 pelican.html）'; det.append(sum);
    const pre=document.createElement('pre'); pre.textContent = parts[1] ? parts[1].replace(/```[\s\S]*$/,'').trim() : hit.item.a; det.append(pre); b.append(det);
  } else {
    const p=document.createElement('p'); p.textContent = hit ? hit.item.a : '这个问题还不在演示库里；静态 Demo 不会调用模型，你可以试试相近问题：';
    b.append(p);
    if (!hit) { const chips=document.createElement('div'); chips.className='chips'; nearest(q).forEach(({item})=>{ const btn=document.createElement('button'); btn.textContent=item.q; btn.addEventListener('click',()=>ask(item.q)); chips.append(btn); }); b.append(chips); }
  }
  const meta=document.createElement('div'); meta.className='meta';
  meta.innerHTML = hit ? `<b>${hit.kind}</b> · 匹配度 ${Math.round(hit.score*100)}% · 0 次云端调用 · 答案来自共享问答库` : '<b>未命中</b> · 静态 Demo 不调用模型';
  b.append(meta);
}); }
function ask(q){ q=String(q||'').trim(); if(!q) return; add('user',b=>{const p=document.createElement('p');p.textContent=q;b.append(p);}); input.value=''; add('bot',b=>{const p=document.createElement('p');p.textContent='正在查本地问答库…';b.append(p);}).parentElement.remove(); const t=performance.now(); const hit=find(q); render(q,hit); }
document.getElementById('composer').addEventListener('submit',e=>{e.preventDefault();ask(input.value);});
document.getElementById('chips').addEventListener('click',e=>{const btn=e.target.closest('button[data-q]'); if(btn) ask(btn.dataset.q);});
</script>
</body>
</html>
