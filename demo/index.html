<link rel="stylesheet" href="assets/css/app.css">
<script>
  // 尽早确定主题 / 页面，避免闪烁
  (function () {
    try {
      var raw = localStorage.getItem('qishi-ai.v1');
      if (!raw) { raw = localStorage.getItem('shenmi-bot.v2') || localStorage.getItem('shenmi-bot.v1'); }
      if (raw) {
        var s = JSON.parse(raw);
        if (s && s.theme) document.documentElement.dataset.theme = s.theme;
      }
    } catch (e) {}
    var m = /page=([a-z]+)/.exec(location.search);
    try { if (document.body) document.body.setAttribute('data-page', m ? m[1] : 'chat'); } catch (e) {}
    window.__SB_PAGE__ = m ? m[1] : 'chat';
  })();
</script>
</head>
